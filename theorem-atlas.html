roofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/03_function_families_and_affine_geometry/068_positive_one_run_exact.md","leanCertified":false,"topic":"families","kind":"theorem","in":4,"out":0,"degree":4},{"id":"069","title":"Positive-Projection Degree-Tight Exactness","note":"Let Let be the minimum positive-projection sign-change count from . Then Consequently, if then More generally, suppose factors through a positive weighted sum with sign-change count . If then Finally, the low-alternation regime is exact. If then Interpretation. The positive-projection sign-change count is an exact invariant whenever it meets threshold degree. This turns any matching pair of certificates into an exact value of .","interpretation":"The positive-projection sign-change count is an exact invariant whenever it meets threshold degree. This turns any matching pair of certificates into an exact value of .","claim":"Let\n\n$$ f:\\lbrace0,1\\rbrace^n\\to\\lbrace0,1\\rbrace. $$\n\nLet $C_{+}(f)$ be the minimum positive-projection sign-change count from [013_positive_projection_sign_changes.md](../01_foundations_and_normal_form/013_positive_projection_sign_changes.md). Then\n\n$$ \\deg_{\\pm}(f) \\leq H^{\\ast}(f) \\leq C_{+}(f). $$\n\nConsequently, if\n\n$$ \\deg_{\\pm}(f)=C_{+}(f), $$\n\nthen\n\n$$ H^{\\ast}(f)=\\deg_{\\pm}(f)=C_{+}(f). $$\n\nMore generally, suppose $f$ factors through a positive weighted sum $t$ with sign-change count $C_t(f)$. If\n\n$$ \\deg_{\\pm}(f)=C_t(f), $$\n\nthen\n\n$$ H^{\\ast}(f)=C_t(f). $$\n\nFinally, the low-alternation regime is exact. If\n\n$$ C_{+}(f)\\leq2, $$\n\nthen\n\n$$ H^{\\ast}(f) = \\begin{cases} 0 & \\text{if } f \\text{ is constant},\\cr 1 & \\text{if } f \\text{ is a nonconstant linear threshold function},\\cr 2 & \\text{otherwise}. \\end{cases} $$\n\n> **Interpretation.** The positive-projection sign-change count is an exact invariant whenever it meets threshold degree. This turns any matching pair of certificates into an exact value of $H^{\\ast}$.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/03_function_families_and_affine_geometry/069_positive_projection_degree_tight_exact.md","leanCertified":false,"topic":"families","kind":"theorem","in":3,"out":0,"degree":3},{"id":"070","title":"Low Affine-Free Support Is Exact","note":"Let Suppose where is the affine-free polynomial-threshold support cost from . Then More precisely, In particular, this applies whenever is sign-represented by a polynomial of the form where is affine. It also applies to sign polynomials with no affine part and at most two nonlinear monomials. Interpretation. The affine-free support bound has an exact first nontrivial regime. Any Boolean function whose sign polynomial consists of one affine part plus one genuinely nonlinear monomial is either an LTF already or has e","interpretation":"The affine-free support bound has an exact first nontrivial regime. Any Boolean function whose sign polynomial consists of one affine part plus one genuinely nonlinear monomial is either an LTF already or has exact value two.","claim":"Let\n\n$$ f:\\lbrace0,1\\rbrace^n\\to\\lbrace0,1\\rbrace. $$\n\nSuppose\n\n$$ \\mathrm{afs}_{\\pm}(f)\\leq2, $$\n\nwhere $\\mathrm{afs}_{\\pm}$ is the affine-free polynomial-threshold support cost from [048_affine_free_sparsity_upper_bound.md](048_affine_free_sparsity_upper_bound.md). Then\n\n$$ H^{\\ast}(f)\\leq2. $$\n\nMore precisely,\n\n$$ H^{\\ast}(f) = \\begin{cases} 0 & \\text{if } f \\text{ is constant},\\cr 1 & \\text{if } f \\text{ is a nonconstant linear threshold function},\\cr 2 & \\text{otherwise}. \\end{cases} $$\n\nIn particular, this applies whenever $f$ is sign-represented by a polynomial of the form\n\n$$ P(x)=A(x)+b\\prod_{i\\in S}x_i, \\qquad \\lvert S\\rvert\\geq2, $$\n\nwhere $A$ is affine. It also applies to sign polynomials with no affine part and at most two nonlinear monomials.\n\n> **Interpretation.** The affine-free support bound has an exact first nontrivial regime. Any Boolean function whose sign polynomial consists of one affine part plus one genuinely nonlinear monomial is either an LTF already or has exact value two.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/03_function_families_and_affine_geometry/070_low_affine_free_support_exact.md","leanCertified":false,"topic":"families","kind":"theorem","in":2,"out":2,"degree":4},{"id":"071","title":"Depth-Two Decision Trees Are Exact","note":"Let be computed by a deterministic decision tree of depth at most . Then More precisely, Interpretation. The first adaptive decision-tree case is fully controlled. A depth-two tree can be nonsymmetric and can mix different variables on different branches, but it still never needs more than two heads.","interpretation":"The first adaptive decision-tree case is fully controlled. A depth-two tree can be nonsymmetric and can mix different variables on different branches, but it still never needs more than two heads.","claim":"Let\n\n$$ f:\\lbrace0,1\\rbrace^n\\to\\lbrace0,1\\rbrace $$\n\nbe computed by a deterministic decision tree of depth at most $2$. Then\n\n$$ H^{\\ast}(f)\\leq2. $$\n\nMore precisely,\n\n$$ H^{\\ast}(f) = \\begin{cases} 0 & \\text{if } f \\text{ is constant},\\cr 1 & \\text{if } f \\text{ is a nonconstant linear threshold function},\\cr 2 & \\text{otherwise}. \\end{cases} $$\n\n> **Interpretation.** The first adaptive decision-tree case is fully controlled. A depth-two tree can be nonsymmetric and can mix different variables on different branches, but it still never needs more than two heads.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/03_function_families_and_affine_geometry/071_depth_two_decision_trees_exact.md","leanCertified":false,"topic":"families","kind":"theorem","in":3,"out":0,"degree":3},{"id":"072","title":"Decision-Tree Hybrid Upper Bound","note":"Let be a deterministic decision tree computing Let be the depth of , and let be the number of distinct variables queried anywhere in . For a leaf , let be the set of variables fixed to along the root-to-leaf path, and let be the set of variables fixed to . Let and be the accepting and rejecting leaves. Define the local leaf-profile cost If is nonconstant, then If is constant, then . Interpretation. A decision tree gives several different head certificates. Leaf profiles are ambient-dimension-free and reward one-sid","interpretation":"A decision tree gives several different head certificates. Leaf profiles are ambient-dimension-free and reward one-sided certificates with few literals of one sign. The degree route is polynomial in the number of variables queried when the depth is small. The junta route is best when the tree uses f","claim":"Let $\\mathcal{T}$ be a deterministic decision tree computing\n\n$$ f:\\lbrace0,1\\rbrace^n\\to\\lbrace0,1\\rbrace. $$\n\nLet $d$ be the depth of $\\mathcal{T}$, and let $v$ be the number of distinct variables queried anywhere in $\\mathcal{T}$. For a leaf $\\ell$, let $P_\\ell$ be the set of variables fixed to $1$ along the root-to-leaf path, and let $N_\\ell$ be the set of variables fixed to $0$. Let $\\mathcal{L}_1$ and $\\mathcal{L}_0$ be the accepting and rejecting leaves.\n\nDefine the local leaf-profile cost\n\n$$ \\Lambda(\\mathcal{T}) := \\min\\left\\lbrace \\sum_{\\ell\\in\\mathcal{L}_1}\\min\\lbrace2^{\\lvert P_\\ell\\rvert},2^{\\lvert N_\\ell\\rvert}\\rbrace, \\sum_{\\ell\\in\\mathcal{L}_0}\\min\\lbrace2^{\\lvert P_\\ell\\rvert},2^{\\lvert N_\\ell\\rvert}\\rbrace \\right\\rbrace. $$\n\nIf $f$ is nonconstant, then\n\n$$ H^{\\ast}(f) \\leq \\min\\left\\lbrace \\Lambda(\\mathcal{T}), 2^v-1, 1+\\sum_{r=2}^{\\min\\lbrace d,v\\rbrace}\\binom{v}{r} \\right\\rbrace. $$\n\nIf $f$ is constant, then $H^{\\ast}(f)=0$.\n\n> **Interpretation.** A decision tree gives several different head certificates. Leaf profiles are ambient-dimension-free and reward one-sided certificates with few literals of one sign. The degree route is polynomial in the number of variables queried when the depth is small. The junta route is best when the tree uses few variables overall.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/03_function_families_and_affine_geometry/072_decision_tree_hybrid_upper_bound.md","leanCertified":false,"topic":"families","kind":"theorem","in":3,"out":0,"degree":3},{"id":"073","title":"DNF And CNF Hybrid Upper Bound","note":"Let Suppose has a DNF with consistent nonempty terms where and are disjoint. Let and let be the number of distinct variables appearing in the DNF. If is nonconstant, then The dual statement holds for CNFs with consistent nonempty clauses with the same definitions of , , and . If is constant, then . Interpretation. Mixed-literal formulas have several incomparable head certificates. Volume rewards high-width rare terms, local expansion rewards formulas close to monotone term by term, junta reduction rewards few used ","interpretation":"Mixed-literal formulas have several incomparable head certificates. Volume rewards high-width rare terms, local expansion rewards formulas close to monotone term by term, junta reduction rewards few used variables, and the width-degree route rewards low-width formulas on a moderate variable set.","claim":"Let\n\n$$ f:\\lbrace0,1\\rbrace^n\\to\\lbrace0,1\\rbrace. $$\n\nSuppose $f$ has a DNF with consistent nonempty terms\n\n$$ T_a(x) = \\left(\\prod_{i\\in P_a}x_i\\right) \\left(\\prod_{j\\in N_a}(1-x_j)\\right), \\qquad 1\\leq a\\leq s, $$\n\nwhere $P_a$ and $N_a$ are disjoint. Let\n\n$$ w_a:=\\lvert P_a\\rvert+\\lvert N_a\\rvert, \\qquad w:=\\max_a w_a, $$\n\nand let $v$ be the number of distinct variables appearing in the DNF.\n\nIf $f$ is nonconstant, then\n\n$$ H^{\\ast}(f) \\leq \\min\\left\\lbrace 2\\sum_{a=1}^{s}2^{v-w_a}, \\sum_{a=1}^{s}\\min\\lbrace2^{\\lvert P_a\\rvert},2^{\\lvert N_a\\rvert}\\rbrace, 2^v-1, 1+\\sum_{r=2}^{\\min\\lbrace w,v\\rbrace}\\binom{v}{r} \\right\\rbrace. $$\n\nThe dual statement holds for CNFs with consistent nonempty clauses\n\n$$ C_a(x) = \\left(\\bigvee_{i\\in P_a}x_i\\right) \\vee \\left(\\bigvee_{j\\in N_a}(1-x_j)\\right), $$\n\nwith the same definitions of $w_a$, $w$, and $v$.\n\nIf $f$ is constant, then $H^{\\ast}(f)=0$.\n\n> **Interpretation.** Mixed-literal formulas have several incomparable head certificates. Volume rewards high-width rare terms, local expansion rewards formulas close to monotone term by term, junta reduction rewards few used variables, and the width-degree route rewards low-width formulas on a moderate variable set.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/03_function_families_and_affine_geometry/073_dnf_cnf_hybrid_upper_bound.md","leanCertified":false,"topic":"families","kind":"theorem","in":4,"out":0,"degree":4},{"id":"074","title":"Cofactor Sparse-Polynomial Recursion","note":"Let and split off one coordinate, writing inputs as . Let Suppose and strictly sign-represent and . Let be the set of nonconstant monomials appearing in , and write Then In particular, Consequently, in terms of polynomial-threshold sparsity, Also, if both cofactors have threshold degree at most , then For nonconstant , this gives the affine-free head bound Interpretation. A clean one-head Shannon recursion remains open, but sparse sign polynomials do satisfy an explicit one-sided cofactor recursion. This gives a re","interpretation":"A clean one-head Shannon recursion remains open, but sparse sign polynomials do satisfy an explicit one-sided cofactor recursion. This gives a recursive route for structured functions whose cofactors have sparse sign representations.","claim":"Let\n\n$$ f:\\lbrace0,1\\rbrace^{n}\\to\\lbrace0,1\\rbrace, $$\n\nand split off one coordinate, writing inputs as $(z,y)\\in\\lbrace0,1\\rbrace\\times\\lbrace0,1\\rbrace^{n-1}$. Let\n\n$$ f_0(y):=f(0,y), \\qquad f_1(y):=f(1,y). $$\n\nSuppose $P_0$ and $P_1$ strictly sign-represent $f_0$ and $f_1$. Let $\\mathcal{A}_b$ be the set of nonconstant monomials appearing in $P_b$, and write\n\n$$ m_b:=\\lvert\\mathcal{A}_b\\rvert \\qquad (b\\in\\lbrace0,1\\rbrace). $$\n\nThen\n\n$$ H^{\\ast}(f) \\leq m_0 +\\lvert\\mathcal{A}_0\\cup\\mathcal{A}_1\\rvert +1. $$\n\nIn particular,\n\n$$ H^{\\ast}(f) \\leq 2m_0+m_1+1. $$\n\nConsequently, in terms of polynomial-threshold sparsity,\n\n$$ H^{\\ast}(f) \\leq 2\\mathrm{ptfsp}(f_0) +\\mathrm{ptfsp}(f_1) +1. $$\n\nAlso, if both cofactors have threshold degree at most $d$, then\n\n$$ \\deg_{\\pm}(f)\\leq d+1. $$\n\nFor nonconstant $f$, this gives the affine-free head bound\n\n$$ H^{\\ast}(f) \\leq 1+\\sum_{r=2}^{\\min\\lbrace d+1,n\\rbrace}\\binom{n}{r}. $$\n\n> **Interpretation.** A clean one-head Shannon recursion remains open, but sparse sign polynomials do satisfy an explicit one-sided cofactor recursion. This gives a recursive route for structured functions whose cofactors have sparse sign representations.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/074_cofactor_sparse_polynomial_recursion.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":0,"degree":2},{"id":"075","title":"Affine-Free Cofactor Recursion","note":"Let and split off one coordinate, writing inputs as . Let Suppose and strictly sign-represent and , and write Let and let Then Consequently, if both cofactors have threshold degree at most , then In particular, if both cofactors are constants or linear threshold functions, then Finally, if and have affine sign representations whose linear coefficient vectors differ in at most one coordinate, then In that last case, the exact value is , , or according as is constant, a nonconstant linear threshold function, or neith","interpretation":"The sparse cofactor recursion can overpay for linear terms. Affine-free sparsity bundles all affine terms into one head and only pays separately for genuine nonlinear cofactor monomials and for slope changes across the split.","claim":"Let\n\n$$ f:\\lbrace0,1\\rbrace^{n}\\to\\lbrace0,1\\rbrace, $$\n\nand split off one coordinate, writing inputs as $(z,y)\\in\\lbrace0,1\\rbrace\\times\\lbrace0,1\\rbrace^{n-1}$. Let\n\n$$ f_0(y):=f(0,y), \\qquad f_1(y):=f(1,y). $$\n\nSuppose $P_0$ and $P_1$ strictly sign-represent $f_0$ and $f_1$, and write\n\n$$ P_b(y) = c_b+\\sum_{i=1}^{n-1}\\alpha_{b,i}y_i +\\sum_{\\substack{S\\subseteq\\lbrace1,\\ldots,n-1\\rbrace\\cr \\lvert S\\rvert\\geq2}} a_{b,S}\\prod_{i\\in S}y_i \\qquad (b\\in\\lbrace0,1\\rbrace). $$\n\nLet\n\n$$ \\mathcal{N}_b := \\left\\lbrace S\\subseteq\\lbrace1,\\ldots,n-1\\rbrace: \\lvert S\\rvert\\geq2,\\ a_{b,S}\\neq0 \\right\\rbrace, $$\n\nand let\n\n$$ \\mathcal{L}_{\\Delta} := \\left\\lbrace i\\in\\lbrace1,\\ldots,n-1\\rbrace: \\alpha_{1,i}\\neq\\alpha_{0,i} \\right\\rbrace. $$\n\nThen\n\n$$ H^{\\ast}(f) \\leq 1 +\\lvert\\mathcal{N}_0\\rvert +\\lvert\\mathcal{N}_0\\cup\\mathcal{N}_1\\rvert +\\lvert\\mathcal{L}_{\\Delta}\\rvert. $$\n\nConsequently, if both cofactors have threshold degree at most $d$, then\n\n$$ H^{\\ast}(f) \\leq 1+(n-1) +2\\sum_{r=2}^{\\min\\lbrace d,n-1\\rbrace}\\binom{n-1}{r}. $$\n\nIn particular, if both cofactors are constants or linear threshold functions, then\n\n$$ H^{\\ast}(f)\\leq n. $$\n\nFinally, if $f_0$ and $f_1$ have affine sign representations whose linear coefficient vectors differ in at most one coordinate, then\n\n$$ H^{\\ast}(f)\\leq2. $$\n\nIn that last case, the exact value is $0$, $1$, or $2$ according as $f$ is constant, a nonconstant linear threshold function, or neither.\n\n> **Interpretation.** The sparse cofactor recursion can overpay for linear terms. Affine-free sparsity bundles all affine terms into one head and only pays separately for genuine nonlinear cofactor monomials and for slope changes across the split.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/075_affine_free_cofactor_recursion.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":0,"degree":2},{"id":"076","title":"LTF Cofactor Slope Distance","note":"Let and split off one coordinate, writing inputs as . Let Suppose and have affine sign representations meaning on the -cube. Let and set Then In particular, if both cofactors are constants or linear threshold functions, then If the affine sign representations can be chosen with , then is constant or a nonconstant linear threshold function, so If they can be chosen with , then Interpretation. When the two slices across one bit are LTFs, the cost is controlled by how many affine slopes change across the split. The co","interpretation":"When the two slices across one bit are LTFs, the cost is controlled by how many affine slopes change across the split. The constant term and all unchanged slopes are free inside one affine head; each changed slope creates one mixed monomial .","claim":"Let\n\n$$ f:\\lbrace0,1\\rbrace^{n}\\to\\lbrace0,1\\rbrace, $$\n\nand split off one coordinate, writing inputs as $(z,y)\\in\\lbrace0,1\\rbrace\\times\\lbrace0,1\\rbrace^{n-1}$. Let\n\n$$ f_0(y):=f(0,y), \\qquad f_1(y):=f(1,y). $$\n\nSuppose $f_0$ and $f_1$ have affine sign representations\n\n$$ L_b(y) = \\beta_b+\\sum_{i=1}^{n-1}\\alpha_{b,i}y_i \\qquad (b\\in\\lbrace0,1\\rbrace), $$\n\nmeaning\n\n$$ f_b(y)=1 \\qquad\\Longleftrightarrow\\qquad L_b(y)\\gt0 $$\n\non the $(n-1)$-cube. Let\n\n$$ \\Delta(L_0,L_1) := \\left\\lbrace i\\in\\lbrace1,\\ldots,n-1\\rbrace: \\alpha_{0,i}\\neq\\alpha_{1,i} \\right\\rbrace, $$\n\nand set\n\n$$ t:=\\lvert\\Delta(L_0,L_1)\\rvert. $$\n\nThen\n\n$$ H^{\\ast}(f)\\leq1+t. $$\n\nIn particular, if both cofactors are constants or linear threshold functions, then\n\n$$ H^{\\ast}(f)\\leq n. $$\n\nIf the affine sign representations can be chosen with $t=0$, then $f$ is constant or a nonconstant linear threshold function, so\n\n$$ H^{\\ast}(f)\\in\\lbrace0,1\\rbrace. $$\n\nIf they can be chosen with $t\\leq1$, then\n\n$$ H^{\\ast}(f) = \\begin{cases} 0 & \\text{if } f \\text{ is constant},\\cr 1 & \\text{if } f \\text{ is a nonconstant linear threshold function},\\cr 2 & \\text{otherwise}. \\end{cases} $$\n\n> **Interpretation.** When the two slices across one bit are LTFs, the cost is controlled by how many affine slopes change across the split. The constant term and all unchanged slopes are free inside one affine head; each changed slope creates one mixed monomial $zy_i$.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/076_ltf_cofactor_slope_distance.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":3,"out":2,"degree":5},{"id":"077","title":"Split LTF Slope Invariant","note":"Let For a coordinate , write the two cofactors as where . Say that is an LTF split if both and are constants or linear threshold functions. For an LTF split , define to be the minimum, over all affine sign representations of the two cofactors, of the slope-change count If has at least one LTF split, define Then In particular, every function with an LTF split satisfies If , then is constant or a nonconstant LTF, so If , then Interpretation. A one-bit branch between two LTF slices is controlled by the best coordinate","interpretation":"A one-bit branch between two LTF slices is controlled by the best coordinate and the best pair of affine separators. This gives a coordinate-free invariant for the LTF-cofactor regime.","claim":"Let\n\n$$ f:\\lbrace0,1\\rbrace^{n}\\to\\lbrace0,1\\rbrace. $$\n\nFor a coordinate $j$, write the two cofactors as\n\n$$ f_{j,b}(y):=f(y_1,\\ldots,y_{j-1},b,y_j,\\ldots,y_{n-1}) \\qquad (b\\in\\lbrace0,1\\rbrace), $$\n\nwhere $y\\in\\lbrace0,1\\rbrace^{n-1}$. Say that $j$ is an LTF split if both $f_{j,0}$ and $f_{j,1}$ are constants or linear threshold functions.\n\nFor an LTF split $j$, define $\\sigma_j(f)$ to be the minimum, over all affine sign representations\n\n$$ L_b(y) = \\beta_b+\\sum_{i=1}^{n-1}\\alpha_{b,i}y_i \\qquad (b\\in\\lbrace0,1\\rbrace) $$\n\nof the two cofactors, of the slope-change count\n\n$$ \\left\\lvert \\left\\lbrace i\\in\\lbrace1,\\ldots,n-1\\rbrace: \\alpha_{0,i}\\neq\\alpha_{1,i} \\right\\rbrace \\right\\rvert. $$\n\nIf $f$ has at least one LTF split, define\n\n$$ \\sigma_{\\mathrm{split}}(f) := \\min_{j:\\ j\\text{ is an LTF split}}\\sigma_j(f). $$\n\nThen\n\n$$ H^{\\ast}(f) \\leq 1+\\sigma_{\\mathrm{split}}(f). $$\n\nIn particular, every function with an LTF split satisfies\n\n$$ H^{\\ast}(f)\\leq n. $$\n\nIf $\\sigma_{\\mathrm{split}}(f)=0$, then $f$ is constant or a nonconstant LTF, so\n\n$$ H^{\\ast}(f)\\in\\lbrace0,1\\rbrace. $$\n\nIf $\\sigma_{\\mathrm{split}}(f)\\leq1$, then\n\n$$ H^{\\ast}(f) = \\begin{cases} 0 & \\text{if } f \\text{ is constant},\\cr 1 & \\text{if } f \\text{ is a nonconstant linear threshold function},\\cr 2 & \\text{otherwise}. \\end{cases} $$\n\n> **Interpretation.** A one-bit branch between two LTF slices is controlled by the best coordinate and the best pair of affine separators. This gives a coordinate-free invariant for the LTF-cofactor regime.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/077_split_ltf_slope_invariant.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":3,"out":0,"degree":3},{"id":"078","title":"Split Affine-Free Support Invariant","note":"Let Fix a split coordinate and write inputs as . Let Let and be strict sign representations of and , written as Define and the three support sets and Let For this split coordinate, let be the minimum of over all strict sign representations of the two cofactors. Finally define Then If then Interpretation. The cofactor recursion only needs to pay for affine-free structure that is present in the base cofactor, plus coefficients that actually change across the split. Shared nonlinear cofactor terms are not paid twice.","interpretation":"The cofactor recursion only needs to pay for affine-free structure that is present in the base cofactor, plus coefficients that actually change across the split. Shared nonlinear cofactor terms are not paid twice.","claim":"Let\n\n$$ f:\\lbrace0,1\\rbrace^{n}\\to\\lbrace0,1\\rbrace. $$\n\nFix a split coordinate and write inputs as $(z,y)\\in\\lbrace0,1\\rbrace\\times\\lbrace0,1\\rbrace^{n-1}$. Let\n\n$$ f_b(y):=f(b,y) \\qquad (b\\in\\lbrace0,1\\rbrace). $$\n\nLet $P_0$ and $P_1$ be strict sign representations of $f_0$ and $f_1$, written as\n\n$$ P_b(y) = c_b+\\sum_{i=1}^{n-1}\\alpha_{b,i}y_i +\\sum_{\\substack{S\\subseteq\\lbrace1,\\ldots,n-1\\rbrace\\cr \\lvert S\\rvert\\geq2}} a_{b,S}\\prod_{i\\in S}y_i \\qquad (b\\in\\lbrace0,1\\rbrace). $$\n\nDefine\n\n$$ \\lambda(P_0,P_1) := \\mathbf{1} \\left[ c_1\\neq c_0 \\text{ or } \\exists i,\\ \\alpha_{0,i}\\neq0 \\right], $$\n\nand the three support sets\n\n$$ \\mathcal{N}_0 := \\left\\lbrace S:\\lvert S\\rvert\\geq2,\\ a_{0,S}\\neq0 \\right\\rbrace, $$\n\n$$ \\mathcal{L}_{\\Delta} := \\left\\lbrace i:\\alpha_{1,i}\\neq\\alpha_{0,i} \\right\\rbrace, $$\n\nand\n\n$$ \\mathcal{N}_{\\Delta} := \\left\\lbrace S:\\lvert S\\rvert\\geq2,\\ a_{1,S}\\neq a_{0,S} \\right\\rbrace. $$\n\nLet\n\n$$ C(P_0,P_1) := \\lambda(P_0,P_1) +\\lvert\\mathcal{N}_0\\rvert +\\lvert\\mathcal{L}_{\\Delta}\\rvert +\\lvert\\mathcal{N}_{\\Delta}\\rvert. $$\n\nFor this split coordinate, let $\\mathrm{scafs}_{\\pm,j}(f)$ be the minimum of $C(P_0,P_1)$ over all strict sign representations of the two cofactors. Finally define\n\n$$ \\mathrm{scafs}_{\\pm}(f) := \\min_{1\\leq j\\leq n}\\mathrm{scafs}_{\\pm,j}(f). $$\n\nThen\n\n$$ H^{\\ast}(f)\\leq\\mathrm{scafs}_{\\pm}(f). $$\n\nIf\n\n$$ \\mathrm{scafs}_{\\pm}(f)\\leq2, $$\n\nthen\n\n$$ H^{\\ast}(f) = \\begin{cases} 0 & \\text{if } f \\text{ is constant},\\cr 1 & \\text{if } f \\text{ is a nonconstant linear threshold function},\\cr 2 & \\text{otherwise}. \\end{cases} $$\n\n> **Interpretation.** The cofactor recursion only needs to pay for affine-free structure that is present in the base cofactor, plus coefficients that actually change across the split. Shared nonlinear cofactor terms are not paid twice.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/078_split_affine_free_support_invariant.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":3,"out":2,"degree":5},{"id":"079","title":"One-Bit LTF Branching","note":"Let be a strict affine sign representation of a Boolean function and assume on the cube. Thus if and only if . Assume for . Let be arbitrary, and define Then In particular, if , then Interpretation. Branching on one raw bit between two labels determined by the same LTF costs at most one head plus the number of variables used by that LTF. This includes , , , and their complements.","interpretation":"Branching on one raw bit between two labels determined by the same LTF costs at most one head plus the number of variables used by that LTF. This includes , , , and their complements.","claim":"Let\n\n$$ L(y)=\\beta+\\sum_{i\\in S}\\alpha_i y_i $$\n\nbe a strict affine sign representation of a Boolean function\n\n$$ T:\\lbrace0,1\\rbrace^{m}\\to\\lbrace0,1\\rbrace, \\qquad T(y)=1 \\Longleftrightarrow L(y)\\gt0, $$\n\nand assume $L(y)\\neq0$ on the cube. Thus $T(y)=0$ if and only if $L(y)\\lt0$. Assume $\\alpha_i\\neq0$ for $i\\in S$. Let\n\n$$ G:\\lbrace0,1\\rbrace^2\\to\\lbrace0,1\\rbrace $$\n\nbe arbitrary, and define\n\n$$ f(z,y):=G(z,T(y)). $$\n\nThen\n\n$$ H^{\\ast}(f)\\leq1+\\lvert S\\rvert. $$\n\nIn particular, if $\\lvert S\\rvert\\leq1$, then\n\n$$ H^{\\ast}(f) = \\begin{cases} 0 & \\text{if } f \\text{ is constant},\\cr 1 & \\text{if } f \\text{ is a nonconstant linear threshold function},\\cr 2 & \\text{otherwise}. \\end{cases} $$\n\n> **Interpretation.** Branching on one raw bit between two labels determined by the same LTF costs at most one head plus the number of variables used by that LTF. This includes $z\\wedge T(y)$, $z\\vee T(y)$, $z\\oplus T(y)$, and their complements.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/079_one_bit_ltf_branching.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":0,"degree":2},{"id":"080","title":"One-Bit Sparse-PTF Branching","note":"Let strictly sign-represent a Boolean feature Let Let be arbitrary, and define For , define by: - if as a function of , - if as a function of , - if is constant as a function of . Then In particular, If the refined displayed upper bound is at most , then Interpretation. A one-bit gate applied to a sparse PTF feature is cheap when the feature has few linear variables and few nonlinear monomials. If the two -slices are the same function of , the change term vanishes.","interpretation":"A one-bit gate applied to a sparse PTF feature is cheap when the feature has few linear variables and few nonlinear monomials. If the two -slices are the same function of , the change term vanishes.","claim":"Let\n\n$$ P(y) = c+\\sum_{i=1}^{m}a_i y_i +\\sum_{\\substack{S\\subseteq\\lbrace1,\\ldots,m\\rbrace\\cr \\lvert S\\rvert\\geq2}} a_S\\prod_{i\\in S}y_i $$\n\nstrictly sign-represent a Boolean feature\n\n$$ T:\\lbrace0,1\\rbrace^{m}\\to\\lbrace0,1\\rbrace, \\qquad T(y)=1 \\Longleftrightarrow P(y)\\gt0. $$\n\nLet\n\n$$ \\ell(P):=\\lvert\\lbrace i:a_i\\neq0\\rbrace\\rvert, \\qquad q(P):= \\left\\lvert \\left\\lbrace S:\\lvert S\\rvert\\geq2,\\ a_S\\neq0 \\right\\rbrace \\right\\rvert. $$\n\nLet\n\n$$ G:\\lbrace0,1\\rbrace^2\\to\\lbrace0,1\\rbrace $$\n\nbe arbitrary, and define\n\n$$ f(z,y):=G(z,T(y)). $$\n\nFor $b\\in\\lbrace0,1\\rbrace$, define $\\mu_b\\in\\lbrace-1,0,1\\rbrace$ by:\n\n- $\\mu_b=1$ if $G(b,u)=u$ as a function of $u$,\n- $\\mu_b=-1$ if $G(b,u)=1-u$ as a function of $u$,\n- $\\mu_b=0$ if $G(b,u)$ is constant as a function of $u$.\n\nThen\n\n$$ H^{\\ast}(f) \\leq 1 +\\mathbf{1}[\\mu_0\\neq0]  q(P) +\\mathbf{1}[\\mu_1\\neq\\mu_0]\\bigl(\\ell(P)+q(P)\\bigr). $$\n\nIn particular,\n\n$$ H^{\\ast}(f)\\leq1+\\ell(P)+2q(P). $$\n\nIf the refined displayed upper bound is at most $2$, then\n\n$$ H^{\\ast}(f) = \\begin{cases} 0 & \\text{if } f \\text{ is constant},\\cr 1 & \\text{if } f \\text{ is a nonconstant linear threshold function},\\cr 2 & \\text{otherwise}. \\end{cases} $$\n\n> **Interpretation.** A one-bit gate applied to a sparse PTF feature is cheap when the feature has few linear variables and few nonlinear monomials. If the two $z$-slices are the same function of $T$, the change term vanishes.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/080_one_bit_sparse_ptf_branching.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":2,"degree":4},{"id":"081","title":"Fresh-Bit XOR Raises Threshold Degree","note":"Let and define Then Consequently, If is a strict sign polynomial for with nonzero linear coefficients and nonlinear monomials, then Interpretation. XOR with a fresh raw bit is a reliable lower-bound amplifier: it raises threshold degree by exactly one. This explains why the desired recursion would be tight on every family where already matches threshold degree.","interpretation":"XOR with a fresh raw bit is a reliable lower-bound amplifier: it raises threshold degree by exactly one. This explains why the desired recursion would be tight on every family where already matches threshold degree.","claim":"Let\n\n$$ f:\\lbrace0,1\\rbrace^{m}\\to\\lbrace0,1\\rbrace, $$\n\nand define\n\n$$ g:\\lbrace0,1\\rbrace^{m+1}\\to\\lbrace0,1\\rbrace, \\qquad g(z,y):=z\\oplus f(y). $$\n\nThen\n\n$$ \\deg_{\\pm}(g)=\\deg_{\\pm}(f)+1. $$\n\nConsequently,\n\n$$ H^{\\ast}(g)\\geq\\deg_{\\pm}(f)+1. $$\n\nIf $P$ is a strict sign polynomial for $f$ with $\\ell(P)$ nonzero linear coefficients and $q(P)$ nonlinear monomials, then\n\n$$ \\deg_{\\pm}(f)+1 \\leq H^{\\ast}(z\\oplus f(y)) \\leq 1+\\ell(P)+2q(P). $$\n\n> **Interpretation.** XOR with a fresh raw bit is a reliable lower-bound amplifier: it raises threshold degree by exactly one. This explains why the desired recursion $H^{\\ast}(z\\oplus f)\\leq H^{\\ast}(f)+1$ would be tight on every family where $H^{\\ast}$ already matches threshold degree.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/081_fresh_bit_xor_threshold_degree.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":7,"degree":9},{"id":"082","title":"One-Bit Gate Threshold-Degree Trichotomy","note":"Let be nonconstant, and set Let be any Boolean gate, and define For , write Each slice is one of , , , or . Then: 1. If and are both constant, then 2. If at least one slice is nonconstant and the nonconstant slices, when there are two, are not opposite, then 3. If , then Consequently, fresh-bit AND, OR, implication, and their complements preserve threshold degree when the feature branch is nonconstant, while XOR and XNOR raise threshold degree by exactly one.","interpretation":"This result establishes one-bit gate threshold-degree trichotomy for the fixed-query, one-layer attention model.","claim":"Let\n\n$$ T:\\lbrace0,1\\rbrace^{m}\\to\\lbrace0,1\\rbrace $$\n\nbe nonconstant, and set\n\n$$ d:=\\deg_{\\pm}(T). $$\n\nLet\n\n$$ G:\\lbrace0,1\\rbrace^{2}\\to\\lbrace0,1\\rbrace $$\n\nbe any Boolean gate, and define\n\n$$ F(z,y):=G(z,T(y)). $$\n\nFor $b\\in\\lbrace0,1\\rbrace$, write\n\n$$ G_b(u):=G(b,u). $$\n\nEach slice $G_b$ is one of $0$, $1$, $u$, or $1-u$. Then:\n\n1. If $G_0$ and $G_1$ are both constant, then\n\n$$ \\deg_{\\pm}(F) = \\begin{cases} 0 & \\text{if } G_0=G_1,\\cr 1 & \\text{if } G_0\\neq G_1. \\end{cases} $$\n\n2. If at least one slice is nonconstant and the nonconstant slices, when there are two, are not opposite, then\n\n$$ \\deg_{\\pm}(F)=d. $$\n\n3. If $\\lbrace G_0,G_1\\rbrace=\\lbrace u,1-u\\rbrace$, then\n\n$$ \\deg_{\\pm}(F)=d+1. $$\n\nConsequently, fresh-bit AND, OR, implication, and their complements preserve threshold degree when the feature branch is nonconstant, while XOR and XNOR raise threshold degree by exactly one.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/082_one_bit_gate_threshold_degree_trichotomy.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":1,"out":6,"degree":7},{"id":"083","title":"Parity-Block Threshold-Degree Amplifier","note":"Let be any Boolean function, and let Define Then Consequently, If is a strict sign polynomial for with nonconstant monomials, then In particular, Interpretation. A parity block is an additive threshold-degree amplifier. The sparse-PTF upper bound is only a safe fallback, but the lower bound is exact and composable.","interpretation":"A parity block is an additive threshold-degree amplifier. The sparse-PTF upper bound is only a safe fallback, but the lower bound is exact and composable.","claim":"Let\n\n$$ T:\\lbrace0,1\\rbrace^{m}\\to\\lbrace0,1\\rbrace $$\n\nbe any Boolean function, and let\n\n$$ \\pi_k(z):=\\bigoplus_{j=1}^{k}z_j \\qquad (z\\in\\lbrace0,1\\rbrace^{k}). $$\n\nDefine\n\n$$ F(z,y):=\\pi_k(z)\\oplus T(y). $$\n\nThen\n\n$$ \\deg_{\\pm}(F)=\\deg_{\\pm}(T)+k. $$\n\nConsequently,\n\n$$ H^{\\ast}(F)\\geq\\deg_{\\pm}(T)+k. $$\n\nIf $P$ is a strict sign polynomial for $T$ with $m(P)$ nonconstant monomials, then\n\n$$ H^{\\ast}(F)\\leq2^{k}\\bigl(m(P)+1\\bigr)-1. $$\n\nIn particular,\n\n$$ H^{\\ast}(\\pi_k\\oplus T) \\leq 2^{k}\\bigl(\\mathrm{ptfsp}(T)+1\\bigr)-1. $$\n\n> **Interpretation.** A parity block is an additive threshold-degree amplifier. The sparse-PTF upper bound is only a safe fallback, but the lower bound is exact and composable.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/083_parity_block_threshold_degree_amplifier.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":3,"out":1,"degree":4},{"id":"084","title":"Parity-Block Restriction Lower Bound","note":"Let Suppose a restriction of leaves two disjoint sets of free variables and , with and on that restricted subcube has the form for some Boolean function on the variables. Then and hence The same conclusion holds if the restricted function is the complement of the displayed parity-block form. Interpretation. A lower bound does not require finding a pure parity restriction. It is enough to find a parity block that modulates any residual hard subfunction on the remaining free variables.","interpretation":"A lower bound does not require finding a pure parity restriction. It is enough to find a parity block that modulates any residual hard subfunction on the remaining free variables.","claim":"Let\n\n$$ f:\\lbrace0,1\\rbrace^{n}\\to\\lbrace0,1\\rbrace. $$\n\nSuppose a restriction of $f$ leaves two disjoint sets of free variables $Z$ and $Y$, with\n\n$$ \\lvert Z\\rvert=k, $$\n\nand on that restricted subcube has the form\n\n$$ f_{\\rho}(z,y) = \\left(\\bigoplus_{j=1}^{k}z_j\\right)\\oplus T(y) $$\n\nfor some Boolean function $T$ on the $Y$ variables. Then\n\n$$ \\deg_{\\pm}(f)\\geq k+\\deg_{\\pm}(T), $$\n\nand hence\n\n$$ H^{\\ast}(f)\\geq k+\\deg_{\\pm}(T). $$\n\nThe same conclusion holds if the restricted function is the complement of the displayed parity-block form.\n\n> **Interpretation.** A lower bound does not require finding a pure parity restriction. It is enough to find a parity block that modulates any residual hard subfunction on the remaining free variables.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/084_parity_block_restriction_lower_bound.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":0,"degree":2},{"id":"085","title":"Calibrated Threshold-Vote Upper Bound","note":"Let be Boolean features, and let Define Let the vote margin be Assume . Suppose that for each there is a one-head linear-fractional atom such that and Then Interpretation. Threshold-vote size alone is not an upper bound for . What suffices is calibrated access to the raw features: the one-head atoms must approximate the inner gate indicators accurately enough compared with the outer vote margin.","interpretation":"Threshold-vote size alone is not an upper bound for . What suffices is calibrated access to the raw features: the one-head atoms must approximate the inner gate indicators accurately enough compared with the outer vote margin.","claim":"Let\n\n$$ T_1,\\ldots,T_s:\\lbrace0,1\\rbrace^{n}\\to\\lbrace0,1\\rbrace $$\n\nbe Boolean features, and let\n\n$$ c_0,c_1,\\ldots,c_s\\in\\mathbb{R}. $$\n\nDefine\n\n$$ f(x)=1 \\qquad\\Longleftrightarrow\\qquad c_0+\\sum_{j=1}^{s}c_jT_j(x)\\gt0. $$\n\nLet the vote margin be\n\n$$ \\mu := \\min_{x\\in\\lbrace0,1\\rbrace^{n}} \\left\\lvert c_0+\\sum_{j=1}^{s}c_jT_j(x) \\right\\rvert. $$\n\nAssume $\\mu\\gt0$. Suppose that for each $j$ there is a one-head linear-fractional atom $\\phi_j$ such that\n\n$$ \\lvert \\phi_j(x)-T_j(x)\\rvert\\leq\\epsilon_j \\qquad \\text{for every }x\\in\\lbrace0,1\\rbrace^{n}, $$\n\nand\n\n$$ \\sum_{j=1}^{s}\\lvert c_j\\rvert\\epsilon_j\\lt\\mu. $$\n\nThen\n\n$$ H^{\\ast}(f)\\leq s. $$\n\n> **Interpretation.** Threshold-vote size alone is not an upper bound for $H^{\\ast}$. What suffices is calibrated access to the raw features: the one-head atoms must approximate the inner gate indicators accurately enough compared with the outer vote margin.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/085_calibrated_threshold_vote_upper_bound.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":1,"out":3,"degree":4},{"id":"086","title":"Endpoint Affine-Threshold Vote Upper Bound","note":"For a nonempty set and positive weights , define An endpoint affine-threshold feature is either or Let be endpoint affine-threshold features, and suppose with positive vote margin Then Interpretation. The unqualified threshold-vote upper bound fails for arbitrary LTF gates, but it is valid for strict votes over endpoint positive affine thresholds. This includes weighted votes over positive OR-type clauses and positive AND-type terms.","interpretation":"The unqualified threshold-vote upper bound fails for arbitrary LTF gates, but it is valid for strict votes over endpoint positive affine thresholds. This includes weighted votes over positive OR-type clauses and positive AND-type terms.","claim":"For a nonempty set $S\\subseteq\\lbrace1,\\ldots,n\\rbrace$ and positive weights $\\lambda_i\\gt0$, define\n\n$$ L_S(x):=\\sum_{i\\in S}\\lambda_i x_i, \\qquad \\Lambda_S:=\\sum_{i\\in S}\\lambda_i. $$\n\nAn endpoint affine-threshold feature is either\n\n$$ U_S(x):=\\mathbf{1}[L_S(x)\\gt0] $$\n\nor\n\n$$ A_S(x):=\\mathbf{1}[L_S(x)=\\Lambda_S]. $$\n\nLet $T_1,\\ldots,T_s$ be endpoint affine-threshold features, and suppose\n\n$$ f(x)=1 \\qquad\\Longleftrightarrow\\qquad c_0+\\sum_{j=1}^{s}c_jT_j(x)\\gt0 $$\n\nwith positive vote margin\n\n$$ \\mu := \\min_{x\\in\\lbrace0,1\\rbrace^{n}} \\left\\lvert c_0+\\sum_{j=1}^{s}c_jT_j(x) \\right\\rvert \\gt 0. $$\n\nThen\n\n$$ H^{\\ast}(f)\\leq s. $$\n\n> **Interpretation.** The unqualified threshold-vote upper bound fails for arbitrary LTF gates, but it is valid for strict votes over endpoint positive affine thresholds. This includes weighted votes over positive OR-type clauses and positive AND-type terms.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/086_endpoint_affine_threshold_vote_upper_bound.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":1,"degree":3},{"id":"087","title":"One-Bit Non-XOR Gate Recursion","note":"Let be any Boolean function, and let be a two-input Boolean gate that is neither XOR nor XNOR. Define Then In particular, and the same bound holds after complementing either input literal or the output. Interpretation. One fresh raw bit can be combined with an arbitrary previously computed feature through any non-XOR two-input gate at the cost of one additional head. The XOR and XNOR gates remain the exceptional recursive cases.","interpretation":"One fresh raw bit can be combined with an arbitrary previously computed feature through any non-XOR two-input gate at the cost of one additional head. The XOR and XNOR gates remain the exceptional recursive cases.","claim":"Let\n\n$$ T : \\lbrace0,1\\rbrace^{m}\\to\\lbrace0,1\\rbrace $$\n\nbe any Boolean function, and let\n\n$$ G : \\lbrace0,1\\rbrace^{2}\\to\\lbrace0,1\\rbrace $$\n\nbe a two-input Boolean gate that is neither XOR nor XNOR. Define\n\n$$ F(z,y):=G(z,T(y)). $$\n\nThen\n\n$$ H^{\\ast}(F)\\leq H^{\\ast}(T)+1. $$\n\nIn particular,\n\n$$ H^{\\ast}(z\\wedge T(y))\\leq H^{\\ast}(T)+1, \\qquad H^{\\ast}(z\\vee T(y))\\leq H^{\\ast}(T)+1, $$\n\nand the same bound holds after complementing either input literal or the output.\n\n> **Interpretation.** One fresh raw bit can be combined with an arbitrary previously computed feature through any non-XOR two-input gate at the cost of one additional head. The XOR and XNOR gates remain the exceptional recursive cases.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/087_one_bit_non_xor_gate_recursion.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":3,"out":1,"degree":4},{"id":"088","title":"Literal Decision-List Upper Bound","note":"A read-once literal decision list of length consists of distinct coordinates literals branch labels and a default label . It computes the Boolean function that returns at the first index with , and returns if no literal fires. Then More generally, any ordinary literal decision list is equivalent to a read-once literal decision list of no larger length, so the same bound holds for its simplified length. Interpretation. Literal decision lists admit a direct head-level recursion. Each tested literal costs at most one ","interpretation":"Literal decision lists admit a direct head-level recursion. Each tested literal costs at most one additional head.","claim":"A read-once literal decision list of length $L$ consists of distinct coordinates\n\n$$ i_1,\\ldots,i_L, $$\n\nliterals\n\n$$ \\ell_j(x)\\in\\lbrace x_{i_j},1-x_{i_j}\\rbrace, $$\n\nbranch labels\n\n$$ b_1,\\ldots,b_L\\in\\lbrace0,1\\rbrace, $$\n\nand a default label $b_{L+1}\\in\\lbrace0,1\\rbrace$. It computes the Boolean function $f$ that returns $b_j$ at the first index $j$ with $\\ell_j(x)=1$, and returns $b_{L+1}$ if no literal fires.\n\nThen\n\n$$ H^{\\ast}(f)\\leq L. $$\n\nMore generally, any ordinary literal decision list is equivalent to a read-once literal decision list of no larger length, so the same bound holds for its simplified length.\n\n> **Interpretation.** Literal decision lists admit a direct head-level recursion. Each tested literal costs at most one additional head.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/088_literal_decision_list_upper_bound.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":1,"out":0,"degree":1},{"id":"089","title":"Endpoint Decision-List Upper Bound","note":"For a nonempty set and positive weights , write An endpoint affine-threshold feature is either or Let be computed by a decision list with tests, where each test is either an endpoint affine-threshold feature or the complement of one. Then Interpretation. The one-head-per-test decision-list theorem extends from raw literals to endpoint OR-type and AND-type affine thresholds, including their complements.","interpretation":"The one-head-per-test decision-list theorem extends from raw literals to endpoint OR-type and AND-type affine thresholds, including their complements.","claim":"For a nonempty set $S\\subseteq\\lbrace1,\\ldots,n\\rbrace$ and positive weights $\\lambda_i\\gt0$, write\n\n$$ L_S(x):=\\sum_{i\\in S}\\lambda_i x_i, \\qquad \\Lambda_S:=\\sum_{i\\in S}\\lambda_i. $$\n\nAn endpoint affine-threshold feature is either\n\n$$ U_S(x):=\\mathbf{1}[L_S(x)\\gt0] $$\n\nor\n\n$$ A_S(x):=\\mathbf{1}[L_S(x)=\\Lambda_S]. $$\n\nLet $f$ be computed by a decision list with $L$ tests, where each test is either an endpoint affine-threshold feature or the complement of one. Then\n\n$$ H^{\\ast}(f)\\leq L. $$\n\n> **Interpretation.** The one-head-per-test decision-list theorem extends from raw literals to endpoint OR-type and AND-type affine thresholds, including their complements.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/089_endpoint_decision_list_upper_bound.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":0,"degree":2},{"id":"090","title":"Calibrated Decision-List Upper Bound","note":"Let be Boolean tests, and let be computed by a decision list with tests , branch labels and default label . There are coefficients and a margin such that and Consequently, if each test has a one-head atom approximation with and then In particular, if every test admits arbitrarily accurate one-head atom approximations, then Interpretation. Decision-list priority is not itself expensive. The cost is one head per test whenever the test indicators are available as calibrated raw atoms.","interpretation":"Decision-list priority is not itself expensive. The cost is one head per test whenever the test indicators are available as calibrated raw atoms.","claim":"Let $T_1,\\ldots,T_L:\\lbrace0,1\\rbrace^{n}\\to\\lbrace0,1\\rbrace$ be Boolean tests, and let $f$ be computed by a decision list with tests $T_1,\\ldots,T_L$, branch labels\n\n$$ b_1,\\ldots,b_L\\in\\lbrace0,1\\rbrace, $$\n\nand default label $b_{L+1}\\in\\lbrace0,1\\rbrace$.\n\nThere are coefficients $c_0,c_1,\\ldots,c_L$ and a margin $\\mu\\gt0$ such that\n\n$$ f(x)=1 \\qquad\\Longleftrightarrow\\qquad c_0+\\sum_{j=1}^{L}c_jT_j(x)\\gt0, $$\n\nand\n\n$$ \\left\\lvert c_0+\\sum_{j=1}^{L}c_jT_j(x)\\right\\rvert\\geq\\mu \\qquad \\text{for every }x. $$\n\nConsequently, if each test $T_j$ has a one-head atom approximation $\\phi_j$ with\n\n$$ \\lvert\\phi_j(x)-T_j(x)\\rvert\\leq\\epsilon_j \\qquad \\text{for every }x, $$\n\nand\n\n$$ \\sum_{j=1}^{L}\\lvert c_j\\rvert\\epsilon_j\\lt\\mu, $$\n\nthen\n\n$$ H^{\\ast}(f)\\leq L. $$\n\nIn particular, if every test $T_j$ admits arbitrarily accurate one-head atom approximations, then\n\n$$ H^{\\ast}(f)\\leq L. $$\n\n> **Interpretation.** Decision-list priority is not itself expensive. The cost is one head per test whenever the test indicators are available as calibrated raw atoms.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/090_calibrated_decision_list_upper_bound.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":1,"out":1,"degree":2},{"id":"091","title":"Internal LTF Indicator Obstruction","note":"Define Equivalently, Thus is a monotone linear threshold function. Nevertheless, for every one-head atom on , Consequently, not every LTF indicator admits arbitrarily accurate one-head atom approximations. Interpretation. One head can compute every LTF after applying a final threshold, but the raw one-head score need not approximate the LTF's indicator. This is the calibrated-indicator obstruction left by the decision-list and threshold-vote theorems.","interpretation":"One head can compute every LTF after applying a final threshold, but the raw one-head score need not approximate the LTF's indicator. This is the calibrated-indicator obstruction left by the decision-list and threshold-vote theorems.","claim":"Define\n\n$$ T(x_1,x_2,x_3) := x_1\\wedge(x_2\\vee x_3). $$\n\nEquivalently,\n\n$$ T(x)=1 \\qquad\\Longleftrightarrow\\qquad 2x_1+x_2+x_3\\geq3. $$\n\nThus $T$ is a monotone linear threshold function. Nevertheless, for every one-head atom $\\phi$ on $\\lbrace0,1\\rbrace^3$,\n\n$$ \\max_{x\\in\\lbrace0,1\\rbrace^3}\\lvert \\phi(x)-T(x)\\rvert \\geq \\frac{1}{4}. $$\n\nConsequently, not every LTF indicator admits arbitrarily accurate one-head atom approximations.\n\n> **Interpretation.** One head can compute every LTF after applying a final threshold, but the raw one-head score need not approximate the LTF's $0/1$ indicator. This is the calibrated-indicator obstruction left by the decision-list and threshold-vote theorems.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/091_internal_ltf_indicator_obstruction.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":0,"out":0,"degree":0},{"id":"092","title":"Internal LTF Indicator Infimum","note":"Let Then the best uniform approximation error of by a single one-head atom has infimum exactly More explicitly, where ranges over one-head atoms. Interpretation. The obstruction for the internal LTF is sharp. The obstruction is not a loose proof artifact; it is the exact one-atom approximation barrier.","interpretation":"The obstruction for the internal LTF is sharp. The obstruction is not a loose proof artifact; it is the exact one-atom approximation barrier.","claim":"Let\n\n$$ T(x_1,x_2,x_3):=x_1\\wedge(x_2\\vee x_3). $$\n\nThen the best uniform approximation error of $T$ by a single one-head atom has infimum exactly\n\n$$ \\frac{1}{4}. $$\n\nMore explicitly,\n\n$$ \\inf_{\\phi} \\max_{x\\in\\lbrace0,1\\rbrace^3}\\lvert \\phi(x)-T(x)\\rvert = \\frac{1}{4}, $$\n\nwhere $\\phi$ ranges over one-head atoms.\n\n> **Interpretation.** The $1/4$ obstruction for the internal LTF $x_1\\wedge(x_2\\vee x_3)$ is sharp. The obstruction is not a loose proof artifact; it is the exact one-atom approximation barrier.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/092_internal_ltf_indicator_infimum.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":0,"out":0,"degree":0},{"id":"093","title":"Raw-Calibrated Vote Support Bound","note":"For a Boolean feature define to be the least nonnegative integer such that for every there are one-head atoms and a constant with If no such exists, set . Suppose with positive vote margin Then Moreover, let be the exact multilinear expansion of . Define the exact affine-free support cost Then Consequently, Interpretation. The calibrated-vote theorem does not require every feature to be approximated by one atom. A feature may cost several raw atoms, and exact multilinear sparsity gives a concrete fallback cost.","interpretation":"The calibrated-vote theorem does not require every feature to be approximated by one atom. A feature may cost several raw atoms, and exact multilinear sparsity gives a concrete fallback cost.","claim":"For a Boolean feature\n\n$$ T:\\lbrace0,1\\rbrace^n\\to\\lbrace0,1\\rbrace, $$\n\ndefine $\\rho(T)$ to be the least nonnegative integer $r$ such that for every $\\epsilon\\gt0$ there are one-head atoms\n\n$$ \\phi_1,\\ldots,\\phi_r $$\n\nand a constant $a_0$ with\n\n$$ \\left\\lvert a_0+\\sum_{h=1}^{r}\\phi_h(x)-T(x) \\right\\rvert \\leq \\epsilon \\qquad \\text{for every }x. $$\n\nIf no such $r$ exists, set $\\rho(T)=\\infty$.\n\nSuppose\n\n$$ f(x)=1 \\qquad\\Longleftrightarrow\\qquad c_0+\\sum_{j=1}^{s}c_jT_j(x)\\gt0 $$\n\nwith positive vote margin\n\n$$ \\mu := \\min_x \\left\\lvert c_0+\\sum_{j=1}^{s}c_jT_j(x) \\right\\rvert \\gt 0. $$\n\nThen\n\n$$ H^{\\ast}(f) \\leq \\sum_{j:c_j\\neq0}\\rho(T_j). $$\n\nMoreover, let\n\n$$ T(x) = a_{\\varnothing} + \\sum_{\\varnothing\\neq S\\subseteq[n]}a_S\\prod_{i\\in S}x_i $$\n\nbe the exact multilinear expansion of $T$. Define the exact affine-free support cost\n\n$$ \\mathrm{eafs}(T) := \\mathbf{1} \\left[ \\exists i,\\ a_{\\lbrace i\\rbrace}\\neq0 \\right] + \\left\\lvert \\lbrace S:\\lvert S\\rvert\\geq2,\\ a_S\\neq0\\rbrace \\right\\rvert. $$\n\nThen\n\n$$ \\rho(T)\\leq\\mathrm{eafs}(T). $$\n\nConsequently,\n\n$$ H^{\\ast}(f) \\leq \\sum_{j:c_j\\neq0}\\mathrm{eafs}(T_j). $$\n\n> **Interpretation.** The calibrated-vote theorem does not require every feature to be approximated by one atom. A feature may cost several raw atoms, and exact multilinear sparsity gives a concrete fallback cost.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/093_raw_calibrated_vote_support_bound.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":4,"degree":6},{"id":"094","title":"Raw-Calibrated Decision-List Support Bound","note":"Let be computed by a decision list with tests Then where is the raw atom approximation cost from . In particular, where is the exact affine-free support cost of the unique multilinear expansion of . Interpretation. Decision lists do not require one raw atom per test. They require the raw calibration cost of each test. Endpoint and literal tests have cost at most one; internal threshold tests may cost more.","interpretation":"Decision lists do not require one raw atom per test. They require the raw calibration cost of each test. Endpoint and literal tests have cost at most one; internal threshold tests may cost more.","claim":"Let $f$ be computed by a decision list with tests\n\n$$ T_1,\\ldots,T_L:\\lbrace0,1\\rbrace^n\\to\\lbrace0,1\\rbrace. $$\n\nThen\n\n$$ H^{\\ast}(f) \\leq \\sum_{j=1}^{L}\\rho(T_j), $$\n\nwhere $\\rho(T_j)$ is the raw atom approximation cost from [093_raw_calibrated_vote_support_bound.md](093_raw_calibrated_vote_support_bound.md).\n\nIn particular,\n\n$$ H^{\\ast}(f) \\leq \\sum_{j=1}^{L}\\mathrm{eafs}(T_j), $$\n\nwhere $\\mathrm{eafs}(T_j)$ is the exact affine-free support cost of the unique multilinear expansion of $T_j$.\n\n> **Interpretation.** Decision lists do not require one raw atom per test. They require the raw calibration cost of each test. Endpoint and literal tests have cost at most one; internal threshold tests may cost more.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/094_raw_calibrated_decision_list_support_bound.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":0,"degree":2},{"id":"095","title":"Raw Calibration Threshold-Degree Lower Bound","note":"Let be Boolean features, and suppose with positive margin on the Boolean cube. Then In particular, if then and hence Interpretation. High threshold degree of a strict vote proves that its inner features cannot all have small raw calibration cost. This turns threshold-degree lower bounds into lower bounds on for at least one feature in the vote.","interpretation":"High threshold degree of a strict vote proves that its inner features cannot all have small raw calibration cost. This turns threshold-degree lower bounds into lower bounds on for at least one feature in the vote.","claim":"Let\n\n$$ T_1,\\ldots,T_s:\\lbrace0,1\\rbrace^n\\to\\lbrace0,1\\rbrace $$\n\nbe Boolean features, and suppose\n\n$$ f(x)=1 \\qquad\\Longleftrightarrow\\qquad c_0+\\sum_{j=1}^{s}c_jT_j(x)\\gt0 $$\n\nwith positive margin on the Boolean cube. Then\n\n$$ \\deg_{\\pm}(f) \\leq \\sum_{j:c_j\\neq0}\\rho(T_j). $$\n\nIn particular, if\n\n$$ f(x)=T_1(x)\\wedge T_2(x), $$\n\nthen\n\n$$ \\rho(T_1)+\\rho(T_2) \\geq \\deg_{\\pm}(f), $$\n\nand hence\n\n$$ \\max\\lbrace\\rho(T_1),\\rho(T_2)\\rbrace \\geq \\frac{\\deg_{\\pm}(f)}{2}. $$\n\n> **Interpretation.** High threshold degree of a strict vote proves that its inner features cannot all have small raw calibration cost. This turns threshold-degree lower bounds into lower bounds on $\\rho$ for at least one feature in the vote.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/095_raw_calibration_threshold_degree_lower_bound.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":0,"degree":2},{"id":"096","title":"Subcube Raw Calibration Cost","note":"Let be a partial assignment, where are disjoint. Define its subcube indicator If , then Otherwise, Interpretation. A single cylinder test has low raw calibration cost when it fixes few coordinates of at least one sign. This is the raw-feature version of local certificate expansion.","interpretation":"A single cylinder test has low raw calibration cost when it fixes few coordinates of at least one sign. This is the raw-feature version of local certificate expansion.","claim":"Let $(P,N)$ be a partial assignment, where $P,N\\subseteq\\lbrace1,\\ldots,n\\rbrace$ are disjoint. Define its subcube indicator\n\n$$ C_{P,N}(x) := \\left(\\prod_{i\\in P}x_i\\right) \\left(\\prod_{j\\in N}(1-x_j)\\right). $$\n\nIf $P=N=\\varnothing$, then\n\n$$ \\rho(C_{P,N})=0. $$\n\nOtherwise,\n\n$$ \\rho(C_{P,N}) \\leq \\min\\lbrace2^{\\lvert P\\rvert},2^{\\lvert N\\rvert}\\rbrace. $$\n\n> **Interpretation.** A single cylinder test has low raw calibration cost when it fixes few coordinates of at least one sign. This is the raw-feature version of local certificate expansion.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/096_subcube_raw_calibration_cost.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":3,"out":2,"degree":5},{"id":"097","title":"Raw Calibration Invariances","note":"Let be a Boolean feature. The raw calibration cost has the following structural properties. 1. Output complement does not change raw cost: 2. Coordinate permutations do not change raw cost. If is a permutation of and then 3. Global bit-flip does not change raw cost. If then 4. Adding dummy variables does not change raw cost. If then 5. Restrictions cannot increase raw cost. If is obtained from by fixing some input coordinates, then All equalities and inequalities are interpreted in . Interpretation. Raw calibration","interpretation":"Raw calibration cost has the same basic robustness properties needed for a reusable invariant: complements, relabelings, global bit-flips, dummy variables, and restrictions do not create artificial cost.","claim":"Let\n\n$$ T:\\lbrace0,1\\rbrace^n\\to\\lbrace0,1\\rbrace $$\n\nbe a Boolean feature. The raw calibration cost $\\rho(T)$ has the following structural properties.\n\n1. Output complement does not change raw cost:\n\n   $\\rho(1-T)=\\rho(T).$\n\n2. Coordinate permutations do not change raw cost. If $\\pi$ is a permutation of $\\lbrace1,\\ldots,n\\rbrace$ and\n\n   $T^{\\pi}(x_1,\\ldots,x_n) := T(x_{\\pi(1)},\\ldots,x_{\\pi(n)}),$\n\n   then\n\n   $\\rho(T^{\\pi})=\\rho(T).$\n\n3. Global bit-flip does not change raw cost. If\n\n   $T^{\\mathrm{flip}}(x) := T(1-x_1,\\ldots,1-x_n),$\n\n   then\n\n   $\\rho(T^{\\mathrm{flip}})=\\rho(T).$\n\n4. Adding dummy variables does not change raw cost. If\n\n   $F(x,y)=T(x),$\n\n   then\n\n   $\\rho(F)=\\rho(T).$\n\n5. Restrictions cannot increase raw cost. If $R$ is obtained from $T$ by fixing some input coordinates, then\n\n   $\\rho(R)\\leq\\rho(T).$\n\nAll equalities and inequalities are interpreted in $\\mathbb{N}\\cup\\lbrace\\infty\\rbrace$.\n\n> **Interpretation.** Raw calibration cost has the same basic robustness properties needed for a reusable invariant: complements, relabelings, global bit-flips, dummy variables, and restrictions do not create artificial cost.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/097_raw_calibration_invariances.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":0,"degree":2},{"id":"098","title":"Subcube-Threshold Vote Upper Bound","note":"For a partial assignment with disjoint , define the subcube indicator Define its local expansion cost Suppose with positive margin on the Boolean cube. Then Interpretation. Any strict real threshold of subcube indicators has a head upper bound given by the local literal-orientation cost of the cylinders. The cylinders need not be disjoint, one-sided, or a certificate cover.","interpretation":"Any strict real threshold of subcube indicators has a head upper bound given by the local literal-orientation cost of the cylinders. The cylinders need not be disjoint, one-sided, or a certificate cover.","claim":"For a partial assignment $(P,N)$ with disjoint $P,N\\subseteq\\lbrace1,\\ldots,n\\rbrace$, define the subcube indicator\n\n$$ C_{P,N}(x) := \\left(\\prod_{i\\in P}x_i\\right) \\left(\\prod_{j\\in N}(1-x_j)\\right). $$\n\nDefine its local expansion cost\n\n$$ \\kappa(P,N) := \\begin{cases} 0, & P=N=\\varnothing, \\cr \\min\\lbrace2^{\\lvert P\\rvert},2^{\\lvert N\\rvert}\\rbrace, & \\text{otherwise}. \\end{cases} $$\n\nSuppose\n\n$$ f(x)=1 \\qquad\\Longleftrightarrow\\qquad c_0+\\sum_{a=1}^{s}c_a C_{P_a,N_a}(x)\\gt0 $$\n\nwith positive margin on the Boolean cube. Then\n\n$$ H^{\\ast}(f) \\leq \\sum_{a:c_a\\neq0}\\kappa(P_a,N_a). $$\n\n> **Interpretation.** Any strict real threshold of subcube indicators has a head upper bound given by the local literal-orientation cost of the cylinders. The cylinders need not be disjoint, one-sided, or a certificate cover.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/098_subcube_threshold_vote_upper_bound.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":1,"degree":3},{"id":"099","title":"Cylinder-Threshold Cost Invariant","note":"For a partial assignment with disjoint , define and Define the cylinder-threshold cost to be the minimum of over all strict representations by subcube indicators. Then Moreover, is finite for every Boolean function. Interpretation. Instead of choosing a DNF, CNF, certificate cover, or decision list first, one can optimize directly over strict real threshold votes of cylinders and pay the local orientation cost of the selected cylinders.","interpretation":"Instead of choosing a DNF, CNF, certificate cover, or decision list first, one can optimize directly over strict real threshold votes of cylinders and pay the local orientation cost of the selected cylinders.","claim":"For a partial assignment $(P,N)$ with disjoint $P,N\\subseteq\\lbrace1,\\ldots,n\\rbrace$, define\n\n$$ C_{P,N}(x) := \\left(\\prod_{i\\in P}x_i\\right) \\left(\\prod_{j\\in N}(1-x_j)\\right) $$\n\nand\n\n$$ \\kappa(P,N) := \\begin{cases} 0, & P=N=\\varnothing, \\cr \\min\\lbrace2^{\\lvert P\\rvert},2^{\\lvert N\\rvert}\\rbrace, & \\text{otherwise}. \\end{cases} $$\n\nDefine the cylinder-threshold cost $\\mathrm{ctc}(f)$ to be the minimum of\n\n$$ \\sum_{a:c_a\\neq0}\\kappa(P_a,N_a) $$\n\nover all strict representations\n\n$$ f(x)=1 \\qquad\\Longleftrightarrow\\qquad c_0+\\sum_{a=1}^{s}c_aC_{P_a,N_a}(x)\\gt0 $$\n\nby subcube indicators. Then\n\n$$ H^{\\ast}(f)\\leq\\mathrm{ctc}(f). $$\n\nMoreover, $\\mathrm{ctc}(f)$ is finite for every Boolean function.\n\n> **Interpretation.** Instead of choosing a DNF, CNF, certificate cover, or decision list first, one can optimize directly over strict real threshold votes of cylinders and pay the local orientation cost of the selected cylinders.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/099_cylinder_threshold_cost_invariant.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":1,"out":3,"degree":4},{"id":"100","title":"Cylinder-Threshold Cost Invariances","note":"Let The cylinder-threshold cost has the following structural properties. 1. Output complement does not change the cost: 2. Coordinate permutations do not change the cost. If is a permutation of and then 3. Global bit-flip does not change the cost. If then 4. Restrictions cannot increase the cost. If is obtained from by fixing some coordinates, then 5. Adding dummy variables does not change the cost. If then Interpretation. The optimized cylinder-threshold upper-bound invariant is stable under the same basic symmetr","interpretation":"The optimized cylinder-threshold upper-bound invariant is stable under the same basic symmetries as . Restrictions can only make the invariant smaller, so hard restrictions are valid witnesses for lower-bound attempts on .","claim":"Let\n\n$$ f:\\lbrace0,1\\rbrace^n\\to\\lbrace0,1\\rbrace. $$\n\nThe cylinder-threshold cost $\\mathrm{ctc}(f)$ has the following structural properties.\n\n1. Output complement does not change the cost:\n\n   $\\mathrm{ctc}(1-f)=\\mathrm{ctc}(f).$\n\n2. Coordinate permutations do not change the cost. If $\\pi$ is a permutation of $\\lbrace1,\\ldots,n\\rbrace$ and\n\n   $f^{\\pi}(x_1,\\ldots,x_n) := f(x_{\\pi(1)},\\ldots,x_{\\pi(n)}),$\n\n   then\n\n   $\\mathrm{ctc}(f^{\\pi})=\\mathrm{ctc}(f).$\n\n3. Global bit-flip does not change the cost. If\n\n   $f^{\\mathrm{flip}}(x) := f(1-x_1,\\ldots,1-x_n),$\n\n   then\n\n   $\\mathrm{ctc}(f^{\\mathrm{flip}})=\\mathrm{ctc}(f).$\n\n4. Restrictions cannot increase the cost. If $g$ is obtained from $f$ by fixing some coordinates, then\n\n   $\\mathrm{ctc}(g)\\leq\\mathrm{ctc}(f).$\n\n5. Adding dummy variables does not change the cost. If\n\n   $F(x,y)=f(x),$\n\n   then\n\n   $\\mathrm{ctc}(F)=\\mathrm{ctc}(f).$\n\n> **Interpretation.** The optimized cylinder-threshold upper-bound invariant is stable under the same basic symmetries as $H^{\\ast}$. Restrictions can only make the invariant smaller, so hard restrictions are valid witnesses for lower-bound attempts on $\\mathrm{ctc}$.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/100_cylinder_threshold_cost_invariances.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":1,"out":1,"degree":2},{"id":"101","title":"Cylinder-Threshold Cost Subsumes Local Certificates","note":"For disjoint , write and Let be a -certificate cover for by partial assignments . Then The same bound holds for any -certificate cover : Consequently, if has a DNF then If has a CNF then If is computed by a deterministic decision tree with accepting leaves and rejecting leaves , then Interpretation. The optimized cylinder-threshold invariant packages the local certificate-expansion theorem. Any local certificate cover, DNF, CNF, or decision-tree leaf cover is one feasible point in the minimization.","interpretation":"The optimized cylinder-threshold invariant packages the local certificate-expansion theorem. Any local certificate cover, DNF, CNF, or decision-tree leaf cover is one feasible point in the minimization.","claim":"For disjoint $P,N\\subseteq\\lbrace1,\\ldots,n\\rbrace$, write\n\n$$ C_{P,N}(x) := \\left(\\prod_{i\\in P}x_i\\right) \\left(\\prod_{j\\in N}(1-x_j)\\right) $$\n\nand\n\n$$ \\kappa(P,N) := \\begin{cases} 0, & P=N=\\varnothing, \\cr \\min\\lbrace2^{\\lvert P\\rvert},2^{\\lvert N\\rvert}\\rbrace, & \\text{otherwise}. \\end{cases} $$\n\nLet $\\mathcal{C}_1$ be a $1$-certificate cover for $f$ by partial assignments $(P,N)$. Then\n\n$$ \\mathrm{ctc}(f) \\leq \\sum_{(P,N)\\in\\mathcal{C}_1}\\kappa(P,N). $$\n\nThe same bound holds for any $0$-certificate cover $\\mathcal{C}_0$:\n\n$$ \\mathrm{ctc}(f) \\leq \\sum_{(P,N)\\in\\mathcal{C}_0}\\kappa(P,N). $$\n\nConsequently, if $f$ has a DNF\n\n$$ f(x)=\\bigvee_{a=1}^{s}C_{P_a,N_a}(x), $$\n\nthen\n\n$$ \\mathrm{ctc}(f) \\leq \\sum_{a=1}^{s}\\kappa(P_a,N_a). $$\n\nIf $f$ has a CNF\n\n$$ f(x) = \\bigwedge_{a=1}^{s} \\left( \\bigvee_{i\\in P_a}x_i \\vee \\bigvee_{j\\in N_a}(1-x_j) \\right), $$\n\nthen\n\n$$ \\mathrm{ctc}(f) \\leq \\sum_{a=1}^{s}\\kappa(P_a,N_a). $$\n\nIf $f$ is computed by a deterministic decision tree $\\mathcal{T}$ with accepting leaves $\\mathcal{L}_1$ and rejecting leaves $\\mathcal{L}_0$, then\n\n$$ \\mathrm{ctc}(f) \\leq \\min\\left\\lbrace \\sum_{\\ell\\in\\mathcal{L}_1}\\kappa(P_\\ell,N_\\ell), \\sum_{\\ell\\in\\mathcal{L}_0}\\kappa(P_\\ell,N_\\ell) \\right\\rbrace. $$\n\n> **Interpretation.** The optimized cylinder-threshold invariant packages the local certificate-expansion theorem. Any local certificate cover, DNF, CNF, or decision-tree leaf cover is one feasible point in the $\\mathrm{ctc}$ minimization.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/101_cylinder_threshold_cost_subsumes_local_certificates.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":0,"degree":2},{"id":"102","title":"Cylinder-Threshold Cost And PTF Sparsity","note":"Let be the least number of nonconstant monomials in a real multilinear polynomial that sign-represents on the Boolean cube. Then Consequently, if , then Combining with Lemma 99 gives Interpretation. Sparse polynomial threshold representations are special cylinder-threshold representations. Thus sits between head complexity and ordinary PTF sparsity in the upper-bound hierarchy.","interpretation":"Sparse polynomial threshold representations are special cylinder-threshold representations. Thus sits between head complexity and ordinary PTF sparsity in the upper-bound hierarchy.","claim":"Let $\\mathrm{ptfsp}(f)$ be the least number of nonconstant monomials in a real multilinear polynomial that sign-represents $f$ on the Boolean cube. Then\n\n$$ \\mathrm{ctc}(f)\\leq\\mathrm{ptfsp}(f). $$\n\nConsequently, if $\\deg_{\\pm}(f)\\leq d$, then\n\n$$ \\mathrm{ctc}(f) \\leq \\sum_{r=1}^{d}\\binom{n}{r}. $$\n\nCombining with Lemma 99 gives\n\n$$ H^{\\ast}(f) \\leq \\mathrm{ctc}(f) \\leq \\mathrm{ptfsp}(f). $$\n\n> **Interpretation.** Sparse polynomial threshold representations are special cylinder-threshold representations. Thus $\\mathrm{ctc}$ sits between head complexity and ordinary PTF sparsity in the upper-bound hierarchy.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/102_cylinder_threshold_cost_ptf_sparsity.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":0,"degree":2},{"id":"10 ate the whole affine part.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/103_affine_cylinder_threshold_cost.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":4,"out":5,"degree":9},{"id":"104","title":"Affine-Cylinder Cost Hierarchy","note":"Let be the affine-free polynomial-threshold sparsity from , and let be ordinary polynomial-threshold sparsity. Then Combining with Lemma 103 gives Consequently, if is nonconstant and , then Interpretation. The affine-cylinder invariant is a common refinement of two upper-bound routes: signed local cylinder votes and affine-free sparse sign polynomials.","interpretation":"The affine-cylinder invariant is a common refinement of two upper-bound routes: signed local cylinder votes and affine-free sparse sign polynomials.","claim":"Let $\\mathrm{afs}_{\\pm}(f)$ be the affine-free polynomial-threshold sparsity from [048_affine_free_sparsity_upper_bound.md](../03_function_families_and_affine_geometry/048_affine_free_sparsity_upper_bound.md), and let $\\mathrm{ptfsp}(f)$ be ordinary polynomial-threshold sparsity. Then\n\n$$ \\mathrm{actc}(f) \\leq \\mathrm{afs}_{\\pm}(f) \\leq \\mathrm{ptfsp}(f). $$\n\nCombining with Lemma 103 gives\n\n$$ H^{\\ast}(f) \\leq \\mathrm{actc}(f) \\leq \\min\\lbrace\\mathrm{ctc}(f),\\mathrm{afs}_{\\pm}(f)\\rbrace. $$\n\nConsequently, if $f$ is nonconstant and $\\deg_{\\pm}(f)\\leq d$, then\n\n$$ H^{\\ast}(f) \\leq \\mathrm{actc}(f) \\leq 1+\\sum_{r=2}^{d}\\binom{n}{r}. $$\n\n> **Interpretation.** The affine-cylinder invariant is a common refinement of two upper-bound routes: signed local cylinder votes and affine-free sparse sign polynomials.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/104_affine_cylinder_cost_hierarchy.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":1,"out":1,"degree":2},{"id":"105","title":"Halfspace Intersections holded LTF outputs.","claim":"Let $s_{\\mathrm{LTF}}(f)$ be the minimum number of linear threshold function indicators in a strict weighted vote for $f$.\n\nThere is an infinite family of Boolean functions $F_n:\\lbrace0,1\\rbrace^{n}\\to\\lbrace0,1\\rbrace$ such that\n\n$$ s_{\\mathrm{LTF}}(F_n)\\leq2 \\qquad \\text{but} \\qquad H^{\\ast}(F_n)\\geq c n $$\n\nfor an absolute constant $c\\gt0$.\n\nThe same family has LTF decision-list length at most $2$. Thus neither threshold-vote size nor LTF decision-list length is a constant-factor upper bound for $H^{\\ast}$.\n\n> **Interpretation.** The three-bit threshold-vote match and the equality-family match are genuine small or structured coincidences. Globally, the model needs calibrated raw scores, not merely a small weighted vote of thresholded LTF outputs.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/106_threshold_vote_and_ltf_decision_list_separation.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":1,"out":1,"degree":2},{"id":"107","title":"LTF Raw Calibration Has Linear Worst Case","note":"For each , define There is an absolute constant and infinitely many such that Consequently, there are nonconstant linear threshold functions with Interpretation. Computing an LTF after the final threshold and raw-calibrating its indicator are different tasks. The gap can grow linearly.","interpretation":"Computing an LTF after the final threshold and raw-calibrating its indicator are different tasks. The gap can grow linearly.","claim":"For each $n$, define\n\n$$ R_{\\mathrm{LTF}}(n) := \\max\\lbrace\\rho(T):T:\\lbrace0,1\\rbrace^{n}\\to\\lbrace0,1\\rbrace\\text{ is a nonconstant LTF}\\rbrace. $$\n\nThere is an absolute constant $c\\gt0$ and infinitely many $n$ such that\n\n$$ R_{\\mathrm{LTF}}(n)\\geq c n. $$\n\nConsequently, there are nonconstant linear threshold functions\n\n$$ V_n:\\lbrace0,1\\rbrace^{n}\\to\\lbrace0,1\\rbrace $$\n\nwith\
