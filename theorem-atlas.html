rator after the output projection, and $D(a,b) \\gt 0$ is the scalar denominator.\n\nThen on the restricted 2-cube both $N$ and $D$ decompose additively:\n\n$$ N(a,b) = A(a) + B(b) + C, \\qquad D(a,b) = \\alpha(a) + \\beta(b) + \\gamma $$\n\nfor suitable functions $A, B, \\alpha, \\beta$ and constants $C, \\gamma$.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/01_foundations_and_normal_form/001_checkerboard_additive_decomposition.md","leanCertified":true,"topic":"foundation","kind":"theorem","in":0,"out":2,"degree":2},{"id":"002","title":"Antipode Identities On A Restricted 2-Cube","note":"Use the single-head 2-coordinate restriction of , with and the projected softmax numerator and denominator. Then the two diagonal sums agree: and","interpretation":"This result establishes antipode identities on a restricted 2-cube for the fixed-query, one-layer attention model.","claim":"Use the single-head 2-coordinate restriction of [001_checkerboard_additive_decomposition.md](001_checkerboard_additive_decomposition.md), with $N(a,b)$ and $D(a,b)$ the projected softmax numerator and denominator. Then the two diagonal sums agree:\n\n$$ N(0,0) + N(1,1) = N(0,1) + N(1,0) $$\n\nand\n\n$$ D(0,0) + D(1,1) = D(0,1) + D(1,0). $$","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/01_foundations_and_normal_form/002_antipode_identities.md","leanCertified":true,"topic":"foundation","kind":"theorem","in":1,"out":1,"degree":2},{"id":"003","title":"Checkerboard Obstruction For One Head","note":"Fix the one-layer attention-only model from , with a single head and a linear readout from the query token. Let . Suppose there exist distinct coordinates and a base assignment to all other coordinates such that, restricted to the two free bits in positions , the function looks like for some . Then cannot be computed with one head, so Equivalently. Any function containing a 2-bit checkerboard restriction has head complexity at least : one head cannot separate one diagonal of a restricted 2-cube from the other diago","interpretation":"This result establishes checkerboard obstruction for one head for the fixed-query, one-layer attention model.","claim":"Fix the one-layer attention-only model from [../../model.md](../../model.md), with a single head and a linear readout from the query token.\n\nLet $f : \\lbrace0,1\\rbrace^n \\to \\lbrace0,1\\rbrace$. Suppose there exist distinct coordinates $i \\neq j$ and a base assignment to all other coordinates such that, restricted to the two free bits $(a,b)$ in positions $i, j$, the function looks like\n\n$$ f(0,0) = c, \\qquad f(1,1) = c, \\qquad f(0,1) = 1 - c, \\qquad f(1,0) = 1 - c $$\n\nfor some $c \\in \\lbrace0,1\\rbrace$.\n\nThen $f$ cannot be computed with one head, so\n\n$$ H^{\\ast}(f)  \\geq  2. $$\n\n> **Equivalently.** Any function containing a 2-bit checkerboard restriction has head complexity at least $2$: one head cannot separate one diagonal of a restricted 2-cube from the other diagonal.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/01_foundations_and_normal_form/003_checkerboard_obstruction.md","leanCertified":true,"topic":"foundation","kind":"theorem","in":2,"out":2,"degree":4},{"id":"004","title":"One Head Computes Symmetric Thresholds","note":"For and , define the symmetric threshold function where is the Hamming weight. Then is computable with one head. Since is nonconstant for , it follows that This includes: - , which is , - , which is , - , which is .","interpretation":"This result establishes one head computes symmetric thresholds for the fixed-query, one-layer attention model.","claim":"For $n \\geq 1$ and $1 \\leq t \\leq n$, define the symmetric threshold function\n\n$$ T_{n,t}(x)  =  \\mathbf{1} \\left[ \\lvert x\\rvert \\geq t \\right] $$\n\nwhere $\\lvert x\\rvert$ is the Hamming weight.\n\nThen $T_{n,t}$ is computable with one head. Since $T_{n,t}$ is nonconstant for $1 \\leq t \\leq n$, it follows that\n\n$$ H^{\\ast}(T_{n,t})  =  1. $$\n\nThis includes:\n\n- $\\mathrm{OR}_n$, which is $T _{n,1}$,\n- $\\mathrm{AND}_n$, which is $T _{n,n}$,\n- $\\mathrm{MAJORITY}_n$, which is $T _{n,\\lceil n/2 \\rceil}$.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/01_foundations_and_normal_form/004_symmetric_thresholds.md","leanCertified":true,"topic":"foundation","kind":"theorem","in":0,"out":2,"degree":2},{"id":"005","title":"Consequences For Standard Function Families","note":"","interpretation":"This result establishes consequences for standard function families for the fixed-query, one-layer attention model.","claim":"","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/01_foundations_and_normal_form/005_family_consequences.md","leanCertified":true,"topic":"foundation","kind":"theorem","in":2,"out":0,"degree":2},{"id":"006","title":"Threshold Degree Is Bounded By Head Complexity","note":"If a Boolean function is computable in the model from , then Here denotes the threshold degree of , namely the minimum degree of a real polynomial that sign-represents on the Boolean cube.","interpretation":"This result establishes threshold degree is bounded by head complexity for the fixed-query, one-layer attention model.","claim":"If a Boolean function $f : \\lbrace0,1\\rbrace^n \\to \\lbrace0,1\\rbrace$ is computable in the model from [../../model.md](../../model.md), then\n\n$$ \\deg_{\\pm}(f) \\leq H^{\\ast}(f). $$\n\nHere $\\deg_{\\pm}(f)$ denotes the threshold degree of $f$, namely the minimum degree of a real polynomial that sign-represents $f$ on the Boolean cube.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/01_foundations_and_normal_form/006_threshold_degree_head_complexity_bound.md","leanCertified":true,"topic":"foundation","kind":"theorem","in":0,"out":19,"degree":19},{"id":"007","title":"Parity Has Threshold Degree Exactly n","note":"For we have Here is the threshold degree, the least degree of a real polynomial that sign-represents the function on (see ).","interpretation":"This result establishes parity has threshold degree exactly n for the fixed-query, one-layer attention model.","claim":"For\n\n$$ \\mathrm{PARITY}_n(x) = x_1 \\oplus \\cdots \\oplus x_n, $$\n\nwe have\n\n$$ \\deg_{\\pm}(\\mathrm{PARITY}_n) = n. $$\n\nHere $\\deg_{\\pm}$ is the threshold degree, the least degree of a real polynomial that sign-represents the function on $\\lbrace0,1\\rbrace^n$ (see [006_threshold_degree_head_complexity_bound.md](006_threshold_degree_head_complexity_bound.md)).","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/01_foundations_and_normal_form/007_parity_threshold_degree.md","leanCertified":true,"topic":"foundation","kind":"theorem","in":1,"out":3,"degree":4},{"id":"008","title":"Exact Parity Complexity","note":"For every , in the one-layer attention-only model from , the -bit parity / XOR function has exact head complexity Equivalently. In this one-layer attention model, parity needs exactly one head per input bit. The proof combines a threshold-degree lower bound with an explicit construction.","interpretation":"This result establishes exact parity complexity for the fixed-query, one-layer attention model.","claim":"For every $n \\geq 1$, in the one-layer attention-only model from [../../model.md](../../model.md), the $n$-bit parity / XOR function\n\n$$\\mathrm{XOR}_n(x_1, \\ldots, x_n) = x_1 \\oplus \\cdots \\oplus x_n$$\n\nhas exact head complexity\n\n$$H^{\\ast}(\\mathrm{XOR}_n) = n.$$\n\n> **Equivalently.** In this one-layer attention model, parity needs exactly one head per input bit.\n\nThe proof combines a threshold-degree lower bound with an explicit construction.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/01_foundations_and_normal_form/008_exact_parity_complexity.md","leanCertified":true,"topic":"foundation","kind":"theorem","in":2,"out":6,"degree":8},{"id":"009","title":"Weighted-Sum Interpolation Upper Bound","note":"Let . Suppose there exist positive real numbers and a function where such that for every . Let Then Equivalently. If a Boolean function depends only on a positive weighted sum of the input bits, then one can realize it with one head per distinct nonzero level of that statistic.","interpretation":"This result establishes weighted-sum interpolation upper bound for the fixed-query, one-layer attention model.","claim":"Let $f : \\lbrace0,1\\rbrace^n \\to \\lbrace0,1\\rbrace$.\n\nSuppose there exist positive real numbers\n\n$$ \\lambda_1, \\ldots, \\lambda_n \\gt 0 $$\n\nand a function\n\n$$ F : \\mathrm{Im}(t) \\to \\lbrace0,1\\rbrace, $$\n\nwhere\n\n$$ t(x) := \\sum_{i=1}^{n} \\lambda_i x_i, $$\n\nsuch that\n\n$$ f(x) = F(t(x)) $$\n\nfor every $x \\in \\lbrace0,1\\rbrace^n$.\n\nLet\n\n$$ M := \\lvert\\mathrm{Im}(t)\\rvert. $$\n\nThen\n\n$$ H^{\\ast}(f) \\leq M - 1. $$\n\n> **Equivalently.** If a Boolean function depends only on a positive weighted sum of the input bits, then one can realize it with one head per distinct nonzero level of that statistic.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/01_foundations_and_normal_form/009_weighted_sum_upper_bound.md","leanCertified":true,"topic":"foundation","kind":"theorem","in":0,"out":3,"degree":3},{"id":"010","title":"Linear-Fractional Normal Form","note":"This note gives an exact normal form for in the model from . For parameters and define a one-head atom Here , so means when and when . Define to be the least such that there exist one-head atoms and a constant with for every . For , the sum is empty. Then Interpretation. The exact model-native invariant for head complexity is the minimum number of one-head linear-fractional atoms whose sum, plus a constant, sign-represents . The first two levels of this hierarchy are pinned down in .","interpretation":"The exact model-native invariant for head complexity is the minimum number of one-head linear-fractional atoms whose sum, plus a constant, sign-represents . The first two levels of this hierarchy are pinned down in .","claim":"This note gives an exact normal form for $H^{\\ast}(f)$ in the model from [../../model.md](../../model.md).\n\nFor parameters\n\n$$ \\gamma \\gt 0, \\qquad \\rho_1, \\ldots, \\rho_n \\gt 0, \\qquad \\alpha \\gt 0, $$\n\nand\n\n$$ \\eta, \\delta, m_1, \\ldots, m_n \\in \\mathbb{R}, $$\n\ndefine a one-head atom\n\n$$ \\phi(x) := \\frac{ \\eta + \\sum_{i=1}^{n} \\rho_i \\alpha^{x_i}(m_i + \\delta x_i) }{ \\gamma + \\sum_{i=1}^{n} \\rho_i \\alpha^{x_i} }. $$\n\nHere $x_i \\in \\lbrace0,1\\rbrace$, so $\\alpha^{x_i}$ means $1$ when $x_i = 0$ and $\\alpha$ when $x_i = 1$.\n\nDefine $L_{\\mathrm{frac}}(f)$ to be the least $H$ such that there exist one-head atoms\n\n$$ \\phi_1, \\ldots, \\phi_H $$\n\nand a constant $c \\in \\mathbb{R}$ with\n\n$$ f(x) = 1 \\qquad \\Longleftrightarrow \\qquad c + \\sum_{h=1}^{H} \\phi_h(x) \\gt 0 $$\n\nfor every $x \\in \\lbrace0,1\\rbrace^n$. For $H = 0$, the sum is empty.\n\nThen\n\n$$ H^{\\ast}(f) = L_{\\mathrm{frac}}(f). $$\n\n> **Interpretation.** The exact model-native invariant for head complexity is the minimum number of one-head linear-fractional atoms whose sum, plus a constant, sign-represents $f$. The first two levels of this hierarchy are pinned down in [011_one_head_characterization.md](011_one_head_characterization.md).","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/01_foundations_and_normal_form/010_linear_fractional_normal_form.md","leanCertified":true,"topic":"foundation","kind":"theorem","in":0,"out":25,"degree":25},{"id":"011","title":"Exact One-Head Characterization","note":"The first two levels of head complexity are exactly characterized: and In particular, every non-linear-threshold Boolean function has This strictly strengthens the checkerboard obstruction as a one-head lower bound.","interpretation":"This result establishes exact one-head characterization for the fixed-query, one-layer attention model.","claim":"The first two levels of head complexity are exactly characterized:\n\n$$ H^{\\ast}(f) = 0 \\qquad \\Longleftrightarrow \\qquad f \\text{ is constant}, $$\n\nand\n\n$$ H^{\\ast}(f) = 1 \\qquad \\Longleftrightarrow \\qquad f \\text{ is a nonconstant linear threshold function}. $$\n\nIn particular, every non-linear-threshold Boolean function has\n\n$$ H^{\\ast}(f) \\geq 2. $$\n\nThis strictly strengthens the checkerboard obstruction [003_checkerboard_obstruction.md](003_checkerboard_obstruction.md) as a one-head lower bound.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/01_foundations_and_normal_form/011_one_head_characterization.md","leanCertified":true,"topic":"foundation","kind":"theorem","in":4,"out":35,"degree":39},{"id":"012","title":"Symmetric Sign-Change Characterization","note":"Let be symmetric. Thus there is a function such that for every input , where . Define the sign sequence Let Then Equivalently. For symmetric Boolean functions, head complexity is exactly the number of times the Hamming-weight truth table changes value.","interpretation":"This result establishes symmetric sign-change characterization for the fixed-query, one-layer attention model.","claim":"Let $f : \\lbrace0,1\\rbrace^n \\to \\lbrace0,1\\rbrace$ be symmetric. Thus there is a function\n\n$$ F : \\lbrace0,\\ldots,n\\rbrace \\to \\lbrace0,1\\rbrace $$\n\nsuch that\n\n$$ f(x) = F(\\lvert x\\rvert) $$\n\nfor every input $x$, where $\\lvert x\\rvert := x_1 + \\cdots + x_n$.\n\nDefine the sign sequence\n\n$$ \\sigma_k := \\begin{cases} +1 & \\text{if } F(k) = 1, \\cr -1 & \\text{if } F(k) = 0, \\end{cases} \\qquad 0 \\leq k \\leq n. $$\n\nLet\n\n$$ C(F) := \\lvert \\left\\lbrace t \\in \\lbrace1,\\ldots,n\\rbrace : \\sigma_{t-1} \\neq \\sigma_t \\right\\rbrace \\rvert. $$\n\nThen\n\n$$ H^{\\ast}(f) = C(F). $$\n\n> **Equivalently.** For symmetric Boolean functions, head complexity is exactly the number of times the Hamming-weight truth table changes value.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/01_foundations_and_normal_form/012_symmetric_sign_changes.md","leanCertified":true,"topic":"foundation","kind":"theorem","in":2,"out":9,"degree":11},{"id":"013","title":"Positive-Projection Sign-Change Upper Bound","note":"Let . Suppose there are positive weights and a function where such that for every . Write the image of in increasing order as Define signs Let Then Consequently, if where the minimum ranges over all positive weighted sums through which factors, then The quantity is finite for every Boolean function, because the binary-weight projection is injective on the Boolean cube. Equivalently. If a Boolean function becomes a one-dimensional labeled sequence after projection onto a positive weighted sum, then one head per labe","interpretation":"This result establishes positive-projection sign-change upper bound for the fixed-query, one-layer attention model.","claim":"Let $f : \\lbrace0,1\\rbrace^n \\to \\lbrace0,1\\rbrace$.\n\nSuppose there are positive weights\n\n$$ \\lambda_1,\\ldots,\\lambda_n \\gt 0 $$\n\nand a function\n\n$$ F : \\mathrm{Im}(t) \\to \\lbrace0,1\\rbrace, $$\n\nwhere\n\n$$ t(x) := \\sum_{i=1}^{n} \\lambda_i x_i, $$\n\nsuch that\n\n$$ f(x) = F(t(x)) $$\n\nfor every $x \\in \\lbrace0,1\\rbrace^n$.\n\nWrite the image of $t$ in increasing order as\n\n$$ 0 = \\tau_0 \\lt \\tau_1 \\lt \\cdots \\lt \\tau_{M-1}. $$\n\nDefine signs\n\n$$ \\sigma_m := \\begin{cases} +1 & \\text{if } F(\\tau_m) = 1, \\cr -1 & \\text{if } F(\\tau_m) = 0, \\end{cases} \\qquad 0 \\leq m \\leq M-1. $$\n\nLet\n\n$$ C_t(F) := \\lvert \\left\\lbrace m \\in \\lbrace1,\\ldots,M-1\\rbrace : \\sigma_{m-1} \\neq \\sigma_m \\right\\rbrace \\rvert. $$\n\nThen\n\n$$ H^{\\ast}(f) \\leq C_t(F). $$\n\nConsequently, if\n\n$$ C_{+}(f) := \\min C_t(F), $$\n\nwhere the minimum ranges over all positive weighted sums $t$ through which $f$ factors, then\n\n$$ H^{\\ast}(f) \\leq C_{+}(f) \\leq M_{+}(f) - 1. $$\n\nThe quantity $C_{+}(f)$ is finite for every Boolean function, because the binary-weight projection\n\n$$ t(x) = \\sum_{i=1}^{n} 2^{i-1}x_i $$\n\nis injective on the Boolean cube.\n\n> **Equivalently.** If a Boolean function becomes a one-dimensional labeled sequence after projection onto a positive weighted sum, then one head per label change along that sequence suffices.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/01_foundations_and_normal_form/013_positive_projection_sign_changes.md","leanCertified":false,"topic":"foundation","kind":"theorem","in":0,"out":0,"degree":0},{"id":"013","title":"Explicit Strict Separation Between Threshold Degree And Head Complexity","note":"Split a ten-bit input into two blocks of five bits. Encode each bit by a sign, with represented by and represented by . Write the resulting sign vectors as Define the quadratic score and define the Boolean function by Then In particular, Interpretation. Threshold degree is always a lower bound for head complexity by , but this explicit function shows that the lower bound can be strict.","interpretation":"Threshold degree is always a lower bound for head complexity by , but this explicit function shows that the lower bound can be strict.","claim":"Split a ten-bit input into two blocks of five bits. Encode each bit by a sign, with $0$ represented by $+1$ and $1$ represented by $-1$. Write the resulting sign vectors as\n\n$$ x=(x_1,\\ldots,x_5)\\in\\lbrace-1,+1\\rbrace^5, \\qquad y=(y_1,\\ldots,y_5)\\in\\lbrace-1,+1\\rbrace^5. $$\n\nDefine the quadratic score\n\n$$ Q(x,y):=\\left(\\sum_{i=1}^{5}x_i\\right)\\left(\\sum_{j=1}^{5}y_j\\right)-3\\sum_{i=1}^{5}x_i y_i, $$\n\nand define the Boolean function $f_{10}$ by\n\n$$ f_{10}(x,y)=1 \\qquad\\Longleftrightarrow\\qquad Q(x,y) \\gt 0. $$\n\nThen\n\n$$ \\deg_{\\pm}(f_{10})=2 \\lt 3\\leq H^{\\ast}(f_{10}). $$\n\nIn particular,\n\n$$ \\deg_{\\pm}(f_{10})\\neq H^{\\ast}(f_{10}). $$\n\n> **Interpretation.** Threshold degree is always a lower bound for head complexity by [006_threshold_degree_head_complexity_bound.md](../01_foundations_and_normal_form/006_threshold_degree_head_complexity_bound.md), but this explicit function shows that the lower bound can be strict.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/02_separations_and_counterexamples/013_strict_threshold_degree_separation.md","leanCertified":true,"topic":"separation","kind":"theorem","in":3,"out":16,"degree":19},{"id":"014","title":"Three-Bit Projection Cases","note":"This note applies the one-head linear-threshold characterization and the positive-projection sign-change bound to two of the provisional three-head functions from . For the function with bitstring where the input order is , the exact value is For the function with bitstring we have the bounds The second bound is sharpened to an exact value in .","interpretation":"This result establishes three-bit projection cases for the fixed-query, one-layer attention model.","claim":"This note applies the one-head linear-threshold characterization and the positive-projection sign-change bound to two of the provisional three-head functions from [three_head_functions_n3.md](https://github.com/karthikviswanathn/how-many-attention-heads-xor/blob/autoresearch/three_head_functions_n3.md).\n\nFor the function with bitstring\n\n$$ 00011000, $$\n\nwhere the input order is $000,001,010,011,100,101,110,111$, the exact value is\n\n$$ H^{\\ast}(00011000) = 2. $$\n\nFor the function with bitstring\n\n$$ 00101001, $$\n\nwe have the bounds\n\n$$ 2 \\leq H^{\\ast}(00101001) \\leq 3. $$\n\nThe second bound is sharpened to an exact value in [015_three_bit_quadratic_upper_bound.md](015_three_bit_quadratic_upper_bound.md).","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/01_foundations_and_normal_form/014_three_bit_projecti
