 within-slice statistic.","claim":"For a fixed split of variables $(z,y)$ with $z\\in\\lbrace0,1\\rbrace^{k}$, define the endpoint-coupled positive slice cost\n\n$$ \\mathrm{eps}_{+}^{z\\mid y}(f) := \\min_t \\left( \\sum_{a\\in\\lbrace0,1\\rbrace^{k}} C_a(t)+B_{+}(p_t,q_t) \\right), $$\n\nwhere $t(y)=\\sum_i\\lambda_i y_i$ ranges over all positive statistics through which every raw slice factors,\n\n$$ f(a,y)=F_{a,t}(t(y)), $$\n\n$C_a(t)$ is the sign-change count of $F_{a,t}$ along the ordered image of $t$, and\n\n$$ q_t(a):=F_{a,t}(\\tau_0), \\qquad p_t(a):=F_{a,t}(\\tau_{M-1}). $$\n\nThen\n\n$$ H^{\\ast}(f)\\leq \\mathrm{eps}_{+}^{z\\mid y}(f). $$\n\nMoreover,\n\n$$ \\mathrm{eps}_{+}^{z\\mid y}(f) \\leq \\mathrm{osc}_{+}^{z\\mid y}(f), $$\n\nwhere $\\mathrm{osc}_{+}^{z\\mid y}$ is the optimized ordered-slice cost from Lemma 149.\n\nThe cost is invariant under output complement:\n\n$$ \\mathrm{eps}_{+}^{z\\mid y}(1-f) = \\mathrm{eps}_{+}^{z\\mid y}(f). $$\n\nIt is also invariant under permutations of the raw coordinates and under permutations of the feature coordinates.\n\n> **Interpretation.** The optimized endpoint-coupled cost is a sharper split invariant than the ordered-slice cost because it optimizes the endpoint boundary separately from the within-slice statistic.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/163_endpoint_coupled_slice_cost_invariant.md","leanCertified":false,"topic":"gates","kind":"theorem","in":0,"out":0,"degree":0},{"id":"164","title":"Sparse-Slice Endpoint-Coupled Bound","note":"Let have a shared positive-statistic certificate as in Theorem 158. Let be the active raw-slice set. Let be the sign-change count of slice , and define the endpoint raw functions as in Theorem 158. Then In particular, if every active slice has at most sign changes, then If all slices share one endpoint background label , then If each active slice has a univariate sign polynomial in of degree at most , then with the term vanishing in the common-endpoint case. Interpretation. A shared-statistic function with only a f","interpretation":"A shared-statistic function with only a few nonconstant raw slices has head complexity controlled by the active slices plus endpoint coupling, independent of the total number of raw assignments except through the endpoint boundary.","claim":"Let $f(z,y)$ have a shared positive-statistic certificate as in Theorem 158. Let\n\n$$ A:=\\lbrace a\\in\\lbrace0,1\\rbrace^{k}:F_a(t(y))\\text{ is nonconstant}\\rbrace $$\n\nbe the active raw-slice set. Let $C_a$ be the sign-change count of slice $a$, and define the endpoint raw functions $p,q$ as in Theorem 158. Then\n\n$$ \\max_{a\\in A}H^{\\ast}\\bigl(F_a(t(y))\\bigr) \\leq H^{\\ast}(f) \\leq \\sum_{a\\in A}C_a+B_{+}(p,q). $$\n\nIn particular, if every active slice has at most $C_{\\max}$ sign changes, then\n\n$$ H^{\\ast}(f)\\leq \\lvert A\\rvert C_{\\max}+B_{+}(p,q). $$\n\nIf all slices share one endpoint background label $b$, then\n\n$$ \\max_{a\\in A}H^{\\ast}\\bigl(F_a(t(y))\\bigr) \\leq H^{\\ast}(f) \\leq \\sum_{a\\in A}C_a \\leq \\lvert A\\rvert C_{\\max}. $$\n\nIf each active slice has a univariate sign polynomial in $t$ of degree at most $d_a$, then\n\n$$ \\max_{a\\in A}\\deg_{\\pm}\\bigl(F_a(t(y))\\bigr) \\leq H^{\\ast}(f) \\leq \\sum_{a\\in A}d_a+B_{+}(p,q), $$\n\nwith the $B_{+}$ term vanishing in the common-endpoint case.\n\n> **Interpretation.** A shared-statistic function with only a few nonconstant raw slices has head complexity controlled by the active slices plus endpoint coupling, independent of the total number of raw assignments except through the endpoint boundary.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/164_sparse_slice_endpoint_coupled_bound.md","leanCertified":false,"topic":"gates","kind":"theorem","in":0,"out":0,"degree":0},{"id":"165","title":"Positive Grid Slice Sandwich","note":"Let and . Let and Write the image of as and the image of as Suppose factors through the positive grid: For each raw level , let be the sign-change count of along . Let Then Interpretation. If the raw block itself factors through one positive statistic, the construction pays per raw level, not per raw assignment.","interpretation":"If the raw block itself factors through one positive statistic, the construction pays per raw level, not per raw assignment.","claim":"Let $z\\in\\lbrace0,1\\rbrace^{k}$ and $y\\in\\lbrace0,1\\rbrace^{m}$. Let\n\n$$ u(z)=\\sum_{j=1}^{k}\\rho_j z_j, \\qquad \\rho_j\\gt0, $$\n\nand\n\n$$ t(y)=\\sum_{i=1}^{m}\\lambda_i y_i, \\qquad \\lambda_i\\gt0. $$\n\nWrite the image of $u$ as\n\n$$ \\nu_0\\lt\\nu_1\\lt\\cdots\\lt\\nu_{R-1}, $$\n\nand the image of $t$ as\n\n$$ \\tau_0\\lt\\tau_1\\lt\\cdots\\lt\\tau_{M-1}. $$\n\nSuppose $f(z,y)$ factors through the positive grid:\n\n$$ f(z,y)=F(u(z),t(y)). $$\n\nFor each raw level $\\nu_r$, let $C_r$ be the sign-change count of\n\n$$ \\tau\\mapsto F(\\nu_r,\\tau) $$\n\nalong $\\tau_0,\\ldots,\\tau_{M-1}$. Let\n\n$$ J_{\\mathrm{grid}} := \\left\\lvert \\left\\lbrace r\\in\\lbrace0,\\ldots,R-2\\rbrace: F(\\nu_r,\\tau_{M-1})\\neq F(\\nu_{r+1},\\tau_0) \\right\\rbrace \\right\\rvert. $$\n\nThen\n\n$$ \\max_{0\\leq r\\lt R}H^{\\ast}\\bigl(F(\\nu_r,t(y))\\bigr) \\leq H^{\\ast}(f) \\leq \\sum_{r=0}^{R-1}C_r+J_{\\mathrm{grid}}. $$\n\n> **Interpretation.** If the raw block itself factors through one positive statistic, the construction pays per raw level, not per raw assignment.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/165_positive_grid_slice_sandwich.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":2,"degree":3},{"id":"166","title":"Positive Grid Degree And Exactness","note":"Use the setup of Theorem 165. Suppose that for each raw level there is a univariate polynomial of degree at most such that for every . Let Then If for every , then Moreover, if then Interpretation. On a positive grid, the upper bound scales with the number of raw statistic levels. It becomes exact whenever threshold degree reaches the grid concatenation cost.","interpretation":"On a positive grid, the upper bound scales with the number of raw statistic levels. It becomes exact whenever threshold degree reaches the grid concatenation cost.","claim":"Use the setup of Theorem 165. Suppose that for each raw level $\\nu_r$ there is a univariate polynomial $P_r(v)$ of degree at most $d_r$ such that\n\n$$ \\mathrm{sgn}(P_r(t(y)))= \\begin{cases} +1 & \\text{if } F(\\nu_r,t(y))=1,\\cr -1 & \\text{if } F(\\nu_r,t(y))=0 \\end{cases} $$\n\nfor every $y\\in\\lbrace0,1\\rbrace^{m}$. Let\n\n$$ \\delta_r:=\\deg_{\\pm}\\bigl(F(\\nu_r,t(y))\\bigr). $$\n\nThen\n\n$$ \\max_r\\delta_r \\leq H^{\\ast}(f) \\leq \\sum_{r=0}^{R-1}d_r+J_{\\mathrm{grid}}. $$\n\nIf $d_r\\leq d$ for every $r$, then\n\n$$ H^{\\ast}(f)\\leq Rd+J_{\\mathrm{grid}}. $$\n\nMoreover, if\n\n$$ \\deg_{\\pm}(f) = \\sum_{r=0}^{R-1}C_r+J_{\\mathrm{grid}}, $$\n\nthen\n\n$$ H^{\\ast}(f)=\\deg_{\\pm}(f). $$\n\n> **Interpretation.** On a positive grid, the upper bound scales with the number of raw statistic levels. It becomes exact whenever threshold degree reaches the grid concatenation cost.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/166_positive_grid_degree_exactness.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":2,"degree":3},{"id":"167","title":"Hamming-Layer Positive Grid Bound","note":"Let and . Suppose For each Hamming layer , let be the sign-change count of along the ordered image of . Let Then If each Hamming-layer slice has a univariate sign polynomial in of degree at most , then If for all , then Interpretation. A raw block that appears only through Hamming weight costs raw layers, not raw assignments.","interpretation":"A raw block that appears only through Hamming weight costs raw layers, not raw assignments.","claim":"Let $z\\in\\lbrace0,1\\rbrace^{k}$ and $y\\in\\lbrace0,1\\rbrace^{m}$. Suppose\n\n$$ f(z,y)=F(\\lvert z\\rvert,t(y)), \\qquad t(y)=\\sum_{i=1}^{m}\\lambda_i y_i, \\qquad \\lambda_i\\gt0. $$\n\nFor each Hamming layer $r\\in\\lbrace0,\\ldots,k\\rbrace$, let $C_r$ be the sign-change count of\n\n$$ \\tau\\mapsto F(r,\\tau) $$\n\nalong the ordered image of $t$. Let\n\n$$ J_{\\mathrm{Ham}} := \\left\\lvert \\left\\lbrace r\\in\\lbrace0,\\ldots,k-1\\rbrace: F(r,\\tau_{M-1})\\neq F(r+1,\\tau_0) \\right\\rbrace \\right\\rvert. $$\n\nThen\n\n$$ \\max_{0\\leq r\\leq k}H^{\\ast}\\bigl(F(r,t(y))\\bigr) \\leq H^{\\ast}(f) \\leq \\sum_{r=0}^{k}C_r+J_{\\mathrm{Ham}}. $$\n\nIf each Hamming-layer slice has a univariate sign polynomial in $t$ of degree at most $d_r$, then\n\n$$ H^{\\ast}(f)\\leq\\sum_{r=0}^{k}d_r+J_{\\mathrm{Ham}}. $$\n\nIf $d_r\\leq d$ for all $r$, then\n\n$$ H^{\\ast}(f)\\leq(k+1)d+J_{\\mathrm{Ham}}. $$\n\n> **Interpretation.** A raw block that appears only through Hamming weight costs $k+1$ raw layers, not $2^k$ raw assignments.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/167_hamming_layer_positive_grid_bound.md","leanCertified":false,"topic":"gates","kind":"theorem","in":2,"out":0,"degree":2},{"id":"168","title":"Sparse Raw-Level Positive Grid Bound","note":"Use the positive grid setup of Theorem 165. Let be the active raw-level set. Then If each active raw-level slice has at most sign changes, then If all raw-level slices share one endpoint background label , then The analogous degree bound replaces by univariate slice sign degrees . Interpretation. If only a few raw statistic levels are active, the positive grid bound pays for those levels rather than for the whole raw block.","interpretation":"If only a few raw statistic levels are active, the positive grid bound pays for those levels rather than for the whole raw block.","claim":"Use the positive grid setup of Theorem 165. Let\n\n$$ A:=\\lbrace r\\in\\lbrace0,\\ldots,R-1\\rbrace:F(\\nu_r,t(y))\\text{ is nonconstant}\\rbrace $$\n\nbe the active raw-level set. Then\n\n$$ \\max_{r\\in A}H^{\\ast}\\bigl(F(\\nu_r,t(y))\\bigr) \\leq H^{\\ast}(f) \\leq \\sum_{r\\in A}C_r+J_{\\mathrm{grid}}. $$\n\nIf each active raw-level slice has at most $C_{\\max}$ sign changes, then\n\n$$ H^{\\ast}(f)\\leq \\lvert A\\rvert C_{\\max}+J_{\\mathrm{grid}}. $$\n\nIf all raw-level slices share one endpoint background label $b$,\n\n$$ F(\\nu_r,\\tau_0)=F(\\nu_r,\\tau_{M-1})=b \\qquad \\text{for every }r, $$\n\nthen\n\n$$ \\max_{r\\in A}H^{\\ast}\\bigl(F(\\nu_r,t(y))\\bigr) \\leq H^{\\ast}(f) \\leq \\sum_{r\\in A}C_r. $$\n\nThe analogous degree bound replaces $C_r$ by univariate slice sign degrees $d_r$.\n\n> **Interpretation.** If only a few raw statistic levels are active, the positive grid bound pays for those levels rather than for the whole raw block.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/168_sparse_raw_level_positive_grid_bound.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":0,"degree":1},{"id":"169","title":"Positive Grid Cost Invariant","note":"For a fixed split , define to be the minimum of over all positive-grid certificates and all functions such that Here and are the raw-level slice variation and endpoint-jump terms from Theorem 165. Then Moreover, if denotes the optimized positive-projection sign-change count, then The cost is invariant under output complement, raw-coordinate permutation, and feature-coordinate permutation. Finally, if then Interpretation. Positive-grid cost is an optimized split invariant. It can be much smaller than raw-assignment ","interpretation":"Positive-grid cost is an optimized split invariant. It can be much smaller than raw-assignment slice cost when many raw assignments share one raw statistic level.","claim":"For a fixed split $(z,y)$, define $\\mathrm{pgc}_{+}^{z\\mid y}(f)$ to be the minimum of\n\n$$ \\sum_{r=0}^{R-1}C_r+J_{\\mathrm{grid}} $$\n\nover all positive-grid certificates\n\n$$ u(z)=\\sum_j\\rho_jz_j, \\qquad t(y)=\\sum_i\\lambda_i y_i, \\qquad \\rho_j,\\lambda_i\\gt0, $$\n\nand all functions $F$ such that\n\n$$ f(z,y)=F(u(z),t(y)). $$\n\nHere $C_r$ and $J_{\\mathrm{grid}}$ are the raw-level slice variation and endpoint-jump terms from Theorem 165. Then\n\n$$ H^{\\ast}(f)\\leq\\mathrm{pgc}_{+}^{z\\mid y}(f). $$\n\nMoreover, if $C_{+}(f)$ denotes the optimized positive-projection sign-change count, then\n\n$$ C_{+}(f)\\leq\\mathrm{pgc}_{+}^{z\\mid y}(f). $$\n\nThe cost $\\mathrm{pgc}_{+}^{z\\mid y}$ is invariant under output complement, raw-coordinate permutation, and feature-coordinate permutation.\n\nFinally, if\n\n$$ \\deg_{\\pm}(f)=\\mathrm{pgc}_{+}^{z\\mid y}(f), $$\n\nthen\n\n$$ H^{\\ast}(f)=\\deg_{\\pm}(f)=\\mathrm{pgc}_{+}^{z\\mid y}(f). $$\n\n> **Interpretation.** Positive-grid cost is an optimized split invariant. It can be much smaller than raw-assignment slice cost when many raw assignments share one raw statistic level.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/169_positive_grid_cost_invariant.md","leanCertified":false,"topic":"gates","kind":"theorem","in":0,"out":0,"degree":0},{"id":"170","title":"Positive Lexicographic Multigrid Bound","note":"Let the variables be split into disjoint blocks For each block, let and write the image of as Assume Order the grid lexicographically, with slowest and fastest. Let be the number of sign changes in the ordered Boolean sequence obtained by reading along this lexicographic grid path. Then For every block and every choice of levels in the other blocks, the corresponding one-block fiber gives a restriction lower bound: If then Interpretation. Any finite positive-statistic multigrid can be traversed by one positive proj","interpretation":"Any finite positive-statistic multigrid can be traversed by one positive projection. The cost is the number of label changes along that lexicographic traversal.","claim":"Let the variables be split into $b\\geq2$ disjoint blocks\n\n$$ x^{(1)},\\ldots,x^{(b)}. $$\n\nFor each block, let\n\n$$ t_j(x^{(j)})=\\sum_i\\lambda_{j,i}x^{(j)}_i, \\qquad \\lambda_{j,i}\\gt0, $$\n\nand write the image of $t_j$ as\n\n$$ V_j=\\lbrace\\nu^{(j)}_0\\lt\\nu^{(j)}_1\\lt\\cdots\\lt\\nu^{(j)}_{R_j-1}\\rbrace. $$\n\nAssume\n\n$$ f(x^{(1)},\\ldots,x^{(b)})=F(t_1(x^{(1)}),\\ldots,t_b(x^{(b)})). $$\n\nOrder the grid\n\n$$ V_1\\times\\cdots\\times V_b $$\n\nlexicographically, with $V_1$ slowest and $V_b$ fastest. Let $L_{\\mathrm{lex}}(F)$ be the number of sign changes in the ordered Boolean sequence obtained by reading $F$ along this lexicographic grid path.\n\nThen\n\n$$ H^{\\ast}(f)\\leq L_{\\mathrm{lex}}(F). $$\n\nFor every block $j$ and every choice of levels in the other blocks, the corresponding one-block fiber gives a restriction lower bound:\n\n$$ H^{\\ast}\\bigl(F(\\nu^{(1)}_{r_1},\\ldots,\\nu^{(j-1)}_{r_{j-1}},t_j(x^{(j)}),\\nu^{(j+1)}_{r_{j+1}},\\ldots,\\nu^{(b)}_{r_b})\\bigr) \\leq H^{\\ast}(f). $$\n\nIf\n\n$$ \\deg_{\\pm}(f)=L_{\\mathrm{lex}}(F), $$\n\nthen\n\n$$ H^{\\ast}(f)=\\deg_{\\pm}(f)=L_{\\mathrm{lex}}(F). $$\n\n> **Interpretation.** Any finite positive-statistic multigrid can be traversed by one positive projection. The cost is the number of label changes along that lexicographic traversal.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/170_positive_lexicographic_multigrid_bound.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":2,"degree":3},{"id":"171","title":"Multi-Hamming Profile Bound","note":"Let the variables be split into blocks with block sizes . Suppose Read the grid in lexicographic order, with the first block slowest and the last block fastest. Let be the number of sign changes of along this ordered grid path. Then For every block and every choice of Hamming weights in the other blocks, the corresponding symmetric one-block fiber lower-bounds : If then Interpretation. A function of several Hamming weights has a head upper bound equal to the sign changes along any chosen lexicographic path through ","interpretation":"A function of several Hamming weights has a head upper bound equal to the sign changes along any chosen lexicographic path through its weight grid.","claim":"Let the variables be split into $b\\geq2$ blocks\n\n$$ x^{(1)},\\ldots,x^{(b)} $$\n\nwith block sizes $n_1,\\ldots,n_b$. Suppose\n\n$$ f(x^{(1)},\\ldots,x^{(b)}) = F(\\lvert x^{(1)}\\rvert,\\ldots,\\lvert x^{(b)}\\rvert). $$\n\nRead the grid\n\n$$ \\lbrace0,\\ldots,n_1\\rbrace\\times\\cdots\\times\\lbrace0,\\ldots,n_b\\rbrace $$\n\nin lexicographic order, with the first block slowest and the last block fastest. Let $L_{\\mathrm{Ham}}(F)$ be the number of sign changes of $F$ along this ordered grid path.\n\nThen\n\n$$ H^{\\ast}(f)\\leq L_{\\mathrm{Ham}}(F). $$\n\nFor every block $j$ and every choice of Hamming weights in the other blocks, the corresponding symmetric one-block fiber lower-bounds $H^{\\ast}(f)$:\n\n$$ H^{\\ast}\\bigl(F(r_1,\\ldots,r_{j-1},\\lvert x^{(j)}\\rvert,r_{j+1},\\ldots,r_b)\\bigr) \\leq H^{\\ast}(f). $$\n\nIf\n\n$$ \\deg_{\\pm}(f)=L_{\\mathrm{Ham}}(F), $$\n\nthen\n\n$$ H^{\\ast}(f)=\\deg_{\\pm}(f)=L_{\\mathrm{Ham}}(F). $$\n\n> **Interpretation.** A function of several Hamming weights has a head upper bound equal to the sign changes along any chosen lexicographic path through its weight grid.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/171_multi_hamming_profile_bound.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":1,"degree":2},{"id":"172","title":"Multigrid Run Bound","note":"Use the setup of Theorem 170, and read the grid values of in the same lexicographic order. For a label , let be the number of contiguous runs of the label in this ordered grid sequence. Then More sharply, if the chosen cheaper label has first and last sequence labels with respect to membership in the -label set, then If this sharper run count equals , then this upper bound is exact. Interpretation. Multigrid structure reduces sparse-support style bounds to runs along a grid path. The cost depends on the number of g","interpretation":"Multigrid structure reduces sparse-support style bounds to runs along a grid path. The cost depends on the number of grid runs, not on the number of cube points in those runs.","claim":"Use the setup of Theorem 170, and read the grid values of $F$ in the same lexicographic order. For a label $b\\in\\lbrace0,1\\rbrace$, let $R_b$ be the number of contiguous runs of the label $b$ in this ordered grid sequence.\n\nThen\n\n$$ H^{\\ast}(f)\\leq 2\\min\\lbrace R_0,R_1\\rbrace. $$\n\nMore sharply, if the chosen cheaper label $b$ has first and last sequence labels $\\epsilon_0,\\epsilon_1$ with respect to membership in the $b$-label set, then\n\n$$ H^{\\ast}(f)\\leq 2R_b-\\epsilon_0-\\epsilon_1. $$\n\nIf this sharper run count equals $\\deg_{\\pm}(f)$, then this upper bound is exact.\n\n> **Interpretation.** Multigrid structure reduces sparse-support style bounds to runs along a grid path. The cost depends on the number of grid runs, not on the number of cube points in those runs.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/172_multigrid_run_bound.md","leanCertified":false,"topic":"gates","kind":"theorem","in":0,"out":1,"degree":1},{"id":"173","title":"Positive Multigrid Cost Invariant","note":"Fix a partition of the input variables into nonempty blocks A positive multigrid certificate for over consists of positive statistics a Boolean function on the product of their images, and a block order such that Let be the sign-change count of when the product grid is read lexicographically with the block order , slowest to fastest. Define where the minimum ranges over all positive multigrid certificates over and all block orders . Then Also The invariant is unchanged by output complement and by coordinate permuta","interpretation":"The multigrid cost is a partition-level positive-projection invariant. It captures the best lexicographic traversal of a product of positive-statistic images.","claim":"Fix a partition $\\mathcal{P}$ of the input variables into nonempty blocks\n\n$$ B_1,\\ldots,B_b. $$\n\nA positive multigrid certificate for $f$ over $\\mathcal{P}$ consists of positive statistics\n\n$$ t_j(x_{B_j})=\\sum_{i\\in B_j}\\lambda_{j,i}x_i, \\qquad \\lambda_{j,i}\\gt0, $$\n\na Boolean function $F$ on the product of their images, and a block order $\\pi$ such that\n\n$$ f(x)=F(t_1(x_{B_1}),\\ldots,t_b(x_{B_b})). $$\n\nLet $L_{\\pi}(F)$ be the sign-change count of $F$ when the product grid is read lexicographically with the block order $\\pi$, slowest to fastest.\n\nDefine\n\n$$ \\mathrm{mgc}_{+}^{\\mathcal{P}}(f) := \\min L_{\\pi}(F), $$\n\nwhere the minimum ranges over all positive multigrid certificates over $\\mathcal{P}$ and all block orders $\\pi$.\n\nThen\n\n$$ H^{\\ast}(f)\\leq\\mathrm{mgc}_{+}^{\\mathcal{P}}(f). $$\n\nAlso\n\n$$ C_{+}(f)\\leq\\mathrm{mgc}_{+}^{\\mathcal{P}}(f). $$\n\nThe invariant is unchanged by output complement and by coordinate permutations that preserve the partition up to relabeling of blocks.\n\nIf\n\n$$ \\deg_{\\pm}(f)=\\mathrm{mgc}_{+}^{\\mathcal{P}}(f), $$\n\nthen\n\n$$ H^{\\ast}(f)=\\deg_{\\pm}(f)=\\mathrm{mgc}_{+}^{\\mathcal{P}}(f). $$\n\n> **Interpretation.** The multigrid cost is a partition-level positive-projection invariant. It captures the best lexicographic traversal of a product of positive-statistic images.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/173_positive_multigrid_cost_invariant.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":0,"degree":1},{"id":"174","title":"Block-Order Hamming Profile Cost","note":"Let the variables be split into blocks of sizes , and suppose For a block order , let be the sign-change count obtained by reading the Hamming-weight grid lexicographically in the block order . Define Then If then For each block order and label , let be the number of contiguous runs of label in the corresponding lexicographic Hamming-grid sequence. Then More sharply, if label has first and last membership indicators and in the order , then Interpretation. For multiblock profile predicates, the block order is part o","interpretation":"For multiblock profile predicates, the block order is part of the certificate. Choosing the right order can lower the grid-path variation substantially.","claim":"Let the variables be split into blocks\n\n$$ B_1,\\ldots,B_b $$\n\nof sizes $n_1,\\ldots,n_b$, and suppose\n\n$$ f(x)=F(\\lvert x_{B_1}\\rvert,\\ldots,\\lvert x_{B_b}\\rvert). $$\n\nFor a block order $\\pi$, let $L_{\\pi}^{\\mathrm{Ham}}(F)$ be the sign-change count obtained by reading the Hamming-weight grid\n\n$$ \\lbrace0,\\ldots,n_1\\rbrace\\times\\cdots\\times\\lbrace0,\\ldots,n_b\\rbrace $$\n\nlexicographically in the block order $\\pi$. Define\n\n$$ \\mathrm{mhc}(F):=\\min_{\\pi}L_{\\pi}^{\\mathrm{Ham}}(F). $$\n\nThen\n\n$$ H^{\\ast}(f)\\leq\\mathrm{mhc}(F). $$\n\nIf\n\n$$ \\deg_{\\pm}(f)=\\mathrm{mhc}(F), $$\n\nthen\n\n$$ H^{\\ast}(f)=\\deg_{\\pm}(f)=\\mathrm{mhc}(F). $$\n\nFor each block order $\\pi$ and label $b\\in\\lbrace0,1\\rbrace$, let $R_{b,\\pi}$ be the number of contiguous runs of label $b$ in the corresponding lexicographic Hamming-grid sequence. Then\n\n$$ H^{\\ast}(f) \\leq 2\\min_{\\pi}\\min\\lbrace R_{0,\\pi},R_{1,\\pi}\\rbrace. $$\n\nMore sharply, if label $b$ has first and last membership indicators $\\epsilon_{0,\\pi}$ and $\\epsilon_{1,\\pi}$ in the order $\\pi$, then\n\n$$ H^{\\ast}(f)\\leq \\min_{\\pi,b}\\left(2R_{b,\\pi}-\\epsilon_{0,\\pi}-\\epsilon_{1,\\pi}\\right). $$\n\n> **Interpretation.** For multiblock profile predicates, the block order is part of the certificate. Choosing the right order can lower the grid-path variation substantially.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/174_block_order_hamming_profile_cost.md","leanCertified":false,"topic":"gates","kind":"theorem","in":2,"out":0,"degree":2},{"id":"175","title":"Positive Profile Projection Collapse","note":"Let the variables be split into blocks with block sizes . Suppose Let . Assume there is a Boolean function on the image of over the profile grid such that List the image of on the grid in increasing order: Define Then If then In particular, if , so that and , then Interpretation. A multiblock Hamming profile can sometimes collapse to one positive projection. In that case the right cost is the sign-change count of the collapsed weighted sum, not the sign-change count along a full lexicographic grid traversal.","interpretation":"A multiblock Hamming profile can sometimes collapse to one positive projection. In that case the right cost is the sign-change count of the collapsed weighted sum, not the sign-change count along a full lexicographic grid traversal.","claim":"Let the variables be split into blocks\n\n$$ B_1,\\ldots,B_b $$\n\nwith block sizes $n_1,\\ldots,n_b$. Suppose\n\n$$ f(x)=F(\\lvert x_{B_1}\\rvert,\\ldots,\\lvert x_{B_b}\\rvert). $$\n\nLet $a_1,\\ldots,a_b\\gt0$. Assume there is a Boolean function $G$ on the image of\n\n$$ s(r_1,\\ldots,r_b):=\\sum_{j=1}^{b}a_jr_j $$\n\nover the profile grid such that\n\n$$ F(r_1,\\ldots,r_b)=G(s(r_1,\\ldots,r_b)). $$\n\nList the image of $s$ on the grid in increasing order:\n\n$$ \\tau_0\\lt\\tau_1\\lt\\cdots\\lt\\tau_{M-1}. $$\n\nDefine\n\n$$ C_a(G) := \\lvert\\lbrace m\\in\\lbrace1,\\ldots,M-1\\rbrace:G(\\tau_{m-1})\\neq G(\\tau_m)\\rbrace\\rvert. $$\n\nThen\n\n$$ H^{\\ast}(f)\\leq C_a(G), \\qquad C_{+}(f)\\leq C_a(G). $$\n\nIf\n\n$$ \\deg_{\\pm}(f)=C_a(G), $$\n\nthen\n\n$$ H^{\\ast}(f)=\\deg_{\\pm}(f)=C_a(G). $$\n\nIn particular, if $a_1=\\cdots=a_b=1$, so that\n\n$$ f(x)=G(\\lvert x\\rvert), $$\n\nand $N=n_1+\\cdots+n_b$, then\n\n$$ H^{\\ast}(f) = \\lvert\\lbrace k\\in\\lbrace1,\\ldots,N\\rbrace:G(k-1)\\neq G(k)\\rbrace\\rvert. $$\n\n> **Interpretation.** A multiblock Hamming profile can sometimes collapse to one positive projection. In that case the right cost is the sign-change count of the collapsed weighted sum, not the sign-change count along a full lexicographic grid traversal.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/175_positive_profile_projection_collapse.md","leanCertified":false,"topic":"gates","kind":"theorem","in":2,"out":0,"degree":2},{"id":"176","title":"Singleton Parity Multigrid Separation","note":"Let be the singleton partition, and let . Define Equivalently, Then, with computed for the singleton Hamming profile of parity, while Thus the singleton-block multigrid cost can be larger than the true head complexity by a factor Interpretation. Multigrid cost is a certificate cost, not an exact invariant of . For parity, the singleton partition forces a long binary odometer traversal, while the total Hamming-weight collapse gives the exact -head value.","interpretation":"Multigrid cost is a certificate cost, not an exact invariant of . For parity, the singleton partition forces a long binary odometer traversal, while the total Hamming-weight collapse gives the exact -head value.","claim":"Let\n\n$$ \\mathcal{P}_{\\mathrm{sing}}=\\lbrace\\lbrace1\\rbrace,\\ldots,\\lbrace n\\rbrace\\rbrace $$\n\nbe the singleton partition, and let $f=\\mathrm{XOR}_n$. Define\n\n$$ L_n := \\sum_{\\substack{1\\leq \\ell\\leq n\\cr n-\\ell\\ \\mathrm{even}}}2^{\\ell-1}. $$\n\nEquivalently,\n\n$$ L_n= \\begin{cases} \\dfrac{2^{n+1}-1}{3} & \\text{if } n \\text{ is odd},\\cr[6pt] \\dfrac{2^{n+1}-2}{3} & \\text{if } n \\text{ is even}. \\end{cases} $$\n\nThen, with $\\mathrm{mhc}$ computed for the singleton Hamming profile of parity,\n\n$$ \\mathrm{mgc}_{+}^{\\mathcal{P}_{\\mathrm{sing}}}(\\mathrm{XOR}_n) = \\mathrm{mhc}(\\mathrm{XOR}_n) = L_n, $$\n\nwhile\n\n$$ H^{\\ast}(\\mathrm{XOR}_n)=n. $$\n\nThus the singleton-block multigrid cost can be larger than the true head complexity by a factor\n\n$$ \\frac{L_n}{n}. $$\n\n> **Interpretation.** Multigrid cost is a certificate cost, not an exact invariant of $H^{\\ast}$. For parity, the singleton partition forces a long binary odometer traversal, while the total Hamming-weight collapse gives the exact $n$-head value.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/176_singleton_parity_multigrid_separation.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":0,"degree":1},{"id":"177","title":"Two-Block Singleton Grid Points Are Two-Head","note":"Let the variables be split into two nonempty blocks and , with Fix grid levels Define the singleton grid-point predicate Then More precisely, For the associated singleton grid function , this is exactly The two-head upper bound uses denominators with positive coefficients, so it is valid for the model-faithful one-signed denominator class. Interpretation. A disk on the two-block Hamming grid whose positive set is a single grid point is not a counterexample to the two-block collapse conjecture. It is an exact affine","interpretation":"A disk on the two-block Hamming grid whose positive set is a single grid point is not a counterexample to the two-block collapse conjecture. It is an exact affine level set after a nonresonant linear recombination of the two Hamming weights.","claim":"Let the variables be split into two nonempty blocks $A$ and $B$, with\n\n$$ s(x):=\\sum_{i\\in A}x_i, \\qquad t(x):=\\sum_{j\\in B}x_j. $$\n\nFix grid levels\n\n$$ r\\in\\lbrace0,\\ldots,\\lvert A\\rvert\\rbrace, \\qquad q\\in\\lbrace0,\\ldots,\\lvert B\\rvert\\rbrace. $$\n\nDefine the singleton grid-point predicate\n\n$$ f_{r,q}(x):=\\mathbf{1}[s(x)=r \\text{ and } t(x)=q]. $$\n\nThen\n\n$$ H^{\\ast}(f_{r,q})\\leq2. $$\n\nMore precisely,\n\n$$ H^{\\ast}(f_{r,q}) = \\begin{cases} 1, & \\text{if } f_{r,q} \\text{ is a nonconstant LTF},\\cr 2, & \\text{otherwise}. \\end{cases} $$\n\nFor the associated singleton grid function $G_{r,q}$, this is exactly\n\n$$ H^{\\ast}(f_{r,q})=\\delta(G_{r,q}). $$\n\nThe two-head upper bound uses denominators with positive coefficients, so it is valid for the model-faithful one-signed denominator class.\n\n> **Interpretation.** A disk on the two-block Hamming grid whose positive set is a single grid point is not a counterexample to the two-block collapse conjecture. It is an exact affine level set after a nonresonant linear recombination of the two Hamming weights.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/177_two_block_singleton_grid_point_exact.md","leanCertified":false,"topic":"gates","kind":"theorem","in":2,"out":0,"degree":2},{"id":"178","title":"Two-Block Affine Grid Lines Are Two-Head","note":"Let the variables be split into two nonempty blocks and , with Fix real numbers , with . Define the affine grid-line predicate Then More precisely, Let be the associated grid function on the grid , and let be the least total degree of a real polynomial in that strictly sign-represents on this grid. Then Interpretation. Two-block Hamming profiles supported on one affine grid line collapse to the affine level-set theorem. Singleton grid points are the special case where the chosen affine line avoids every other grid ","interpretation":"Two-block Hamming profiles supported on one affine grid line collapse to the affine level-set theorem. Singleton grid points are the special case where the chosen affine line avoids every other grid point.","claim":"Let the variables be split into two nonempty blocks $A$ and $B$, with\n\n$$ s(x):=\\sum_{i\\in A}x_i, \\qquad t(x):=\\sum_{j\\in B}x_j. $$\n\nFix real numbers $a,b,c$, with $(a,b)\\neq(0,0)$. Define the affine grid-line predicate\n\n$$ f_{a,b,c}(x):=\\mathbf{1}[a s(x)+b t(x)+c=0]. $$\n\nThen\n\n$$ H^{\\ast}(f_{a,b,c})\\leq2. $$\n\nMore precisely,\n\n$$ H^{\\ast}(f_{a,b,c}) = \\begin{cases} 0 & \\text{if } f_{a,b,c} \\text{ is constant},\\cr 1 & \\text{if } f_{a,b,c} \\text{ is a nonconstant LTF},\\cr 2 & \\text{otherwise}. \\end{cases} $$\n\nLet $G_{a,b,c}$ be the associated grid function\n\n$$ G_{a,b,c}(u,v):=\\mathbf{1}[a u+b v+c=0] $$\n\non the grid $\\lbrace0,\\ldots,\\lvert A\\rvert\\rbrace\\times\\lbrace0,\\ldots,\\lvert B\\rvert\\rbrace$, and let $\\delta(G_{a,b,c})$ be the least total degree of a real polynomial in $u,v$ that strictly sign-represents $G_{a,b,c}$ on this grid. Then\n\n$$ H^{\\ast}(f_{a,b,c})=\\delta(G_{a,b,c}). $$\n\n> **Interpretation.** Two-block Hamming profiles supported on one affine grid line collapse to the affine level-set theorem. Singleton grid points are the special case where the chosen affine line avoids every other grid point.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/178_two_block_affine_grid_line_exact.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":0,"degree":1},{"id":"179","title":"Two-Block Affine Grid Strips Are Two-Head","note":"Let the variables be split into two nonempty blocks and , with Fix real numbers , with and . Define the affine grid-strip predicate Then More precisely, Let be the associated grid function on the grid , and let be the least total degree of a real polynomial in that strictly sign-represents on this grid. Then Interpretation. A two-block Hamming profile supported between two parallel affine grid lines is exactly an affine slab after lifting to the cube. Thus all affine strips in the two-block profile grid live at hea","interpretation":"A two-block Hamming profile supported between two parallel affine grid lines is exactly an affine slab after lifting to the cube. Thus all affine strips in the two-block profile grid live at head complexity at most two.","claim":"Let the variables be split into two nonempty blocks $A$ and $B$, with\n\n$$ s(x):=\\sum_{i\\in A}x_i, \\qquad t(x):=\\sum_{j\\in B}x_j. $$\n\nFix real numbers $a,b,c,\\alpha,\\beta$, with $(a,b)\\neq(0,0)$ and $\\alpha\\leq\\beta$. Define the affine grid-strip predicate\n\n$$ f_{a,b,c,\\alpha,\\beta}(x):=\\mathbf{1}[\\alpha\\leq a s(x)+b t(x)+c\\leq\\beta]. $$\n\nThen\n\n$$ H^{\\ast}(f_{a,b,c,\\alpha,\\beta})\\leq2. $$\n\nMore precisely,\n\n$$ H^{\\ast}(f_{a,b,c,\\alpha,\\beta}) = \\begin{cases} 0 & \\text{if } f_{a,b,c,\\alpha,\\beta} \\text{ is constant},\\cr 1 & \\text{if } f_{a,b,c,\\alpha,\\beta} \\text{ is a nonconstant LTF},\\cr 2 & \\text{otherwise}. \\end{cases} $$\n\nLet $G_{a,b,c,\\alpha,\\beta}$ be the associated grid function\n\n$$ G_{a,b,c,\\alpha,\\beta}(u,v):=\\mathbf{1}[\\alpha\\leq a u+b v+c\\leq\\beta] $$\n\non the grid $\\lbrace0,\\ldots,\\lvert A\\rvert\\rbrace\\times\\lbrace0,\\ldots,\\lvert B\\rvert\\rbrace$, and let $\\delta(G_{a,b,c,\\alpha,\\beta})$ be the least total degree of a real polynomial in $u,v$ that strictly sign-represents $G_{a,b,c,\\alpha,\\beta}$ on this grid. Then\n\n$$ H^{\\ast}(f_{a,b,c,\\alpha,\\beta})=\\delta(G_{a,b,c,\\alpha,\\beta}). $$\n\n> **Interpretation.** A two-block Hamming profile supported between two parallel affine grid lines is exactly an affine slab after lifting to the cube. Thus all affine strips in the two-block profile grid live at head complexity at most two.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/179_two_block_affine_grid_strips_exact.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":0,"degree":1},{"id":"180","title":"Hypercube-Path Bilinear Strict Separation","note":"Let be the following set of -bit strings: This set has cardinality . Define the sign matrix by Introduce Boolean variables for and . Thus there are input variables. Define and define by Then In particular, Interpretation. Threshold degree is not always equal to head complexity. This explicit function on bits has a quadratic sign representation, but no sum of two one-head linear-fractional atoms can realize its sign pattern.","interpretation":"Threshold degree is not always equal to head complexity. This explicit function on bits has a quadratic sign representation, but no sum of two one-head linear-fractional atoms can realize its sign pattern.","claim":"Let $\\mathcal{R}$ be the following set of $8$-bit strings:\n\n$$ \\mathcal{R}:=\\left\\lbrace r\\in\\lbrace0,1\\rbrace^8:r_8=0,\\quad \\sum_{j=1}^{8}r_j\\equiv0\\pmod2,\\quad r_4=0\\text{ or }r_1+r_2+r_3\\equiv1\\pmod2\\right\\rbrace. $$\n\nThis set has cardinality $48$. Define the $48\\times8$ sign matrix $S$ by\n\n$$ S_{r,j}:=(-1)^{r_j} \\qquad\\text{for }r\\in\\mathcal{R},\\quad j\\in\\lbrace1,\\ldots,8\\rbrace. $$\n\nIntroduce Boolean variables $x_r$ for $r\\in\\mathcal{R}$ and $y_1,\\ldots,y_8$. Thus there are $56$ input variables. Define\n\n$$ P(x,y):=\\frac{1}{2}+\\sum_{r\\in\\mathcal{R}}\\sum_{j=1}^{8}S_{r,j}x_r y_j, $$\n\nand define $f_{\\mathrm{HC}}:\\lbrace0,1\\rbrace^{56}\\to\\lbrace0,1\\rbrace$ by\n\n$$ f_{\\mathrm{HC}}(x,y)=1 \\qquad\\Longleftrightarrow\\qquad P(x,y)\\gt0. $$\n\nThen\n\n$$ \\deg_{\\pm}(f_{\\mathrm{HC}})=2 \\qquad\\text{and}\\qquad H^{\\ast}(f_{\\mathrm{HC}})\\geq3. $$\n\nIn particular,\n\n$$ \\deg_{\\pm}(f_{\\mathrm{HC}})\\lt H^{\\ast}(f_{\\mathrm{HC}}). $$\n\n> **Interpretation.** Threshold degree is not always equal to head complexity. This explicit function on $56$ bits has a quadratic sign representation, but no sum of two one-head linear-fractional atoms can realize its sign pattern.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/06_strict_separations/180_hypercube_path_strict_separation.md","leanCertified":false,"topic":"separation","kind":"theorem","in":1,"out":2,"degree":3},{"id":"181","title":"Compact Hypercube-Path Strict Separation","note":"For , define its integer code by Let be the set of strings whose codes belong to Every string in has even parity and eighth bit . Define the sign matrix by Introduce Boolean variables for and . Thus there are input variables. Define and define by Then In particular, Interpretation. This is a computer-certified compression of the structured -bit construction in Theorem 180. Its complete description is the displayed list of row codes.","interpretation":"This is a computer-certified compression of the structured -bit construction in Theorem 180. Its complete description is the displayed list of row codes.","claim":"For $r=(r_1,\\ldots,r_8)\\in\\lbrace0,1\\rbrace^8$, define its integer code by\n\n$$ \\mathrm{code}(r):=\\sum_{j=1}^{8}2^{j-1}r_j. $$\n\nLet $\\mathcal{R}_{35}$ be the set of strings whose codes belong to\n\n$$ \\mathcal{C}_{35}:=\\lbrace0,3,5,10,12,15,18,20,23,30,34,36,39,46,54,65,72,75,77,80,83,85,90,92,95,96,99,101,106,108,111,114,116,119,126\\rbrace. $$\n\nEvery string in $\\mathcal{R}_{35}$ has even parity and eighth bit $0$. Define the $35\\times8$ sign matrix $S^{(35)}$ by\n\n$$ S^{(35)}_{r,j}:=(-1)^{r_j} \\qquad\\text{for }r\\in\\mathcal{R}_{35},\\quad j\\in\\lbrace1,\\ldots,8\\rbrace. $$\n\nIntroduce Boolean variables $x_r$ for $r\\in\\mathcal{R}_{35}$ and $y_1,\\ldots,y_8$. Thus there are $43$ input variables. Define\n\n$$ P_{35}(x,y):=\\frac{1}{2}+\\sum_{r\\in\\mathcal{R}_{35}}\\sum_{j=1}^{8}S^{(35)}_{r,j}x_r y_j, $$\n\nand define $f_{35}:\\lbrace0,1\\rbrace^{43}\\to\\lbrace0,1\\rbrace$ by\n\n$$ f_{35}(x,y)=1 \\qquad\\Longleftrightarrow\\qquad P_{35}(x,y)\\gt0. $$\n\nThen\n\n$$ \\deg_{\\pm}(f_{35})=2 \\qquad\\text{and}\\qquad H^{\\ast}(f_{35})\\geq3. $$\n\nIn particular,\n\n$$ \\deg_{\\pm}(f_{35})\\lt H^{\\ast}(f_{35}). $$\n\n> **Interpretation.** This is a computer-certified compression of the structured $56$-bit construction in Theorem 180. Its complete description is the displayed list of $35$ row codes.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/06_strict_separations/181_compact_hypercube_path_strict_separation.md","leanCertified":false,"topic":"separation","kind":"theorem","in":1,"out":1,"degree":2},{"id":"182","title":"Twelve-Bit Hamming-Threshold Strict Separation","note":"For , let Thus is the Hamming distance between and . Define by Then In particular, Interpretation. Thresholding the Hamming distance between two six-bit strings gives an explicit twelve-bit strict separation. A deterministic finite certificate proves the sign-rank obstruction.","interpretation":"Thresholding the Hamming distance between two six-bit strings gives an explicit twelve-bit strict separation. A deterministic finite certificate proves the sign-rank obstruction.","claim":"For $x,y\\in\\lbrace0,1\\rbrace^6$, let\n\n$$ \\Delta(x,y):=\\sum_{i=1}^{6}(x_i+y_i-2x_i y_i). $$\n\nThus $\\Delta(x,y)$ is the Hamming distance between $x$ and $y$. Define $f_{\\mathrm{Ham}}:\\lbrace0,1\\rbrace^{12}\\to\\lbrace0,1\\rbrace$ by\n\n$$ f_{\\mathrm{Ham}}(x,y)=1 \\qquad\\Longleftrightarrow\\qquad \\Delta(x,y)\\geq3. $$\n\nThen\n\n$$ \\deg_{\\pm}(f_{\\mathrm{Ham}})=2 \\qquad\\text{and}\\qquad H^{\\ast}(f_{\\mathrm{Ham}})\\geq3. $$\n\nIn particular,\n\n$$ \\deg_{\\pm}(f_{\\mathrm{Ham}})\\lt H^{\\ast}(f_{\\mathrm{Ham}}). $$\n\n> **Interpretation.** Thresholding the Hamming distance between two six-bit strings gives an explicit twelve-bit strict separation. A deterministic finite certificate proves the sign-rank obstruction.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/06_strict_separations/182_hamming_threshold_strict_separation.md","leanCertified":false,"topic":"separation","kind":"theorem","in":1,"out":1,"degree":2},{"id":"183","title":"Exact Small-Dimension Classification Through Four Bits","note":"For every integer with and every Boolean function we have Consequently, if is the least input dimension of a strict separation, then Certificate status. The four-bit case is computer-assisted, but every archived witness is integral and the verifier uses exact integer arithmetic. No numerical linear-programming result is trusted during verification.","interpretation":"This result establishes exact small-dimension classification through four bits for the fixed-query, one-layer attention model.","claim":"For every integer $n$ with $0\\leq n\\leq4$ and every Boolean function\n\n$$ f:\\lbrace0,1\\rbrace^n\\to\\lbrace0,1\\rbrace, $$\n\nwe have\n\n$$ H^{\\ast}(f)=\\deg_{\\pm}(f). $$\n\nConsequently, if $n_{\\mathrm{sep}}$ is the least input dimension of a strict separation, then\n\n$$ n_{\\mathrm{sep}}\\geq5. $$\n\n> **Certificate status.** The four-bit case is computer-assisted, but every archived witness is integral and the verifier uses exact integer arithmetic. No numerical linear-programming result is trusted during verification.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/06_strict_separations/183_small_dimension_exact_classification.md","leanCertified":false,"topic":"separation","kind":"theorem","in":5,"out":0,"degree":5},{"id":"184","title":"Eleven-Bit Quadratic Strict Separation","note":"Let and . Define the integer-valued quadratic polynomial Define by Then Consequently, Interpretation. An explicit quadratic threshold on a six-bit by five-bit partition contains the compact hypercube-path sign matrix. This gives a strict separation on eleven input bits.","interpretation":"An explicit quadratic threshold on a six-bit by five-bit partition contains the compact hypercube-path sign matrix. This gives a strict separation on eleven input bits.","claim":"Let $x\\in\\lbrace0,1\\rbrace^6$ and $y\\in\\lbrace0,1\\rbrace^5$. Define the integer-valued quadratic polynomial\n\n$$ \\begin{aligned} Q(x,y):={}&1-2x_3+8y_5-16x_1y_2+14x_1y_4-14x_1y_5-22x_2y_4+16x_2y_5 \\cr &+2x_3y_1+12x_3y_2+6x_3y_5-18x_4y_3-2x_5y_1-14x_5y_3-16x_6y_5 \\cr &+16y_1y_3+22y_2y_5-12y_3y_5. \\end{aligned} $$\n\nDefine $f_{11}:\\lbrace0,1\\rbrace^{11}\\to\\lbrace0,1\\rbrace$ by\n\n$$ f_{11}(x,y)=1 \\qquad\\Longleftrightarrow\\qquad Q(x,y)\\gt0. $$\n\nThen\n\n$$ \\deg_{\\pm}(f_{11})=2 \\qquad\\text{and}\\qquad H^{\\ast}(f_{11})\\geq3. $$\n\nConsequently,\n\n$$ \\deg_{\\pm}(f_{11})\\lt H^{\\ast}(f_{11}). $$\n\n> **Interpretation.** An explicit quadratic threshold on a six-bit by five-bit partition contains the compact hypercube-path sign matrix. This gives a strict separation on eleven input bits.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/06_strict_separations/184_eleven_bit_quadratic_strict_separation.md","leanCertified":false,"topic":"separation","kind":"theorem","in":3,"out":0,"degree":3},{"id":"185","title":"Nine-Bit Antipodal-Slice Strict Separation","note":"Let and . Define and put Define by Then Consequently, Interpretation. Five antipodal pairs of five-bit inputs force a nonsingular block in every quadratic sign representation. A cleared two-head score can have block rank at most four.","interpretation":"Five antipodal pairs of five-bit inputs force a nonsingular block in every quadratic sign representation. A cleared two-head score can have block rank at most four.","claim":"Let $x=(x_1,x_2,x_3,x_4)\\in\\lbrace-1,1\\rbrace^4$ and $y=(y_0,y_1,y_2,y_3,y_4)\\in\\lbrace-1,1\\rbrace^5$. Define\n\n$$ S(y):=\\sum_{j=0}^{4}y_j, \\qquad T(x):=1+\\sum_{i=1}^{4}x_i, \\qquad D(x,y):=y_0+\\sum_{i=1}^{4}x_i y_i, $$\n\nand put\n\n$$ Q(x,y):=S(y)T(x)-3D(x,y). $$\n\nDefine $f_9:\\lbrace-1,1\\rbrace^9\\to\\lbrace0,1\\rbrace$ by\n\n$$ f_9(x,y)=1 \\qquad\\Longleftrightarrow\\qquad Q(x,y)\\gt0. $$\n\nThen\n\n$$ \\deg_{\\pm}(f_9)=2 \\qquad\\text{and}\\qquad H^{\\ast}(f_9)\\geq3. $$\n\nConsequently,\n\n$$ \\deg_{\\pm}(f_9)\\lt H^{\\ast}(f_9). $$\n\n> **Interpretation.** Five antipodal pairs of five-bit inputs force a nonsingular $5\\times5$ block in every quadratic sign representation. A cleared two-head score can have block rank at most four.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/06_strict_separations/185_nine_bit_antipodal_slice_strict_separation.md","leanCertified":false,"topic":"separation","kind":"theorem","in":0,"out":0,"degree":0},{"id":"186","title":"Five-Bit Degree-Four Exactness","note":"Let . If then Certificate status. The proof is computer-assisted. The reduction, family-shattering witnesses, and every residual cleared score are verified with exact integer arithmetic. Floating-point searches were used only to discover candidate denominator tuples.","interpretation":"This result establishes five-bit degree-four exactness for the fixed-query, one-layer attention model.","claim":"Let $f:\\lbrace0,1\\rbrace^5\\to\\lbrace0,1\\rbrace$. If\n\n$$ \\deg_{\\pm}(f)=4, $$\n\nthen\n\n$$ H^{\\ast}(f)=4. $$\n\n> **Certificate status.** The proof is computer-assisted. The reduction, family-shattering witnesses, and every residual cleared score are verified with exact integer arithmetic. Floating-point searches were used only to discover candidate denominator tuples.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/06_strict_separations/186_five_bit_degree_four_exact.md","leanCertified":false,"topic":"separation","kind":"theorem","in":0,"out":0,"degree":0},{"id":"187","title":"Five-Bit Degree-Two Exactness","note":"Let . If then Certificate status. The reduction to fully locked complementary-cycle sign cells is analytic. The last case is computer-assisted: an exhaustive exact cocircuit enumeration and an exact tangent-tope cover reduce it to archived symmetry classes, each of which has an exact rational two-head certificate.","interpretation":"This result establishes five-bit degree-two exactness for the fixed-query, one-layer attention model.","claim":"Let $f:\\lbrace0,1\\rbrace^5\\to\\lbrace0,1\\rbrace$. If\n\n$$ \\deg_{\\pm}(f)=2, $$\n\nthen\n\n$$ H^{\\ast}(f)=2. $$\n\n> **Certificate status.** The reduction to fully locked complementary-cycle sign cells is analytic. The last case is computer-assisted: an exhaustive exact cocircuit enumeration and an exact tangent-tope cover reduce it to $380$ archived symmetry classes, each of which has an exact rational two-head certificate.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/06_strict_separations/187_five_bit_degree_two_exact.md","leanCertified":false,"topic":"separation","kind":"theorem","in":1,"out":0,"degree":1},{"id":"189","title":"Eight-Bit Hamming-Threshold Strict Separation","note":"For , define Thus is the Hamming distance between and . Let Then Consequently, Interpretation. The radius-one Hamming ball threshold on two four-bit strings is an explicit eight-bit strict separation. Its shell transitions force a column-max spectral inequality that is incompatible with an admissible factor of a cleared two-head score, while an exact integer certificate gives a matching three-head construction.","interpretation":"The radius-one Hamming ball threshold on two four-bit strings is an explicit eight-bit strict separation. Its shell transitions force a column-max spectral inequality that is incompatible with an admissible factor of a cleared two-head score, while an exact integer certificate gives a matching three","claim":"For $x,y\\in\\lbrace0,1\\rbrace^4$, define\n\n$$ \\Delta(x,y):=\\sum_{i=1}^4(x_i+y_i-2x_i y_i). $$\n\nThus $\\Delta(x,y)$ is the Hamming distance between $x$ and $y$. Let\n\n$$ f_8(x,y)=1 \\qquad\\Longleftrightarrow\\qquad \\Delta(x,y)\\geq2. $$\n\nThen\n\n$$ \\deg_{\\pm}(f_8)=2 \\qquad\\text{and}\\qquad H^{\\ast}(f_8)=3. $$\n\nConsequently,\n\n$$ \\deg_{\\pm}(f_8)\\lt H^{\\ast}(f_8). $$\n\n> **Interpretation.** The radius-one Hamming ball threshold on two four-bit strings is an explicit eight-bit strict separation. Its shell transitions force a column-max spectral inequality that is incompatible with an admissible factor of a cleared two-head score, while an exact integer certificate gives a matching three-head construction.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/06_strict_separations/189_eight_bit_hamming_threshold_strict_separation.md","leanCertified":false,"topic":"separation","kind":"theorem","in":0,"out":5,"degree":5},{"id":"190","title":"Cleared Head Scores Have Slice Rank At Most Two","note":"Let , and let a Boolean function be computed by an -head score in the linear-fractional normal form. Homogenize the affine forms with a variable . After clearing the positive denominators, the score has a homogeneous degree numerator There are real linear forms and real degree forms such that Moreover, can be chosen to equal one of the actual attention denominators. Consequently: 1. has real polynomial slice rank at most two. 2. The real hypersurface contains the real linear space of codimension at most two. The sa","interpretation":"This result establishes cleared head scores have slice rank at most two for the fixed-query, one-layer attention model.","claim":"Let $H\\geq2$, and let a Boolean function $f:\\lbrace0,1\\rbrace^n\\to\\lbrace0,1\\rbrace$ be computed by an $H$-head score in the linear-fractional normal form. Homogenize the affine forms with a variable $z_0$. After clearing the positive denominators, the score has a homogeneous degree $H$ numerator\n\n$$ P=c\\prod_{h=1}^{H}B_h+\\sum_{h=1}^{H}A_h\\prod_{g\\neq h}B_g. $$\n\nThere are real linear forms $L_1,L_2$ and real degree $H-1$ forms $Q_1,Q_2$ such that\n\n$$ P=L_1Q_1+L_2Q_2. $$\n\nMoreover, $L_2$ can be chosen to equal one of the actual attention denominators.\n\nConsequently:\n\n1. $P$ has real polynomial slice rank at most two.\n\n2. The real hypersurface $V(P)$ contains the real linear space $V(L_1,L_2)$ of codimension at most two. The same containment holds after base change to $\\mathbb C$.\n\n3. If no homogeneous degree $H$ form of real slice rank at most two strictly sign-represents $f$ on the homogenized Boolean cube, then $H^{\\ast}(f)\\gt H$.\n\n4. The lower relaxation can be strengthened by requiring the slice plane to contain an admissible oriented denominator.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/02_complexity_measure_upper_bounds/190_slice_rank_two_obstruction.md","leanCertified":false,"topic":"complexity","kind":"theorem","in":0,"out":1,"degree":1},{"id":"191","title":"Boolean-Cube Ceiling For The Slice Relaxation","note":"Let . Let be the vector space of real functions on represented by multilinear polynomials of degree at most , and put For a two-plane of affine forms, define the evaluated slice space Then the maximum, and hence the generic value, of is The maximum is attained by Consequently, if then . In this range, the real slice-rank-two sign relaxation is equivalent to threshold degree at most . The equivalence remains true after requiring the slice plane to contain one admissible positive denominator. If , the generic fixed-p","interpretation":"This result establishes boolean-cube ceiling for the slice relaxation for the fixed-query, one-layer attention model.","claim":"Let $2\\leq H\\leq n$. Let $\\mathcal B_{\\leq d}$ be the vector space of real functions on $\\lbrace0,1\\rbrace^n$ represented by multilinear polynomials of degree at most $d$, and put\n\n$$ D_d=\\dim\\mathcal B_{\\leq d}=\\sum_{j=0}^{d}\\binom{n}{j}. $$\n\nFor a two-plane $U=\\mathrm{span}(L_1,L_2)$ of affine forms, define the evaluated slice space\n\n$$ \\mathcal I_H(U)=L_1\\mathcal B_{\\leq H-1}+L_2\\mathcal B_{\\leq H-1}\\subseteq\\mathcal B_{\\leq H}. $$\n\nThen the maximum, and hence the generic value, of $\\dim\\mathcal I_H(U)$ is\n\n$$ r_H=\\min\\left\\lbrace D_H,2D_{H-1}-D_{H-2}\\right\\rbrace. $$\n\nThe maximum is attained by\n\n$$ U_0=\\mathrm{span}\\left(1,x_1+\\cdots+x_n\\right). $$\n\nConsequently, if\n\n$$ H\\geq\\left\\lceil\\frac{n+1}{2}\\right\\rceil, $$\n\nthen $\\mathcal I_H(U_0)=\\mathcal B_{\\leq H}$. In this range, the real slice-rank-two sign relaxation is equivalent to threshold degree at most $H$. The equivalence remains true after requiring the slice plane to contain one admissible positive denominator.\n\nIf $H\\leq\\lfloor n/2\\rfloor$, the generic fixed-plane codimension inside $\\mathcal B_{\\leq H}$ is\n\n$$ \\binom{n}{H}-\\binom{n}{H-1}. $$\n\nThe projective union over all two-planes has dimension at most $r_H-1+2(n-1)$. It is therefore a proper algebraic subset of $\\mathbb P(\\mathcal B_{\\leq H})$ whenever\n\n$$ \\binom{n}{H}-\\binom{n}{H-1}\\gt2(n-1). $$","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/02_complexity_measure_upper_bounds/191_boolean_cube_slice_relaxation_ceiling.md","leanCertified":false,"topic":"complexity","kind":"theorem","in":1,"out":0,"degree":1},{"id":"192","title":"Multiway Sign Tensor Rank Bound","note":"Let be nonconstant, and partition the coordinates into nonempty blocks Write for the resulting order sign tensor. Its real sign CP rank is the minimum CP rank of a real tensor having the same strict sign pattern. If , then For , this is the partition sign-rank bound The multiway extension does not improve the universal input-count screen. If and , then for every and every coordinate partition, Consequently, no lower-bound method based only on proving large multiway sign CP rank can rule out heads below input bits. ","interpretation":"Multiway tensor equations can still strengthen a particular instance by enforcing compatibility across several flattenings. Rank size alone is not the missing high-head obstruction. It cannot move the dimension frontier beyond the balanced matrix method.","claim":"Let $f : \\lbrace0,1\\rbrace^n \\to \\lbrace0,1\\rbrace$ be nonconstant, and partition the coordinates into $k\\geq2$ nonempty blocks\n\n$$ I_1\\sqcup\\cdots\\sqcup I_k=\\lbrace1,\\ldots,n\\rbrace. $$\n\nWrite $\\Sigma_f^{I_1,\\ldots,I_k}$ for the resulting order $k$ sign tensor. Its real sign CP rank is the minimum CP rank of a real tensor having the same strict sign pattern.\n\nIf $H^{\\ast}(f)\\leq H$, then\n\n$$ \\mathrm{srank}_{\\mathrm{CP}}\\left(\\Sigma_f^{I_1,\\ldots,I_k}\\right)\\leq R_k(H):=k\\left(k^H-(k-1)^H\\right). $$\n\nFor $k=2$, this is the partition sign-rank bound\n\n$$ R_2(H)=2^{H+1}-2. $$\n\nThe multiway extension does not improve the universal input-count screen. If $H\\geq2$ and $n\\leq2H+1$, then for every $k\\geq2$ and every coordinate partition,\n\n$$ \\mathrm{srank}_{\\mathrm{CP}}\\left(\\Sigma_f^{I_1,\\ldots,I_k}\\right)\\leq R_k(H). $$\n\nConsequently, no lower-bound method based only on proving large multiway sign CP rank can rule out $H$ heads below $2H+2$ input bits.\n\n> **Interpretation.** Multiway tensor equations can still strengthen a particular instance by enforcing compatibility across several flattenings. Rank size alone is not the missing high-head obstruction. It cannot move the dimension frontier beyond the balanced matrix method.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/02_complexity_measure_upper_bounds/192_multiway_sign_tensor_rank.md","leanCertified":false,"topic":"complexity","kind":"theorem","in":0,"out":0,"degree":0},{"id":"193","title":"Positive-Secant Diagonal Blow-Up","note":"Fix a nonconstant Boolean function , a head count , and one orientation for each head. Let For , define Put , , and . For , define the positive-secant pair gap A normalized feasible direction at is a block vector satisfying For such , the polynomial vanishes at . Define its exact polynomial quotient by Then the following are equivalent: 1. There exist such that for every and . 2. There exist , a normalized feasible direction , and such that and for every and . The same equivalence holds with all denominator paramet","interpretation":"The identically zero endpoint diagonal is replaced exactly by normalized tangent directions. Strict feasibility at the new boundary is not spurious. It always opens into a genuine positive secant.","claim":"Fix a nonconstant Boolean function $f:\\lbrace0,1\\rbrace^n\\to\\lbrace0,1\\rbrace$, a head count $H\\geq1$, and one orientation for each head. Let\n\n$$ L_0^{\\sigma}(x)=1,\\qquad L_i^{+}(x)=x_i,\\qquad L_i^{-}(x)=1-x_i. $$\n\nFor $\\theta_h\\in\\Delta_n$, define\n\n$$ B_h(x;\\theta_h)=\\sum_{i=0}^{n}\\theta_{hi}L_i^{\\sigma_h}(x),\\qquad Q_\\theta(x)=\\prod_{h=1}^{H}B_h(x;\\theta_h). $$\n\nPut $\\Theta=(\\Delta_n)^H$, $P=f^{-1}(1)$, and $N=f^{-1}(0)$. For $\\theta^{(0)},\\theta^{(1)}\\in\\Theta$, define the positive-secant pair gap\n\n$$ G_{p,q}\\left(\\theta^{(0)},\\theta^{(1)}\\right)=Q_{\\theta^{(0)}}(q)Q_{\\theta^{(1)}}(p)-Q_{\\theta^{(0)}}(p)Q_{\\theta^{(1)}}(q),\\qquad p\\in P,\\quad q\\in N. $$\n\nA normalized feasible direction at $\\theta\\in\\Theta$ is a block vector $v=(v_{hi})$ satisfying\n\n$$ \\sum_{i=0}^{n}v_{hi}=0,\\qquad \\theta_{hi}=0\\Longrightarrow v_{hi}\\geq0,\\qquad \\lVert v\\rVert_{\\infty}=1. $$\n\nFor such $\\theta,v$, the polynomial\n\n$$ G_{p,q}\\left(\\theta,\\theta+tv\\right) $$\n\nvanishes at $t=0$. Define its exact polynomial quotient by\n\n$$ G_{p,q}\\left(\\theta,\\theta+tv\\right)=t\\widetilde G_{p,q}(\\theta,v,t). $$\n\nThen the following are equivalent:\n\n1. There exist $\\theta^{(0)},\\theta^{(1)}\\in\\Theta$ such that $G_{p,q}(\\theta^{(0)},\\theta^{(1)})\\gt0$ for every $p\\in P$ and $q\\in N$.\n\n2. There exist $\\theta\\in\\Theta$, a normalized feasible direction $v$, and $t\\geq0$ such that $\\theta+tv\\in\\Theta$ and $\\widetilde G_{p,q}(\\theta,v,t)\\gt0$ for every $p\\in P$ and $q\\in N$.\n\nThe same equivalence holds with all denominator parameters in the interiors of their simplices. The normalization $\\lVert v\\rVert_{\\infty}=1$ is the finite union of the $2H(n+1)$ charts\n\n$$ v_{hi}=1\\quad\\text{or}\\quad v_{hi}=-1,\\qquad -1\\leq v_{gj}\\leq1. $$\n\nMoreover, $\\widetilde G_{p,q}$ has degree at most $H-1$ in the scalar $t$.\n\n> **Interpretation.** The identically zero endpoint diagonal is replaced exactly by normalized tangent directions. Strict feasibility at the new $t=0$ boundary is not spurious. It always opens into a genuine positive secant.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/02_complexity_measure_upper_bounds/193_positive_secant_diagonal_blowup.md","leanCertified":false,"topic":"complexity","kind":"theorem","in":0,"out":0,"degree":0},{"id":"194","title":"Signed-Secant Diagonal Blow-Up","note":"Fix a nonconstant Boolean function , a head count , and one orientation for each head. Let . Using the oriented literals from Theorem 193, put For two endpoints and a mixture scalar, define the signed secant score A normalized signed direction is a pair satisfying For with , set The polynomial vanishes at . Define its exact quotient by Then the following are equivalent: 1. There exist and such that for every cube vertex . 2. There exist , a normalized signed direction , and such that and for every cube vertex . The","interpretation":"This result establishes signed-secant diagonal blow-up for the fixed-query, one-layer attention model.","claim":"Fix a nonconstant Boolean function $f : \\lbrace0,1\\rbrace^n \\to \\lbrace0,1\\rbrace$, a head count $H\\geq1$, and one orientation for each head. Let $y_x=2f(x)-1$. Using the oriented literals from Theorem 193, put\n\n$$ B_h(x;\\theta_h)=\\sum_{i=0}^{n}\\theta_{hi}L_i^{\\sigma_h}(x),\\qquad Q_\\theta(x)=\\prod_{h=1}^{H}B_h(x;\\theta_h),\\qquad \\Theta=(\\Delta_n)^H. $$\n\nFor two endpoints and a mixture scalar, define the signed secant score\n\n$$ S_x\\left(\\theta^{(0)},\\theta^{(1)},s\\right)=sQ_{\\theta^{(1)}}(x)-(1-s)Q_{\\theta^{(0)}}(x),\\qquad 0\\leq s\\leq1. $$\n\nA normalized signed direction is a pair $(v,a)$ satisfying\n\n$$ \\sum_{i=0}^{n}v_{hi}=0,\\qquad \\max\\lbrace\\lVert v\\rVert_{\\infty},\\lvert a\\rvert\\rbrace=1. $$\n\nFor $0\\leq t\\leq1$ with $\\theta+tv\\in\\Theta$, set\n\n$$ s(t)=\\frac{1+ta}{2},\\qquad \\mathcal S_x(\\theta,v,a,t)=s(t)Q_{\\theta+tv}(x)-(1-s(t))Q_\\theta(x). $$\n\nThe polynomial $\\mathcal S_x(\\theta,v,a,t)$ vanishes at $t=0$. Define its exact quotient by\n\n$$ \\mathcal S_x(\\theta,v,a,t)=t\\widetilde{\\mathcal S}_x(\\theta,v,a,t). $$\n\nThen the following are equivalent:\n\n1. There exist $\\theta^{(0)},\\theta^{(1)}\\in\\Theta$ and $s\\in[0,1]$ such that $y_xS_x(\\theta^{(0)},\\theta^{(1)},s)\\gt0$ for every cube vertex $x$.\n\n2. There exist $\\theta\\in\\Theta$, a normalized signed direction $(v,a)$, and $t\\in[0,1]$ such that $\\theta+tv\\in\\Theta$ and $y_x\\widetilde{\\mathcal S}_x(\\theta,v,a,t)\\gt0$ for every cube vertex $x$.\n\nThe same equivalence holds with the two endpoint denominator tuples in the interiors of their simplices. The normalization is the finite union of the $2H(n+1)+2$ charts\n\n$$ v_{hi}=1,\\qquad v_{hi}=-1,\\qquad a=1,\\qquad a=-1, $$\n\nwith all remaining direction coordinates in $[-1,1]$. The quotient has degree at most $H$ in $t$, standard total degree at most $2H+1$, and degree at most one in each joint head block $(\\theta_h,v_h)$.\n\n> **Computational consequence.** The exact pair-gap blow-up in Theorem 193 uses $\\lvert f^{-1}(1)\\rvert\\lvert f^{-1}(0)\\rvert$ strict inequalities, cross-vertex product nodes, and quotient polynomials of total degree at most $3H-1$. The signed blow-up uses only $2^n$ strict inequalities, no cross-vertex products, and one additional bounded scalar direction. Its chart domains are closed and compact, with no face implications or tangent-cone case split.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/02_complexity_measure_upper_bounds/194_signed_secant_diagonal_blowup.md","leanCertified":false,"topic":"complexity","kind":"theorem","in":0,"out":0,"degree":0},{"id":"195","title":"Output-Normalized Atomic-Margin Sparsification","note":"Let and put . Let be the symmetric set of all valid one-head score vectors on the cube, normalized by Suppose there exist , , , and such that Then there is an absolute constant such that Define the output-normalized atomic condition number For every nonconstant , Interpretation. A well-conditioned convex combination of genuine one-head score vectors can be sparsified into a short exact head representation. The normalization is in function-output space, not in a parameter norm.","interpretation":"A well-conditioned convex combination of genuine one-head score vectors can be sparsified into a short exact head representation. The normalization is in function-output space, not in a parameter norm.","claim":"Let $f : \\lbrace0,1\\rbrace^n \\to \\lbrace0,1\\rbrace$ and put $y_x=2f(x)-1$. Let $\\mathcal A_n\\subseteq\\mathbb R^{2^n}$ be the symmetric set of all valid one-head score vectors on the cube, normalized by\n\n$$ \\lVert a\\rVert_{\\infty}\\leq1. $$\n\nSuppose there exist $c\\in\\mathbb R$, $\\Lambda\\gt0$, $\\gamma\\gt0$, and $u\\in\\mathrm{conv}(\\mathcal A_n)$ such that\n\n$$ y_x(c+\\Lambda u_x)\\geq\\gamma\\qquad\\text{for every }x\\in\\lbrace0,1\\rbrace^n. $$\n\nThen there is an absolute constant $C$ such that\n\n$$ H^{\\ast}(f)\\leq C(n+1)\\left(\\frac{\\Lambda}{\\gamma}\\right)^2. $$\n\nDefine the output-normalized atomic condition number\n\n$$ \\kappa_{\\mathrm{atom}}(f)=\\inf\\left\\lbrace\\frac{\\Lambda}{\\gamma}:y_x(c+\\Lambda u_x)\\geq\\gamma,\\quad u\\in\\mathrm{conv}(\\mathcal A_n),\\quad \\Lambda\\gt0,\\quad \\gamma\\gt0\\right\\rbrace. $$\n\nFor every nonconstant $f$,\n\n$$ H^{\\ast}(f)\\leq C(n+1)\\kappa_{\\mathrm{atom}}(f)^2. $$\n\n> **Interpretation.** A well-conditioned convex combination of genuine one-head score vectors can be sparsified into a short exact head representation. The normalization is in function-output space, not in a parameter norm.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/02_complexity_measure_upper_bounds/195_atomic_margin_sparsification.md","leanCertified":false,"topic":"complexity","kind":"theorem","in":0,"out":0,"degree":0},{"id":"196","title":"Optimal Fourier-Tail Knapsack","note":"Let , put , let , and use the unnormalized Walsh coefficients Always retain the constant coefficient . Bundle all nonzero singleton coefficients into one item of value and cost one. For every with and , create one item of value and cost . If a set of these items leaves omitted value strictly below , then Moreover, the minimum right side obtainable from this Fourier-tail criterion can be computed exactly in integer-arithmetic operations. Computing the Walsh coefficients first costs operations. A one-dimensional dyna","interpretation":"This result establishes optimal fourier-tail knapsack for the fixed-query, one-layer attention model.","claim":"Let $f : \\lbrace0,1\\rbrace^n \\to \\lbrace0,1\\rbrace$, put $q(x)=2f(x)-1$, let $V=2^n$, and use the unnormalized Walsh coefficients\n\n$$ c_S=\\sum_{x\\in\\lbrace0,1\\rbrace^n}q(x)\\chi_S(x),\\qquad q(x)=\\frac1V\\sum_S c_S\\chi_S(x). $$\n\nAlways retain the constant coefficient $c_{\\varnothing}$. Bundle all nonzero singleton coefficients into one item of value\n\n$$ m_1=\\sum_{\\lvert S\\rvert=1}\\lvert c_S\\rvert $$\n\nand cost one. For every $S$ with $\\lvert S\\rvert\\geq2$ and $c_S\\neq0$, create one item of value $\\lvert c_S\\rvert$ and cost $\\lvert S\\rvert$.\n\nIf a set $I$ of these items leaves omitted value strictly below $V$, then\n\n$$ H^{\\ast}(f)\\leq\\sum_{j\\in I}\\mathrm{cost}(j). $$\n\nMoreover, the minimum right side obtainable from this Fourier-tail criterion can be computed exactly in\n\n$$ O(nV^2) $$\n\ninteger-arithmetic operations. Computing the Walsh coefficients first costs $O(nV)$ operations. A one-dimensional dynamic program uses $O(nV)$ value storage, and a standard reconstruction pass recovers an optimal retained support.\n\n> **Scope.** This optimizes the sufficient Fourier-tail certificate from Theorem 45. It does not compute the minimum Fourier support of an arbitrary sign polynomial, and it does not compute $H^{\\ast}(f)$.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/02_complexity_measure_upper_bounds/196_optimal_fourier_tail_knapsack.md","leanCertified":false,"topic":"complexity","kind":"theorem","in":0,"out":0,"degree":0},{"id":"197","title":"Greedy Affine Bounds on a Box With One Sum Constraint","note":"Let , let and be rational numbers, and suppose Define the rational polytope Put and . Choose a permutation such that Starting with , define Then minimizes over . Reversing the coefficient order gives a maximizer . Consequently, the exact range of over is computable using rational arithmetic in comparisons and arithmetic operations after sorting. Computational meaning. Exact affine intervals over a subdivided simplex or zero-sum direction box do not require a linear-program call. They are fractional-knapsack bounds ","interpretation":"This result establishes greedy affine bounds on a box with one sum constraint for the fixed-query, one-layer attention model.","claim":"Let $m\\geq1$, let $\\ell_i\\leq u_i$ and $c_i$ be rational numbers, and suppose\n\n$$ \\sum_{i=1}^{m}\\ell_i\\leq T\\leq\\sum_{i=1}^{m}u_i. $$\n\nDefine the rational polytope\n\n$$ K=\\left\\lbrace x\\in\\mathbb R^m:\\ell_i\\leq x_i\\leq u_i,\\quad \\sum_{i=1}^{m}x_i=T\\right\\rbrace. $$\n\nPut $w_i=u_i-\\ell_i$ and $R=T-\\sum_i\\ell_i$. Choose a permutation $\\pi$ such that\n\n$$ c_{\\pi(1)}\\leq c_{\\pi(2)}\\leq\\cdots\\leq c_{\\pi(m)}. $$\n\nStarting with $r_0=R$, define\n\n$$ \\delta_{\\pi(k)}=\\min\\lbrace w_{\\pi(k)},r_{k-1}\\rbrace,\\qquad r_k=r_{k-1}-\\delta_{\\pi(k)}. $$\n\nThen $x_i^{-}=\\ell_i+\\delta_i$ minimizes $c^{\\top}x$ over $K$. Reversing the coefficient order gives a maximizer $x^+$. Consequently, the exact range of $c^{\\top}x$ over $K$ is computable using rational arithmetic in $O(m\\log m)$ comparisons and $O(m)$ arithmetic operations after sorting.\n\n> **Computational meaning.** Exact affine intervals over a subdivided simplex or zero-sum direction box do not require a linear-program call. They are fractional-knapsack bounds with a short exact checker.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/02_complexity_measure_upper_bounds/197_box_sum_greedy_affine_bounds.md","leanCertified":false,"topic":"complexity","kind":"theorem","in":0,"out":0,"degree":0},{"id":"F1","title":"Scalable gap beyond degree","note":"Find a natural family where H* exceeds threshold degree by a growing amount.","topic":"frontier","kind":"program","in":2,"out":0,"degree":2},{"id":"F2","title":"Correct invariant for H*","note":"Identify the structural invariant beyond degree that controls head complexity.","topic":"frontier","kind":"program","in":3,"out":0,"degree":3},{"id":"F3","title":"Universal determinant bound","note":"Extend the compact determinant construction to all n.","topic":"frontier","kind":"conjecture","in":2,"out":0,"degree":2},{"id":"F4","title":"Exact natural-family profiles","note":"Determine exact H* for standard symmetric and Hamming families.","topic":"frontier","kind":"program","in":2,"out":0,"degree":2},{"id":"F5","title":"Depth versus heads","note":"Extend the one-layer theory to stacked attention.","topic":"frontier","kind":"program","in":2,"out":0,"degree":2},{"id":"F6","title":"Determine exact H*(f10)","note":"Close the current gap for the explicit ten-bit separation function: the repository proves only that H*(f10) is at least 3.","topic":"frontier","kind":"conjecture","in":3,"out":0,"degree":3},{"id":"F7","title":"Determinant certificate at n=13","note":"Test whether the compact determinant-span construction continues at the first dimension beyond the verified n=3,…,12 range.","topic":"frontier","kind":"conjecture","in":3,"out":0,"degree":3},{"id":"F8","title":"Exact H*(EXACT n,k)","note":"Find ma function renderTheorem(id,push=true){if(push)history.push(state);state={view:'theorem',id};back.disabled=false;clear();const n=byId[id],deps=inc.get(id)||[],users=out.get(id)||[],left=relatedColumn(deps,45,'Direct prerequisites',colors.complexity),right=relatedColumn(users,865,'Direct downstream uses',colors.families),cx=410,cy=245,cw=380,ch=120,g=el('g'),r=el('rect',{x:cx,y:cy,width:cw,height:ch,rx:n.kind==='conjecture'?60:'18',fill:n.kind==='dead'?'var(--destructive)':colors[n.topic],'fill-opacity':'.18',stroke:n.kind==='dead'?'var(--destructive)':colors[n.topic],'stroke-width':'3'}),num=el('text',{x:600,y:cy+36,'text-anchor':'middle',fill:'var(--muted-foreground)',style:'font-size:14px'},n.id),title=el('text',{x:600,y:cy+72,'text-anchor':'middle',fill:'var(--foreground)',style:'font-size:17px;font-weight:500'},trunc(n.title,48)),central={x:cx,y:cy,w:cw,h:ch};g.append(r,num,title);content.appendChild(g);for(const dep of deps.slice(0,9))edge(left[dep],central,'proof');for(const user of users.slice(0,9))edge(central,right[user],data.edges.find(e=>e.from===id&&e.to===user)?.kind||'proof');content.appendChild(el('text',{x:'600',y:'420','text-anchor':'middle',fill:'var(--muted-foreground)',style:'font-size:14px'},data.topicMeta[n.topic]?.title||'Refuted hypothesis'));const interp=el('foreignObject',{x:'405',y:'445',width:'390',height:'115'});interp.innerHTML='<div xmlns="http://www.w3.org/1999/xhtml" style="color:var(--foreground);font-size:15px;line-height:1.45;text-align:center;padding:8px;">'+escapeHtml(trunc(n.interpretation||n.note,230))+'</div>';content.appendChild(interp);if(n.leanCertified)content.appendChild(el('text',{x:'600',y:cy+103,'text-anchor':'middle',fill:'var(--green)',style:'font-size:14px;font-weight:700'},'✓ Lean certified'));else if(n.kind==='dead')content.appendChild(el('text',{x:'600',y:cy+103,'text-anchor':'middle',fill:'var(--destructive)',style:'font-size:14px;font-weight:700'},'Refuted'));actions.style.display='flex';proofLink.href=n.proofUr function renderSearch(q){state={view:'search',q};back.disabled=false;clear();const hits=data.nodes.filter(n=>(n.id+' '+n.title+' '+n.note).toLowerCase().includes(q.toLowerCase())).slice(0,24);content.appendChild(el('text',{x:'600',y:'50','text-anchor':'middle',fill:'var(--foreground)',style:'font-size:21px;font-weight:500'},hits.length+' search results'));hits.forEach((n,i)=>card(n,55+(i%4)*290,100+Math.floor(i/4)*105,260,54));detail.textContent=hits.length?'Click a result to open its focused theorem view.':'No matching theorem.';}

const base={x:0,y:0,w:1200,h:850},cam={...base};function setCam(){svg.setAttribute('viewBox',cam.x+' '+cam.y+' '+cam.w+' '+cam.h);}function zoom(k){const nw=Math.max(520,Math.min(2400,cam.w*k)),nh=nw*base.h/base.w,cx=cam.x+cam.w/2,cy=cam.y+cam.h/2;cam.x=cx-nw/2;cam.y=cy-nh/2;cam.w=nw;cam.h=nh;setCam();}root.querySelectorAll('button[data-zoom]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.zoom==='in')zoom(.78);else if(b.dataset.zoom==='out')zoom(1.25);else{Object.assign(cam,base);setCam();}}));svg.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(e.deltaY*0.006));},{passive:false});let drag=null;svg.addEventListener('pointerdown',e=>{if(e.target.closest('g[data-kind]'))return;drag={x:e.clientX,y:e.clientY,vx:cam.x,vy:cam.y};svg.setPointerCapture(e.pointerId);svg.style.cursor='grabbing';});svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();cam.x=drag.vx-(e.clientX-drag.x)*cam.w/r.width;cam.y=drag.vy-(e.clientY-drag.y)*cam.h/r.height;setCam();});svg.addEventListener('pointerup',()=>{drag=null;svg.style.cursor='grab';});renderTopics(false);})();</script>
