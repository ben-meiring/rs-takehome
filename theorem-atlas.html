b(y):=f(b,y) \\qquad (b\\in\\lbrace0,1\\rbrace). $$\n\nSuppose $f_b$ has a strict affine-cylinder score\n\n$$ S_b(y) = A_b(y) + \\sum_{\\gamma\\in\\Gamma_b}c_{b,\\gamma}C_{\\gamma}(y), $$\n\nmeaning\n\n$$ f_b(y)=1 \\qquad\\Longleftrightarrow\\qquad S_b(y)\\gt0, $$\n\nwhere\n\n$$ A_b(y)=a_b+\\sum_{i=1}^{m}\\alpha_{b,i}y_i, $$\n\neach $\\gamma=(P,N)$ is a nonvacuous cylinder support on the $y$ variables, the supports in $\\Gamma_b$ are distinct, and all coefficients $c_{b,\\gamma}$ are nonzero. For $\\gamma\\notin\\Gamma_b$, set $c_{b,\\gamma}:=0$.\n\nLet\n\n$$ \\eta(A_0,A_1) := \\mathbf{1} \\left[ a_1\\neq a_0 \\text{ or } \\exists i,\\ \\alpha_{0,i}\\neq0 \\right], $$\n\nlet\n\n$$ \\Delta_{\\mathrm{lin}} := \\lbrace i:\\alpha_{1,i}\\neq\\alpha_{0,i}\\rbrace, $$\n\nand let\n\n$$ \\Delta_{\\mathrm{cyl}} := \\lbrace\\gamma\\in\\Gamma_0\\cup\\Gamma_1:c_{1,\\gamma}\\neq c_{0,\\gamma}\\rbrace. $$\n\nThen\n\n$$ \\mathrm{actc}(f) \\leq \\eta(A_0,A_1) + \\lvert\\Delta_{\\mathrm{lin}}\\rvert + \\sum_{\\gamma=(P,N)\\in\\Gamma_0}\\kappa(P,N) + \\sum_{\\gamma=(P,N)\\in\\Delta_{\\mathrm{cyl}}}\\kappa(P\\cup\\lbrace z\\rbrace,N), $$\n\nwhere $z$ denotes the split coordinate.\n\n> **Interpretation.** A split interpolation pays for one base affine block, changed affine slopes as $zy_i$ cylinders, the base cylinder vote on the $z=0$ cofactor, and only those cylinder coefficients that actually change across the split.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/111_affine_cylinder_cofactor_interpolation.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":0,"out":3,"degree":3},{"id":"112","title":"Split Affine-Cylinder Cost","note":"Let with . Fix a split coordinate and write the inputs as For , let Given strict affine-cylinder scores for the two cofactors, written as in , define their split interpolation cost by Let be the minimum of over all choices of strict affine-cylinder scores for and along the split coordinate , and define Then If then Interpretation. The split affine-cylinder cost is an optimized recursive certificate. It is not a new lower bound on ; it is a structured way to produce affine-cylinder certificates by interpolating two ","interpretation":"The split affine-cylinder cost is an optimized recursive certificate. It is not a new lower bound on ; it is a structured way to produce affine-cylinder certificates by interpolating two cofactors.","claim":"Let\n\n$$ f:\\lbrace0,1\\rbrace^{n}\\to\\lbrace0,1\\rbrace $$\n\nwith $n\\geq1$. Fix a split coordinate $j$ and write the inputs as\n\n$$ (z,y)\\in\\lbrace0,1\\rbrace\\times\\lbrace0,1\\rbrace^{n-1}. $$\n\nFor $b\\in\\lbrace0,1\\rbrace$, let\n\n$$ f_b(y):=f(b,y). $$\n\nGiven strict affine-cylinder scores $S_0,S_1$ for the two cofactors, written as in [111_affine_cylinder_cofactor_interpolation.md](111_affine_cylinder_cofactor_interpolation.md), define their split interpolation cost by\n\n$$ \\begin{aligned} I(S_0,S_1) :={}& \\eta(A_0,A_1) + \\lvert\\Delta_{\\mathrm{lin}}\\rvert \\cr &+ \\sum_{\\gamma=(P,N)\\in\\Gamma_0}\\kappa(P,N) + \\sum_{\\gamma=(P,N)\\in\\Delta_{\\mathrm{cyl}}}\\kappa(P\\cup\\lbrace z\\rbrace,N). \\end{aligned} $$\n\nLet\n\n$$ \\mathrm{sactc}_{j}(f) $$\n\nbe the minimum of $I(S_0,S_1)$ over all choices of strict affine-cylinder scores for $f_0$ and $f_1$ along the split coordinate $j$, and define\n\n$$ \\mathrm{sactc}(f) := \\min_{1\\leq j\\leq n}\\mathrm{sactc}_{j}(f). $$\n\nThen\n\n$$ H^{\\ast}(f) \\leq \\mathrm{actc}(f) \\leq \\mathrm{sactc}(f). $$\n\nIf\n\n$$ \\mathrm{sactc}(f)\\leq2, $$\n\nthen\n\n$$ H^{\\ast}(f) = \\begin{cases} 0, & \\text{if } f \\text{ is constant},\\cr 1, & \\text{if } f \\text{ is a nonconstant LTF},\\cr 2, & \\text{otherwise}. \\end{cases} $$\n\n> **Interpretation.** The split affine-cylinder cost is an optimized recursive certificate. It is not a new lower bound on $\\mathrm{actc}$; it is a structured way to produce affine-cylinder certificates by interpolating two cofactors.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/112_split_affine_cylinder_cost.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":3,"out":5,"degree":8},{"id":"113","title":"Shared-Cylinder Split Exactness","note":"Let and write its two cofactors as Suppose both cofactors have strict affine-cylinder scores with the same cylinder correction: where uses distinct nonvacuous cylinder supports. Define and Then where In particular, if then Interpretation. When two cofactors share the same signed cylinder correction, the split only pays for that shared correction and the affine changes between the slices.","interpretation":"When two cofactors share the same signed cylinder correction, the split only pays for that shared correction and the affine changes between the slices.","claim":"Let\n\n$$ f:\\lbrace0,1\\rbrace\\times\\lbrace0,1\\rbrace^{m}\\to\\lbrace0,1\\rbrace, $$\n\nand write its two cofactors as\n\n$$ f_b(y):=f(b,y) \\qquad (b\\in\\lbrace0,1\\rbrace). $$\n\nSuppose both cofactors have strict affine-cylinder scores with the same cylinder correction:\n\n$$ S_b(y)=A_b(y)+V(y), \\qquad A_b(y)=a_b+\\sum_{i=1}^{m}\\alpha_{b,i}y_i, $$\n\nwhere\n\n$$ V(y)=\\sum_{\\gamma\\in\\Gamma}c_{\\gamma}C_{\\gamma}(y) $$\n\nuses distinct nonvacuous cylinder supports. Define\n\n$$ K(V):=\\sum_{\\gamma=(P,N)\\in\\Gamma}\\kappa(P,N), $$\n\nand\n\n$$ D(A_0,A_1):=\\lbrace i:\\alpha_{1,i}\\neq\\alpha_{0,i}\\rbrace. $$\n\nThen\n\n$$ H^{\\ast}(f) \\leq \\mathrm{actc}(f) \\leq \\mathrm{sactc}(f) \\leq \\eta(A_0,A_1) + \\lvert D(A_0,A_1)\\rvert + K(V), $$\n\nwhere\n\n$$ \\eta(A_0,A_1) := \\mathbf{1} \\left[ a_1\\neq a_0 \\text{ or } \\exists i,\\ \\alpha_{0,i}\\neq0 \\right]. $$\n\nIn particular, if\n\n$$ \\eta(A_0,A_1) + \\lvert D(A_0,A_1)\\rvert + K(V) \\leq2, $$\n\nthen\n\n$$ H^{\\ast}(f) = \\begin{cases} 0, & \\text{if } f \\text{ is constant},\\cr 1, & \\text{if } f \\text{ is a nonconstant LTF},\\cr 2, & \\text{otherwise}. \\end{cases} $$\n\n> **Interpretation.** When two cofactors share the same signed cylinder correction, the split only pays for that shared correction and the affine changes between the slices.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/113_shared_cylinder_split_exactness.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":0,"degree":2},{"id":"114","title":"Split Affine-Cylinder Refines Split Affine-Free Support","note":"For every Boolean function with , where is the split affine-free support invariant from . Consequently, every split affine-free support certificate is also a split affine-cylinder certificate of no larger cost. Interpretation. The affine-cylinder split invariant is a genuine refinement of the earlier split sparse-PTF recursion. It keeps all positive monomial certificates, and it can also exploit mixed-literal cylinders with cheap local expansion.","interpretation":"The affine-cylinder split invariant is a genuine refinement of the earlier split sparse-PTF recursion. It keeps all positive monomial certificates, and it can also exploit mixed-literal cylinders with cheap local expansion.","claim":"For every Boolean function\n\n$$ f:\\lbrace0,1\\rbrace^{n}\\to\\lbrace0,1\\rbrace $$\n\nwith $n\\geq1$,\n\n$$ H^{\\ast}(f) \\leq \\mathrm{actc}(f) \\leq \\mathrm{sactc}(f) \\leq \\mathrm{scafs}_{\\pm}(f), $$\n\nwhere $\\mathrm{scafs}_{\\pm}$ is the split affine-free support invariant from [078_split_affine_free_support_invariant.md](078_split_affine_free_support_invariant.md).\n\nConsequently, every split affine-free support certificate is also a split affine-cylinder certificate of no larger cost.\n\n> **Interpretation.** The affine-cylinder split invariant is a genuine refinement of the earlier split sparse-PTF recursion. It keeps all positive monomial certificates, and it can also exploit mixed-literal cylinders with cheap local expansion.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/114_split_affine_cylinder_refines_split_affine_free.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":0,"degree":2},{"id":"115","title":"Affine-Cylinder First Levels Are Exact","note":"For every Boolean function , and Equivalently, Interpretation. The affine-cylinder cost has the same first two levels as head complexity. Its first possible slack over can only begin at level .","interpretation":"The affine-cylinder cost has the same first two levels as head complexity. Its first possible slack over can only begin at level .","claim":"For every Boolean function $f$,\n\n$$ \\mathrm{actc}(f)=0 \\qquad\\Longleftrightarrow\\qquad f \\text{ is constant}, $$\n\nand\n\n$$ \\mathrm{actc}(f)=1 \\qquad\\Longleftrightarrow\\qquad f \\text{ is a nonconstant LTF}. $$\n\nEquivalently,\n\n$$ \\mathrm{actc}(f)\\geq2 \\qquad\\Longleftrightarrow\\qquad f \\text{ is neither constant nor a nonconstant LTF}. $$\n\n> **Interpretation.** The affine-cylinder cost has the same first two levels as head complexity. Its first possible slack over $H^{\\ast}$ can only begin at level $2$.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/115_affine_cylinder_first_levels_exact.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":3,"out":1,"degree":4},{"id":"116","title":"Split Affine-Cylinder First Levels Are Exact","note":"Let with . Then and Equivalently, Interpretation. Optimizing over cofactor interpolations does not distort the constant and one-head layers.","interpretation":"Optimizing over cofactor interpolations does not distort the constant and one-head layers.","claim":"Let\n\n$$ f:\\lbrace0,1\\rbrace^{n}\\to\\lbrace0,1\\rbrace $$\n\nwith $n\\geq1$. Then\n\n$$ \\mathrm{sactc}(f)=0 \\qquad\\Longleftrightarrow\\qquad f \\text{ is constant}, $$\n\nand\n\n$$ \\mathrm{sactc}(f)=1 \\qquad\\Longleftrightarrow\\qquad f \\text{ is a nonconstant LTF}. $$\n\nEquivalently,\n\n$$ \\mathrm{sactc}(f)\\geq2 \\qquad\\Longleftrightarrow\\qquad f \\text{ is neither constant nor a nonconstant LTF}. $$\n\n> **Interpretation.** Optimizing over cofactor interpolations does not distort the constant and one-head layers.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/116_split_affine_cylinder_first_levels_exact.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":0,"degree":2},{"id":"117","title":"Pure-Cylinder Affine Perturbations Are Exact","note":"Let Suppose there are disjoint sets with either or , an affine form and a real coefficient such that strictly on the cube. Then Consequently, Interpretation. A single pure positive or pure negative cylinder can be added to an arbitrary affine score at two-head cost. This includes negative-literal conjunctions without expanding them into many positive monomials.","interpretation":"A single pure positive or pure negative cylinder can be added to an arbitrary affine score at two-head cost. This includes negative-literal conjunctions without expanding them into many positive monomials.","claim":"Let\n\n$$ f:\\lbrace0,1\\rbrace^{n}\\to\\lbrace0,1\\rbrace. $$\n\nSuppose there are disjoint sets $P,N\\subseteq\\lbrace1,\\ldots,n\\rbrace$ with either $P=\\varnothing$ or $N=\\varnothing$, an affine form\n\n$$ A(x)=a_0+\\sum_{i=1}^{n}a_i x_i, $$\n\nand a real coefficient $c$ such that\n\n$$ f(x)=1 \\qquad\\Longleftrightarrow\\qquad A(x)+cC_{P,N}(x)\\gt0 $$\n\nstrictly on the cube. Then\n\n$$ \\mathrm{actc}(f)\\leq2. $$\n\nConsequently,\n\n$$ H^{\\ast}(f) = \\begin{cases} 0, & \\text{if } f \\text{ is constant},\\cr 1, & \\text{if } f \\text{ is a nonconstant LTF},\\cr 2, & \\text{otherwise}. \\end{cases} $$\n\n> **Interpretation.** A single pure positive or pure negative cylinder can be added to an arbitrary affine score at two-head cost. This includes negative-literal conjunctions without expanding them into many positive monomials.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/117_pure_cylinder_affine_perturbation_exact.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":0,"degree":2},{"id":"118","title":"One-Bit Affine-Cylinder Branching","note":"Let have a strict affine-cylinder score where the cylinder supports in are distinct and nonvacuous. Let be any two-input Boolean gate, and define For , define as follows: - if as a function of , - if as a function of , - if is constant as a function of . When , define if is the constant function and if it is the constant function. When , define . Let and Finally define Then If the right-hand side is at most , then Interpretation. One-bit branching over an affine-cylinder feature pays for the base cylinder correctio","interpretation":"One-bit branching over an affine-cylinder feature pays for the base cylinder correction only if the slice uses the feature, and pays changed affine slopes and changed cylinder coefficients only if the two slices use different signed copies of the feature.","claim":"Let\n\n$$ T:\\lbrace0,1\\rbrace^{m}\\to\\lbrace0,1\\rbrace $$\n\nhave a strict affine-cylinder score\n\n$$ S(y)=A(y)+\\sum_{\\gamma\\in\\Gamma}c_{\\gamma}C_{\\gamma}(y), \\qquad A(y)=a+\\sum_{i=1}^{m}\\alpha_i y_i, $$\n\nwhere the cylinder supports in $\\Gamma$ are distinct and nonvacuous. Let\n\n$$ G:\\lbrace0,1\\rbrace^{2}\\to\\lbrace0,1\\rbrace $$\n\nbe any two-input Boolean gate, and define\n\n$$ F(z,y):=G(z,T(y)). $$\n\nFor $b\\in\\lbrace0,1\\rbrace$, define $\\mu_b\\in\\lbrace-1,0,1\\rbrace$ as follows:\n\n- $\\mu_b=1$ if $G(b,u)=u$ as a function of $u$,\n- $\\mu_b=-1$ if $G(b,u)=1-u$ as a function of $u$,\n- $\\mu_b=0$ if $G(b,u)$ is constant as a function of $u$.\n\nWhen $\\mu_b=0$, define $\\delta_b=1$ if $G(b,u)$ is the constant $1$ function and $\\delta_b=-1$ if it is the constant $0$ function. When $\\mu_b\\neq0$, define $\\delta_b=0$.\n\nLet\n\n$$ L(A):=\\lbrace i:\\alpha_i\\neq0\\rbrace, $$\n\nand\n\n$$ K(\\Gamma):=\\sum_{\\gamma=(P,N)\\in\\Gamma}\\kappa(P,N), \\qquad K_z(\\Gamma):=\\sum_{\\gamma=(P,N)\\in\\Gamma}\\kappa(P\\cup\\lbrace z\\rbrace,N). $$\n\nFinally define\n\n$$ \\eta_G(A) := \\mathbf{1} \\left[ \\delta_1+\\mu_1 a\\neq \\delta_0+\\mu_0 a \\text{ or } \\exists i,\\ \\mu_0\\alpha_i\\neq0 \\right]. $$\n\nThen\n\n$$ \\begin{aligned} H^{\\ast}(F) &\\leq \\mathrm{actc}(F) \\leq \\mathrm{sactc}(F) \\cr &\\leq \\eta_G(A) + \\mathbf{1}[\\mu_0\\neq0]K(\\Gamma) + \\mathbf{1}[\\mu_1\\neq\\mu_0] \\bigl(\\lvert L(A)\\rvert+K_z(\\Gamma)\\bigr). \\end{aligned} $$\n\nIf the right-hand side is at most $2$, then\n\n$$ H^{\\ast}(F) = \\begin{cases} 0, & \\text{if } F \\text{ is constant},\\cr 1, & \\text{if } F \\text{ is a nonconstant LTF},\\cr 2, & \\text{otherwise}. \\end{cases} $$\n\n> **Interpretation.** One-bit branching over an affine-cylinder feature pays for the base cylinder correction only if the $z=0$ slice uses the feature, and pays changed affine slopes and changed cylinder coefficients only if the two slices use different signed copies of the feature.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/118_one_bit_affine_cylinder_branching.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":2,"degree":4},{"id":"119","title":"Fresh-Bit XOR Affine-Cylinder Bound","note":"Let have a strict affine-cylinder score with distinct nonvacuous cylinder supports. Let Define and and Then The same upper and lower bounds hold for the XNOR function . Consequently, if then Interpretation. Fresh-bit XOR is the branch where threshold degree provably rises. This lemma gives the matching affine-cylinder upper-bound target that would make the recursion exact.","interpretation":"Fresh-bit XOR is the branch where threshold degree provably rises. This lemma gives the matching affine-cylinder upper-bound target that would make the recursion exact.","claim":"Let\n\n$$ T:\\lbrace0,1\\rbrace^{m}\\to\\lbrace0,1\\rbrace $$\n\nhave a strict affine-cylinder score\n\n$$ S(y)=A(y)+\\sum_{\\gamma\\in\\Gamma}c_{\\gamma}C_{\\gamma}(y), \\qquad A(y)=a+\\sum_{i=1}^{m}\\alpha_i y_i, $$\n\nwith distinct nonvacuous cylinder supports. Let\n\n$$ F(z,y):=z\\oplus T(y). $$\n\nDefine\n\n$$ L(A):=\\lbrace i:\\alpha_i\\neq0\\rbrace, $$\n\nand\n\n$$ K(\\Gamma):=\\sum_{\\gamma=(P,N)\\in\\Gamma}\\kappa(P,N), \\qquad K_z(\\Gamma):=\\sum_{\\gamma=(P,N)\\in\\Gamma}\\kappa(P\\cup\\lbrace z\\rbrace,N), $$\n\nand\n\n$$ \\eta_{\\oplus}(A) := \\mathbf{1} \\left[ a\\neq0 \\text{ or } \\exists i,\\ \\alpha_i\\neq0 \\right]. $$\n\nThen\n\n$$ \\deg_{\\pm}(T)+1 \\leq H^{\\ast}(F) \\leq \\mathrm{actc}(F) \\leq \\mathrm{sactc}(F) \\leq \\eta_{\\oplus}(A) + \\lvert L(A)\\rvert + K(\\Gamma) + K_z(\\Gamma). $$\n\nThe same upper and lower bounds hold for the XNOR function $1-F$.\n\nConsequently, if\n\n$$ \\eta_{\\oplus}(A) + \\lvert L(A)\\rvert + K(\\Gamma) + K_z(\\Gamma) = \\deg_{\\pm}(T)+1, $$\n\nthen\n\n$$ H^{\\ast}(z\\oplus T)=H^{\\ast}(1-(z\\oplus T))=\\deg_{\\pm}(T)+1. $$\n\n> **Interpretation.** Fresh-bit XOR is the branch where threshold degree provably rises. This lemma gives the matching affine-cylinder upper-bound target that would make the recursion exact.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/119_fresh_bit_xor_affine_cylinder_bound.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":4,"out":1,"degree":5},{"id":"120","title":"Affine-Cylinder Cofactor Recursion","note":"Let and write its cofactors as Let Then Equivalently, for either choice of base cofactor , Interpretation. This is a coarse Shannon recursion for the affine-cylinder invariant. It pays one affine block, up to one changed-slope cylinder per remaining coordinate, and at most twice the cofactor cylinder costs when supports are lifted by the split bit.","interpretation":"This is a coarse Shannon recursion for the affine-cylinder invariant. It pays one affine block, up to one changed-slope cylinder per remaining coordinate, and at most twice the cofactor cylinder costs when supports are lifted by the split bit.","claim":"Let\n\n$$ f:\\lbrace0,1\\rbrace\\times\\lbrace0,1\\rbrace^{m}\\to\\lbrace0,1\\rbrace, $$\n\nand write its cofactors as\n\n$$ f_b(y):=f(b,y) \\qquad (b\\in\\lbrace0,1\\rbrace). $$\n\nLet\n\n$$ r_b:=\\mathrm{actc}(f_b). $$\n\nThen\n\n$$ H^{\\ast}(f) \\leq \\mathrm{actc}(f) \\leq \\mathrm{sactc}(f) \\leq 1+m+2(r_0+r_1)+\\min\\lbrace r_0,r_1\\rbrace. $$\n\nEquivalently, for either choice of base cofactor $b\\in\\lbrace0,1\\rbrace$,\n\n$$ \\mathrm{sactc}(f) \\leq 1+m+3r_b+2r_{1-b}. $$\n\n> **Interpretation.** This is a coarse Shannon recursion for the affine-cylinder invariant. It pays one affine block, up to one changed-slope cylinder per remaining coordinate, and at most twice the cofactor cylinder costs when supports are lifted by the split bit.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/120_affine_cylinder_cofactor_recursion.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":0,"degree":2},{"id":"121","title":"Literal-Gated Affine-Cylinder Features","note":"Let have a strict affine-cylinder score with distinct nonvacuous cylinder supports. Let be either or . Define If , set and if , set Then Also, where denotes the complementary literal. In either case, if the displayed upper bound is at most , then the exact value is , , or according as the gated function is constant, a nonconstant LTF, or neither. Interpretation. Literal conjunction and disjunction do not need the full raw-indicator calibration of . They only need to lift the cylinders in one direction and pay for c","interpretation":"Literal conjunction and disjunction do not need the full raw-indicator calibration of . They only need to lift the cylinders in one direction and pay for changed affine slopes.","claim":"Let\n\n$$ T:\\lbrace0,1\\rbrace^{m}\\to\\lbrace0,1\\rbrace $$\n\nhave a strict affine-cylinder score\n\n$$ S(y)=A(y)+\\sum_{\\gamma\\in\\Gamma}c_{\\gamma}C_{\\gamma}(y), \\qquad A(y)=a+\\sum_{i=1}^{m}\\alpha_i y_i, $$\n\nwith distinct nonvacuous cylinder supports. Let $r(z)$ be either $z$ or $1-z$. Define\n\n$$ L(A):=\\lbrace i:\\alpha_i\\neq0\\rbrace. $$\n\nIf $r(z)=z$, set\n\n$$ K_r(\\Gamma):=\\sum_{\\gamma=(P,N)\\in\\Gamma}\\kappa(P\\cup\\lbrace z\\rbrace,N), $$\n\nand if $r(z)=1-z$, set\n\n$$ K_r(\\Gamma):=\\sum_{\\gamma=(P,N)\\in\\Gamma}\\kappa(P,N\\cup\\lbrace z\\rbrace). $$\n\nThen\n\n$$ H^{\\ast}(r(z)\\wedge T(y)) \\leq 1+\\lvert L(A)\\rvert+K_r(\\Gamma). $$\n\nAlso,\n\n$$ H^{\\ast}(r(z)\\vee T(y)) \\leq 1+\\lvert L(A)\\rvert+K_{1-r}(\\Gamma), $$\n\nwhere $1-r$ denotes the complementary literal.\n\nIn either case, if the displayed upper bound is at most $2$, then the exact value is $0$, $1$, or $2$ according as the gated function is constant, a nonconstant LTF, or neither.\n\n> **Interpretation.** Literal conjunction and disjunction do not need the full raw-indicator calibration of $T$. They only need to lift the cylinders in one direction and pay for changed affine slopes.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/121_literal_gated_affine_cylinder_feature.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":3,"out":1,"degree":4},{"id":"122","title":"Lifted Literal-Gating Cost","note":"For a strict affine-cylinder score define and Define the lifted literal-gating cost of a Boolean function by where the minimum ranges over all strict affine-cylinder scores for . Then for either literal , and Moreover, If , then every literal-gated function here that is neither constant nor a nonconstant LTF is exactly two-head. Interpretation. Literal gating has its own optimized cost: the number of affine slopes plus the cheaper way to lift the cylinder correction through the fresh literal.","interpretation":"Literal gating has its own optimized cost: the number of affine slopes plus the cheaper way to lift the cylinder correction through the fresh literal.","claim":"For a strict affine-cylinder score\n\n$$ S(y)=A(y)+\\sum_{\\gamma\\in\\Gamma}c_{\\gamma}C_{\\gamma}(y), \\qquad A(y)=a+\\sum_{i=1}^{m}\\alpha_i y_i, $$\n\ndefine\n\n$$ L(A):=\\lbrace i:\\alpha_i\\neq0\\rbrace, $$\n\nand\n\n$$ K_{+}(\\Gamma):=\\sum_{\\gamma=(P,N)\\in\\Gamma}\\kappa(P\\cup\\lbrace z\\rbrace,N), \\qquad K_{-}(\\Gamma):=\\sum_{\\gamma=(P,N)\\in\\Gamma}\\kappa(P,N\\cup\\lbrace z\\rbrace). $$\n\nDefine the lifted literal-gating cost of a Boolean function $T$ by\n\n$$ \\mathrm{lgactc}(T) := \\min_S \\left( \\lvert L(A)\\rvert+\\min\\lbrace K_{+}(\\Gamma),K_{-}(\\Gamma)\\rbrace \\right), $$\n\nwhere the minimum ranges over all strict affine-cylinder scores $S$ for $T$.\n\nThen for either literal $r(z)\\in\\lbrace z,1-z\\rbrace$,\n\n$$ H^{\\ast}(r(z)\\wedge T(y)) \\leq 1+\\mathrm{lgactc}(T), $$\n\nand\n\n$$ H^{\\ast}(r(z)\\vee T(y)) \\leq 1+\\mathrm{lgactc}(T). $$\n\nMoreover,\n\n$$ \\mathrm{lgactc}(T) \\leq m+2\\mathrm{actc}(T). $$\n\nIf $\\mathrm{lgactc}(T)\\leq1$, then every literal-gated function here that is neither constant nor a nonconstant LTF is exactly two-head.\n\n> **Interpretation.** Literal gating has its own optimized cost: the number of affine slopes plus the cheaper way to lift the cylinder correction through the fresh literal.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/122_lifted_literal_gating_cost.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":3,"out":2,"degree":5},{"id":"123","title":"Non-XOR Gates Through Lifted Cost","note":"Let be any Boolean function, and let be a two-input Boolean gate that is neither XOR nor XNOR. Define Then: 1. If is constant or depends only on , then 2. If depends only on its second input, then 3. If genuinely depends on both inputs, then In particular, for every non-XOR and non-XNOR gate , and the sharper case split above should be used whenever the gate form is known. Interpretation. The arbitrary non-XOR recursion can be sharpened for gates that genuinely combine the fresh literal with the feature: the releva","interpretation":"The arbitrary non-XOR recursion can be sharpened for gates that genuinely combine the fresh literal with the feature: the relevant parameter is the lifted literal-gating cost of .","claim":"Let\n\n$$ T:\\lbrace0,1\\rbrace^{m}\\to\\lbrace0,1\\rbrace $$\n\nbe any Boolean function, and let\n\n$$ G:\\lbrace0,1\\rbrace^{2}\\to\\lbrace0,1\\rbrace $$\n\nbe a two-input Boolean gate that is neither XOR nor XNOR. Define\n\n$$ F(z,y):=G(z,T(y)). $$\n\nThen:\n\n1. If $G$ is constant or depends only on $z$, then\n\n$$ H^{\\ast}(F)\\leq1. $$\n\n2. If $G$ depends only on its second input, then\n\n$$ H^{\\ast}(F)\\leq\\mathrm{actc}(T). $$\n\n3. If $G$ genuinely depends on both inputs, then\n\n$$ H^{\\ast}(F)\\leq1+\\mathrm{lgactc}(T). $$\n\nIn particular, for every non-XOR and non-XNOR gate $G$,\n\n$$ H^{\\ast}(G(z,T(y))) \\leq 1+\\mathrm{actc}(T)+\\mathrm{lgactc}(T), $$\n\nand the sharper case split above should be used whenever the gate form is known.\n\n> **Interpretation.** The arbitrary non-XOR recursion $H^{\\ast}(G(z,T))\\leq H^{\\ast}(T)+1$ can be sharpened for gates that genuinely combine the fresh literal with the feature: the relevant parameter is the lifted literal-gating cost of $T$.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/123_non_xor_gate_lifted_cost.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":0,"degree":2},{"id":"124","title":"Fresh-Bit XOR Target Cost","note":"For a strict affine-cylinder score define and Define where the minimum ranges over all strict affine-cylinder scores for . Then and the same bounds hold for . Consequently, if then fresh-bit XOR and XNOR over have exact head complexity . Moreover, Interpretation. The XOR target cost is the optimized affine-cylinder quantity that must match threshold degree to solve the fresh-bit XOR recursion exactly for a feature.","interpretation":"The XOR target cost is the optimized affine-cylinder quantity that must match threshold degree to solve the fresh-bit XOR recursion exactly for a feature.","claim":"For a strict affine-cylinder score\n\n$$ S(y)=A(y)+\\sum_{\\gamma\\in\\Gamma}c_{\\gamma}C_{\\gamma}(y), \\qquad A(y)=a+\\sum_{i=1}^{m}\\alpha_i y_i, $$\n\ndefine\n\n$$ L(A):=\\lbrace i:\\alpha_i\\neq0\\rbrace, $$\n\n$$ K_{0}(\\Gamma):=\\sum_{\\gamma=(P,N)\\in\\Gamma}\\kappa(P,N), \\qquad K_{+}(\\Gamma):=\\sum_{\\gamma=(P,N)\\in\\Gamma}\\kappa(P\\cup\\lbrace z\\rbrace,N), \\qquad K_{-}(\\Gamma):=\\sum_{\\gamma=(P,N)\\in\\Gamma}\\kappa(P,N\\cup\\lbrace z\\rbrace), $$\n\nand\n\n$$ \\eta_{\\oplus}(A) := \\mathbf{1} \\left[ a\\neq0 \\text{ or } \\exists i,\\ \\alpha_i\\neq0 \\right]. $$\n\nDefine\n\n$$ \\mathrm{xactc}(T) := \\min_S \\left( \\eta_{\\oplus}(A) + \\lvert L(A)\\rvert + K_{0}(\\Gamma) + \\min\\lbrace K_{+}(\\Gamma),K_{-}(\\Gamma)\\rbrace \\right), $$\n\nwhere the minimum ranges over all strict affine-cylinder scores $S$ for $T$.\n\nThen\n\n$$ \\deg_{\\pm}(T)+1 \\leq H^{\\ast}(z\\oplus T(y)) \\leq \\mathrm{xactc}(T), $$\n\nand the same bounds hold for $1-(z\\oplus T(y))$.\n\nConsequently, if\n\n$$ \\mathrm{xactc}(T)=\\deg_{\\pm}(T)+1, $$\n\nthen fresh-bit XOR and XNOR over $T$ have exact head complexity $\\deg_{\\pm}(T)+1$.\n\nMoreover,\n\n$$ \\mathrm{xactc}(T) \\leq 1+m+3\\mathrm{actc}(T). $$\n\n> **Interpretation.** The XOR target cost is the optimized affine-cylinder quantity that must match threshold degree to solve the fresh-bit XOR recursion exactly for a feature.","proofUrl":"https://github.com/VerifiedMecha st. If $R$ is obtained from $T$ by fixing some feature coordinates, then\n\n   $\\mathrm{lgactc}(R)\\leq\\mathrm{lgactc}(T), \\qquad \\mathrm{xactc}(R)\\leq\\mathrm{xactc}(T).$\n\n5. Adding dummy feature variables does not change either cost. If\n\n   $U(y,w)=T(y),$\n\n   then\n\n   $\\mathrm{lgactc}(U)=\\mathrm{lgactc}(T), \\qquad \\mathrm{xactc}(U)=\\mathrm{xactc}(T).$\n\n> **Interpretation.** The optimized literal-gating and fresh-XOR costs can be minimized on the same canonical feature representatives as $\\mathrm{actc}$. Hard restrictions of the feature remain valid lower-bound witnesses for these optimized one-bit targets.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/125_optimized_one_bit_cost_invariances.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":0,"degree":2},{"id":"126","title":"Endpoint Feature Fresh-XOR Exactness","note":"Let with . Set Define the positive endpoint features Then and Interpretation. Fresh-bit XOR is hard in general, but it is exactly two heads for the positive OR-type and AND-type endpoint features used by the calibrated endpoint-vote theorem.","interpretation":"Fresh-bit XOR is hard in general, but it is exactly two heads for the positive OR-type and AND-type endpoint features used by the calibrated endpoint-vote theorem.","claim":"Let\n\n$$ L(y)=\\sum_{i\\in S}\\lambda_i y_i, \\qquad \\lambda_i\\gt0, $$\n\nwith $S\\neq\\varnothing$. Set\n\n$$ \\Lambda:=\\sum_{i\\in S}\\lambda_i, \\qquad \\mu:=\\min_{i\\in S}\\lambda_i. $$\n\nDefine the positive endpoint features\n\n$$ O_L(y):=\\mathbf{1}[L(y)\\gt0], \\qquad A_L(y):=\\mathbf{1}[L(y)=\\Lambda]. $$\n\nThen\n\n$$ H^{\\ast}(z\\oplus O_L(y)) = H^{\\ast}(1-(z\\oplus O_L(y))) = 2, $$\n\nand\n\n$$ H^{\\ast}(z\\oplus A_L(y)) = H^{\\ast}(1-(z\\oplus A_L(y))) = 2. $$\n\n> **Interpretation.** Fresh-bit XOR is hard in general, but it is exactly two heads for the positive OR-type and AND-type endpoint features used by the calibrated endpoint-vote theorem.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/04_recursions_and_cost_invariants/126_endpoint_feature_fresh_xor_exact.md","leanCertified":false,"topic":"recursion","kind":"theorem","in":2,"out":1,"degree":3},{"id":"127","title":"Affine Endpoint Fresh-XOR Exactness","note":"Let be a nonconstant affine statistic on . Let and define the two endpoint predicates Then and Equivalently, if is either endpoint predicate, then both fresh-bit XOR and fresh-bit XNOR over have exact head complexity . Interpretation. Lemma 126 is not a positive-weights accident. Fresh XOR with an affine endpoint is always a two-head affine slab, no matter how the affine coefficients are signed.","interpretation":"Lemma 126 is not a positive-weights accident. Fresh XOR with an affine endpoint is always a two-head affine slab, no matter how the affine coefficients are signed.","claim":"Let\n\n$$ L(y)=a+\\sum_{i=1}^{m}\\alpha_i y_i $$\n\nbe a nonconstant affine statistic on $\\lbrace0,1\\rbrace^{m}$. Let\n\n$$ \\ell_{\\min}:=\\min_y L(y), \\qquad \\ell_{\\max}:=\\max_y L(y), $$\n\nand define the two endpoint predicates\n\n$$ E_{\\min}(y):=\\mathbf{1}[L(y)=\\ell_{\\min}], \\qquad E_{\\max}(y):=\\mathbf{1}[L(y)=\\ell_{\\max}]. $$\n\nThen\n\n$$ H^{\\ast}(z\\oplus E_{\\min}(y)) = H^{\\ast}(1-(z\\oplus E_{\\min}(y))) = 2, $$\n\nand\n\n$$ H^{\\ast}(z\\oplus E_{\\max}(y)) = H^{\\ast}(1-(z\\oplus E_{\\max}(y))) = 2. $$\n\nEquivalently, if $E$ is either endpoint predicate, then both fresh-bit XOR and fresh-bit XNOR over $E$ have exact head complexity $2$.\n\n> **Interpretation.** Lemma 126 is not a positive-weights accident. Fresh XOR with an affine endpoint is always a two-head affine slab, no matter how the affine coefficients are signed.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/127_affine_endpoint_fresh_xor_exact.md","leanCertified":false,"topic":"gates","kind":"theorem","in":3,"out":0,"degree":3},{"id":"128","title":"Affine Endpoint One-Bit Gate Classification","note":"Let be a nonconstant affine statistic on . Let be either endpoint predicate where For any two-input Boolean gate , define Then Interpretation. For affine endpoint features, the one-bit gate split is exact. The only genuinely two-head interactions are fresh-bit XOR and XNOR.","interpretation":"For affine endpoint features, the one-bit gate split is exact. The only genuinely two-head interactions are fresh-bit XOR and XNOR.","claim":"Let\n\n$$ L(y)=a+\\sum_{i=1}^{m}\\alpha_i y_i $$\n\nbe a nonconstant affine statistic on $\\lbrace0,1\\rbrace^{m}$. Let $E$ be either endpoint predicate\n\n$$ E_{\\min}(y)=\\mathbf{1}[L(y)=\\ell_{\\min}] \\qquad \\text{or} \\qquad E_{\\max}(y)=\\mathbf{1}[L(y)=\\ell_{\\max}], $$\n\nwhere\n\n$$ \\ell_{\\min}:=\\min_y L(y), \\qquad \\ell_{\\max}:=\\max_y L(y). $$\n\nFor any two-input Boolean gate $G:\\lbrace0,1\\rbrace^{2}\\to\\lbrace0,1\\rbrace$, define\n\n$$ F(z,y):=G(z,E(y)). $$\n\nThen\n\n$$ H^{\\ast}(F)= \\begin{cases} 0 & \\text{if } G \\text{ is constant},\\cr 2 & \\text{if } G \\text{ is XOR or XNOR},\\cr 1 & \\text{otherwise}. \\end{cases} $$\n\n> **Interpretation.** For affine endpoint features, the one-bit gate split is exact. The only genuinely two-head interactions are fresh-bit XOR and XNOR.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/128_affine_endpoint_one_bit_gate_classification.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":0,"degree":1},{"id":"129","title":"LTF One-Bit Gate Classification","note":"Let be a nonconstant LTF, and let be any Boolean gate. Define Then Interpretation. A raw bit and one arbitrary LTF feature generate no hidden head complexity. XOR and XNOR are exactly the two-head cases; every other nonconstant gate is itself an LTF.","interpretation":"A raw bit and one arbitrary LTF feature generate no hidden head complexity. XOR and XNOR are exactly the two-head cases; every other nonconstant gate is itself an LTF.","claim":"Let\n\n$$ T:\\lbrace0,1\\rbrace^{m}\\to\\lbrace0,1\\rbrace $$\n\nbe a nonconstant LTF, and let $G:\\lbrace0,1\\rbrace^{2}\\to\\lbrace0,1\\rbrace$ be any Boolean gate. Define\n\n$$ F(z,y):=G(z,T(y)). $$\n\nThen\n\n$$ H^{\\ast}(F)= \\begin{cases} 0 & \\text{if } G \\text{ is constant},\\cr 2 & \\text{if } G \\text{ is XOR or XNOR},\\cr 1 & \\text{otherwise}. \\end{cases} $$\n\n> **Interpretation.** A raw bit and one arbitrary LTF feature generate no hidden head complexity. XOR and XNOR are exactly the two-head cases; every other nonconstant gate is itself an LTF.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/129_ltf_one_bit_gate_classification.md","leanCertified":false,"topic":"gates","kind":"theorem","in":4,"out":2,"degree":6},{"id":"130","title":"Fresh-XOR Affine-Statistic Sign-Change Bound","note":"Let be an affine statistic on , and let Let , and define Write the distinct image values as and let be the number of sign changes in the sequence Define Then: 1. If , then 2. If , then 3. If , then and the same upper bound holds for XNOR. Interpretation. Fresh XOR over one affine statistic doubles the sign-change pattern and adds one boundary change exactly when the original pattern starts and ends with the same label.","interpretation":"Fresh XOR over one affine statistic doubles the sign-change pattern and adds one boundary change exactly when the original pattern starts and ends with the same label.","claim":"Let\n\n$$ L(y)=a+\\sum_{i=1}^{m}\\alpha_i y_i $$\n\nbe an affine statistic on $\\lbrace0,1\\rbrace^{m}$, and let\n\n$$ k:=\\lvert\\lbrace i:\\alpha_i\\neq0\\rbrace\\rvert. $$\n\nLet $G:\\mathrm{Im}(L)\\to\\lbrace0,1\\rbrace$, and define\n\n$$ T(y):=G(L(y)). $$\n\nWrite the distinct image values as\n\n$$ \\lambda_1\\lt\\lambda_2\\lt\\cdots\\lt\\lambda_M, $$\n\nand let $C$ be the number of sign changes in the sequence\n\n$$ G(\\lambda_1),G(\\lambda_2),\\ldots,G(\\lambda_M). $$\n\nDefine\n\n$$ D_{\\oplus}(C):= \\begin{cases} 2C+1 & \\text{if } C \\text{ is even},\\cr 2C & \\text{if } C \\text{ is odd}. \\end{cases} $$\n\nThen:\n\n1. If $C=0$, then\n\n$$ H^{\\ast}(z\\oplus T(y))=H^{\\ast}(1-(z\\oplus T(y)))=1. $$\n\n2. If $C=1$, then\n\n$$ H^{\\ast}(z\\oplus T(y))=H^{\\ast}(1-(z\\oplus T(y)))=2. $$\n\n3. If $C\\geq2$, then\n\n$$ H^{\\ast}(z\\oplus T(y)) \\leq 1+\\sum_{r=2}^{\\min\\lbrace D_{\\oplus}(C),k+1\\rbrace}\\binom{k+1}{r}, $$\n\nand the same upper bound holds for XNOR.\n\n> **Interpretation.** Fresh XOR over one affine statistic doubles the sign-change pattern and adds one boundary change exactly when the original pattern starts and ends with the same label.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/130_fresh_xor_affine_statistic_sign_change_bound.md","leanCertified":false,"topic":"gates","kind":"theorem","in":3,"out":0,"degree":3},{"id":"131","title":"Positive-Projection Fresh-XOR Sign-Change Bound","note":"Let and let . Define Write the image of as and let be the number of sign changes in Set Then: 1. If , then 2. If , then 3. If , then and the same upper bound holds for XNOR. Moreover, if then fresh XOR and XNOR over have exact head complexity . Interpretation. For positive one-dimensional projections, the fresh-XOR construction pays directly for the doubled sign-change sequence, not for an affine-free monomial expansion.","interpretation":"For positive one-dimensional projections, the fresh-XOR construction pays directly for the doubled sign-change sequence, not for an affine-free monomial expansion.","claim":"Let\n\n$$ t(y)=\\sum_{i=1}^{m}\\lambda_i y_i, \\qquad \\lambda_i\\gt0, $$\n\nand let $G:\\mathrm{Im}(t)\\to\\lbrace0,1\\rbrace$. Define\n\n$$ T(y):=G(t(y)). $$\n\nWrite the image of $t$ as\n\n$$ 0=\\tau_0\\lt\\tau_1\\lt\\cdots\\lt\\tau_{M-1}, $$\n\nand let $C$ be the number of sign changes in\n\n$$ G(\\tau_0),G(\\tau_1),\\ldots,G(\\tau_{M-1}). $$\n\nSet\n\n$$ D_{\\oplus}(C):= \\begin{cases} 2C+1 & \\text{if } C \\text{ is even},\\cr 2C & \\text{if } C \\text{ is odd}. \\end{cases} $$\n\nThen:\n\n1. If $C=0$, then\n\n$$ H^{\\ast}(z\\oplus T(y))=H^{\\ast}(1-(z\\oplus T(y)))=1. $$\n\n2. If $C=1$, then\n\n$$ H^{\\ast}(z\\oplus T(y))=H^{\\ast}(1-(z\\oplus T(y)))=2. $$\n\n3. If $C\\geq2$, then\n\n$$ H^{\\ast}(z\\oplus T(y))\\leq D_{\\oplus}(C), $$\n\nand the same upper bound holds for XNOR. Moreover, if\n\n$$ \\deg_{\\pm}(T)+1=D_{\\oplus}(C), $$\n\nthen fresh XOR and XNOR over $T$ have exact head complexity $D_{\\oplus}(C)$.\n\n> **Interpretation.** For positive one-dimensional projections, the fresh-XOR construction pays directly for the doubled sign-change sequence, not for an affine-free monomial expansion.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/131_positive_projection_fresh_xor_sign_change_bound.md","leanCertified":false,"topic":"gates","kind":"theorem","in":4,"out":2,"degree":6},{"id":"132","title":"Positive-Projection One-Bit Gate Bound","note":"Let and let . Define Write the image of as Let be any two-input Boolean gate, and define Form the concatenated gate sequence Let be the number of sign changes in this sequence. Then More precisely: 1. If , then . 2. If , then . 3. If , then Interpretation. A raw bit appended to a positive-projection feature remains a positive projection after separating the two slices. The cost is the sign-change count of the two gate slices written end to end.","interpretation":"A raw bit appended to a positive-projection feature remains a positive projection after separating the two slices. The cost is the sign-change count of the two gate slices written end to end.","claim":"Let\n\n$$ t(y)=\\sum_{i=1}^{m}\\lambda_i y_i, \\qquad \\lambda_i\\gt0, $$\n\nand let $F:\\mat leanCertified":false,"topic":"gates","kind":"theorem","in":2,"out":0,"degree":2},{"id":"145","title":"Common Positive-Statistic Multi-Slice Bound","note":"Let , let be raw bits, and let Suppose factors through on every raw-bit slice: for each , there is a function on the image of such that Let be the sign-change count of along the ordered image of . Then Interpretation. If all raw-bit slices share one positive statistic, then the full function is controlled by the total one-dimensional variation inside the slices, plus one possible jump between adjacent slices.","interpretation":"If all raw-bit slices share one positive statistic, then the full function is controlled by the total one-dimensional variation inside the slices, plus one possible jump between adjacent slices.","claim":"Let $k\\geq0$, let $z\\in\\lbrace0,1\\rbrace^{k}$ be raw bits, and let\n\n$$ t(y)=\\sum_{i=1}^{m}\\lambda_i y_i, \\qquad \\lambda_i\\gt0. $$\n\nSuppose $f(z,y)$ factors through $t$ on every raw-bit slice: for each $a\\in\\lbrace0,1\\rbrace^{k}$, there is a function $F_a$ on the image of $t$ such that\n\n$$ f(a,y)=F_a(t(y)). $$\n\nLet $C_a$ be the sign-change count of $F_a$ along the ordered image of $t$. Then\n\n$$ H^{\\ast}(f) \\leq \\sum_{a\\in\\lbrace0,1\\rbrace^{k}} C_a + 2^{k}-1. $$\n\n> **Interpretation.** If all raw-bit slices share one positive statistic, then the full function is controlled by the total one-dimensional variation inside the slices, plus one possible jump between adjacent slices.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/145_common_positive_statistic_multi_slice_bound.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":1,"degree":2},{"id":"146","title":"Multi-Raw Positive-Statistic Degree Bound","note":"Let , let be raw bits, and let Suppose is a strict sign polynomial for a Boolean function , and suppose that for each raw assignment , the slice is a univariate polynomial in of degree at most . Then In particular, if has degree at most in the quantities , reduced multilinearly in the raw bits, then Interpretation. A bounded-degree threshold in one positive statistic and raw bits has a head bound exponential only in the number of raw bits, and independent of the number of feature variables.","interpretation":"A bounded-degree threshold in one positive statistic and raw bits has a head bound exponential only in the number of raw bits, and independent of the number of feature variables.","claim":"Let $k\\geq0$, let $z\\in\\lbrace0,1\\rbrace^{k}$ be raw bits, and let\n\n$$ t(y)=\\sum_{i=1}^{m}\\lambda_i y_i, \\qquad \\lambda_i\\gt0. $$\n\nSuppose $P(z,y)$ is a strict sign polynomial for a Boolean function $f(z,y)$, and suppose that for each raw assignment $a\\in\\lbrace0,1\\rbrace^{k}$, the slice\n\n$$ P_a(u):=P(a,y)\\quad\\text{with }u=t(y) $$\n\nis a univariate polynomial in $u$ of degree at most $d_a$. Then\n\n$$ H^{\\ast}(f) \\leq \\sum_{a\\in\\lbrace0,1\\rbrace^{k}} d_a + 2^{k}-1. $$\n\nIn particular, if $P$ has degree at most $d$ in the quantities $t(y),z_1,\\ldots,z_k$, reduced multilinearly in the raw bits, then\n\n$$ H^{\\ast}(f)\\leq 2^{k}(d+1)-1. $$\n\n> **Interpretation.** A bounded-degree threshold in one positive statistic and $k$ raw bits has a head bound exponential only in the number of raw bits, and independent of the number of feature variables.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/146_multi_raw_positive_statistic_degree_bound.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":0,"degree":1},{"id":"147","title":"Ordered Common Positive-Statistic Slice Bound","note":"Let , let be raw bits, and let Suppose each raw-bit slice of factors through : Write the image of as Choose positive raw weights with distinct subset sums, and order the raw assignments as so that Let be the sign-change count of along , and let be the number of boundary jumps: Then Interpretation. The multi-slice construction pays only for actual boundary label changes between consecutive raw slices, not for every boundary.","interpretation":"The multi-slice construction pays only for actual boundary label changes between consecutive raw slices, not for every boundary.","claim":"Let $k\\geq1$, let $z\\in\\lbrace0,1\\rbrace^{k}$ be raw bits, and let\n\n$$ t(y)=\\sum_{i=1}^{m}\\lambda_i y_i, \\qquad \\lambda_i\\gt0. $$\n\nSuppose each raw-bit slice of $f(z,y)$ factors through $t$:\n\n$$ f(a,y)=F_a(t(y)) \\qquad \\text{for every }a\\in\\lbrace0,1\\rbrace^{k}. $$\n\nWrite the image of $t$ as\n\n$$ \\tau_0\\lt\\tau_1\\lt\\cdots\\lt\\tau_{M-1}. $$\n\nChoose positive raw weights $\\rho_1,\\ldots,\\rho_k$ with distinct subset sums, and order the raw assignments as\n\n$$ a^{(0)},a^{(1)},\\ldots,a^{(2^k-1)} $$\n\nso that\n\n$$ \\sum_{j=1}^{k}\\rho_j a^{(q)}_j \\lt \\sum_{j=1}^{k}\\rho_j a^{(q+1)}_j. $$\n\nLet $C_a$ be the sign-change count of $F_a$ along $\\tau_0,\\ldots,\\tau_{M-1}$, and let $J_{\\rho}$ be the number of boundary jumps:\n\n$$ J_{\\rho} := \\left\\lvert \\left\\lbrace q\\in\\lbrace0,\\ldots,2^k-2\\rbrace: F_{a^{(q)}}(\\tau_{M-1})\\neq F_{a^{(q+1)}}(\\tau_0) \\right\\rbrace \\right\\rvert. $$\n\nThen\n\n$$ H^{\\ast}(f) \\leq \\sum_{a\\in\\lbrace0,1\\rbrace^{k}}C_a+J_{\\rho}. $$\n\n> **Interpretation.** The multi-slice construction pays only for actual boundary label changes between consecutive raw slices, not for every boundary.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/147_ordered_common_positive_statistic_slice_bound.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":5,"degree":6},{"id":"148","title":"Multi-Raw Gate Over Positive-Statistic Feature Bound","note":"Let , let be raw bits, and let Write the image of as and let be the sign-change count of along this ordered image. Let be any Boolean gate, and define Choose positive raw weights with distinct subset sums, and order the raw assignments as in Lemma 147. For each raw assignment , define the one-variable slice Let Let be the number of boundary jumps between consecutive raw slices: Then Interpretation. A multi-raw gate over one positive-statistic feature pays one copy of the feature's variation for each raw slice that ","interpretation":"A multi-raw gate over one positive-statistic feature pays one copy of the feature's variation for each raw slice that actually depends on the feature, plus actual boundary jumps between raw slices.","claim":"Let $k\\geq1$, let $z\\in\\lbrace0,1\\rbrace^{k}$ be raw bits, and let\n\n$$ T(y)=F(t(y)), \\qquad t(y)=\\sum_{i=1}^{m}\\lambda_i y_i, \\qquad \\lambda_i\\gt0. $$\n\nWrite the image of $t$ as\n\n$$ \\tau_0\\lt\\tau_1\\lt\\cdots\\lt\\tau_{M-1}, $$\n\nand let $C$ be the sign-change count of $F$ along this ordered image. Let\n\n$$ G:\\lbrace0,1\\rbrace^{k}\\times\\lbrace0,1\\rbrace\\to\\lbrace0,1\\rbrace $$\n\nbe any Boolean gate, and define\n\n$$ H_G(z,y):=G(z,T(y)). $$\n\nChoose positive raw weights $\\rho_1,\\ldots,\\rho_k$ with distinct subset sums, and order the raw assignments as in Lemma 147. For each raw assignment $a$, define the one-variable slice\n\n$$ G_a(u):=G(a,u). $$\n\nLet\n\n$$ N_G:=\\left\\lvert\\lbrace a:G_a\\text{ is }u\\text{ or }1-u\\rbrace\\right\\rvert. $$\n\nLet $J_{\\rho,G}$ be the number of boundary jumps between consecutive raw slices:\n\n$$ J_{\\rho,G} := \\left\\lvert \\left\\lbrace q\\in\\lbrace0,\\ldots,2^k-2\\rbrace: G_{a^{(q)}}(F(\\tau_{M-1})) \\neq G_{a^{(q+1)}}(F(\\tau_0)) \\right\\rbrace \\right\\rvert. $$\n\nThen\n\n$$ H^{\\ast}(H_G)\\leq N_G C+J_{\\rho,G}. $$\n\n> **Interpretation.** A multi-raw gate over one positive-statistic feature pays one copy of the feature's variation for each raw slice that actually depends on the feature, plus actual boundary jumps between raw slices.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/148_multi_raw_gate_positive_statistic_feature_bound.md","leanCertified":false,"topic":"gates","kind":"theorem","in":0,"out":0,"degree":0},{"id":"149","title":"Optimized Ordered Positive-Statistic Slice Cost","note":"Let , let be raw bits, and let be the remaining variables. A common positive-statistic certificate for is a positive statistic such that every raw slice factors through : Write the image of as For such a certificate and for positive raw weights with distinct subset sums, order the raw assignments as by increasing value of . Define the ordered slice cost where Let where the minimum ranges over all common positive-statistic certificates and all positive raw weights with distinct subset sums. Then Interpretation. The ","interpretation":"The ordered multi-slice construction is an optimized invariant: it charges within-slice positive-statistic variation plus only the boundary jumps forced by the chosen positive raw order.","claim":"Let $k\\geq1$, let $z\\in\\lbrace0,1\\rbrace^{k}$ be raw bits, and let $y\\in\\lbrace0,1\\rbrace^{m}$ be the remaining variables. A common positive-statistic certificate for $f(z,y)$ is a positive statistic\n\n$$ t(y)=\\sum_{i=1}^{m}\\lambda_i y_i, \\qquad \\lambda_i\\gt0, $$\n\nsuch that every raw slice factors through $t$:\n\n$$ f(a,y)=F_a(t(y)) \\qquad \\text{for every }a\\in\\lbrace0,1\\rbrace^{k}. $$\n\nWrite the image of $t$ as\n\n$$ \\tau_0\\lt\\tau_1\\lt\\cdots\\lt\\tau_{M-1}. $$\n\nFor such a certificate and for positive raw weights $\\rho_1,\\ldots,\\rho_k$ with distinct subset sums, order the raw assignments as\n\n$$ a^{(0)},a^{(1)},\\ldots,a^{(2^k-1)} $$\n\nby increasing value of $\\sum_j\\rho_j a_j$. Define the ordered slice cost\n\n$$ \\Omega_{t,\\rho}(f) := \\sum_{a\\in\\lbrace0,1\\rbrace^{k}} \\left\\lvert \\left\\lbrace r\\in\\lbrace0,\\ldots,M-2\\rbrace:F_a(\\tau_r)\\neq F_a(\\tau_{r+1}) \\right\\rbrace \\right\\rvert + J_{t,\\rho}(f), $$\n\nwhere\n\n$$ J_{t,\\rho}(f) := \\left\\lvert \\left\\lbrace q\\in\\lbrace0,\\ldots,2^k-2\\rbrace: F_{a^{(q)}}(\\tau_{M-1})\\neq F_{a^{(q+1)}}(\\tau_0) \\right\\rbrace \\right\\rvert. $$\n\nLet\n\n$$ \\mathrm{osc}_{+}^{z\\mid y}(f) := \\min_{t,\\rho}\\Omega_{t,\\rho}(f), $$\n\nwhere the minimum ranges over all common positive-statistic certificates $t$ and all positive raw weights $\\rho$ with distinct subset sums. Then\n\n$$ H^{\\ast}(f)\\leq \\mathrm{osc}_{+}^{z\\mid y}(f). $$\n\n> **Interpretation.** The ordered multi-slice construction is an optimized invariant: it charges within-slice positive-statistic variation plus only the boundary jumps forced by the chosen positive raw order.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/149_optimized_ordered_positive_statistic_slice_cost.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":0,"degree":1},{"id":"150","title":"Ordered Slice Degree Bound","note":"Let , let be raw bits, and let Suppose is a strict sign polynomial for , and suppose that for each raw assignment the slice is a univariate polynomial in of degree at most . Choose positive raw weights with distinct subset sums, and let be the actual boundary-jump count from Lemma 147 for the slice functions of along this raw order. Then Consequently, If has degree at most in the quantities , reduced multilinearly in the raw bits, then Interpretation. Degree controls the variation inside each raw slice, while the o","interpretation":"Degree controls the variation inside each raw slice, while the ordered-slice proof keeps the exact boundary price instead of paying the coarse term.","claim":"Let $k\\geq1$, let $z\\in\\lbrace0,1\\rbrace^{k}$ be raw bits, and let\n\n$$ t(y)=\\sum_{i=1}^{m}\\lambda_i y_i, \\qquad \\lambda_i\\gt0. $$\n\nSuppose $P(z,y)$ is a strict sign polynomial for $f(z,y)$, and suppose that for each raw assignment $a\\in\\lbrace0,1\\rbrace^{k}$ the slice\n\n$$ P(a,y)=p_a(t(y)) $$\n\nis a univariate polynomial in $t(y)$ of degree at most $d_a$. Choose positive raw weights $\\rho_1,\\ldots,\\rho_k$ with distinct subset sums, and let $J_{\\rho}(f)$ be the actual boundary-jump count from Lemma 147 for the slice functions of $f$ along this raw order. Then\n\n$$ H^{\\ast}(f) \\leq \\sum_{a\\in\\lbrace0,1\\rbrace^{k}}d_a+J_{\\rho}(f). $$\n\nConsequently,\n\n$$ H^{\\ast}(f) \\leq \\sum_{a\\in\\lbrace0,1\\rbrace^{k}}d_a + \\min_{\\rho}J_{\\rho}(f). $$\n\nIf $P$ has degree at most $d$ in the quantities $t(y),z_1,\\ldots,z_k$, reduced multilinearly in the raw bits, then\n\n$$ H^{\\ast}(f) \\leq 2^k d+\\min_{\\rho}J_{\\rho}(f). $$\n\n> **Interpretation.** Degree controls the variation inside each raw slice, while the ordered-slice proof keeps the exact boundary price instead of paying the coarse $2^k-1$ term.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/150_ordered_slice_degree_bound.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":0,"degree":1},{"id":"151","title":"Positive Mixed Boundary Gate Bound","note":"For raw functions and positive raw weights with distinct subset sums, order the raw assignments as by increasing value of . Define the mixed boundary count and the optimized positive mixed boundary cost Now let with image Let be the sign-change count of along this image, and put For a Boolean gate write and let Then Interpretation. For a multi-raw gate over one positive-statistic feature, the boundary term depends only on the two endpoint raw functions seen at the end and the beginning of each feature slice.","interpretation":"For a multi-raw gate over one positive-statistic feature, the boundary term depends only on the two endpoint raw functions seen at the end and the beginning of each feature slice.","claim":"For raw functions\n\n$$ p,q:\\lbrace0,1\\rbrace^{k}\\to\\lbrace0,1\\rbrace, $$\n\nand positive raw weights $\\rho_1,\\ldots,\\rho_k$ with distinct subset sums, order the raw assignments as\n\n$$ a^{(0)},a^{(1)},\\ldots,a^{(2^k-1)} $$\n\nby increasing value of $\\sum_j\\rho_j a_j$. Define the mixed boundary count\n\n$$ B_{\\rho}(p,q) := \\left\\lvert \\left\\lbrace r\\in\\lbrace0,\\ldots,2^k-2\\rbrace: p(a^{(r)})\\neq q(a^{(r+1)}) \\right\\rbrace \\right\\rvert, $$\n\nand the optimized positive mixed boundary cost\n\n$$ B_{+}(p,q):=\\min_{\\rho}B_{\\rho}(p,q). $$\n\nNow let\n\n$$ T(y)=F(t(y)), \\qquad t(y)=\\sum_{i=1}^{m}\\lambda_i y_i, \\qquad \\lambda_i\\gt0, $$\n\nwith image\n\n$$ \\tau_0\\lt\\tau_1\\lt\\cdots\\lt\\tau_{M-1}. $$\n\nLet $C$ be the sign-change count of $F$ along this image, and put\n\n$$ e_{\\min}:=F(\\tau_0), \\qquad e_{\\max}:=F(\\tau_{M-1}). $$\n\nFor a Boolean gate\n\n$$ G:\\lbrace0,1\\rbrace^{k}\\times\\lbrace0,1\\rbrace\\to\\lbrace0,1\\rbrace, $$\n\nwrite\n\n$$ g_e(a):=G(a,e) \\qquad \\text{for }e\\in\\lbrace0,1\\rbrace, $$\n\nand let\n\n$$ N_G:=\\left\\lvert\\lbrace a:g_0(a)\\neq g_1(a)\\rbrace\\right\\rvert. $$\n\nThen\n\n$$ H^{\\ast}\\bigl(G(z,T(y))\\bigr) \\leq N_G C+B_{+}(g_{e_{\\max}},g_{e_{\\min}}). $$\n\n> **Interpretation.** For a multi-raw gate over one positive-statistic feature, the boundary term depends only on the two endpoint raw functions seen at the end and the beginning of each feature slice.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/151_positive_mixed_boundary_gate_bound.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":1,"degree":2},{"id":"152","title":"Equal-Endpoint Multi-Raw Gate Bound","note":"Use the setup of Lemma 151. Suppose the positive-statistic feature has equal endpoint values: Let , and let be the optimized positive-order sign-change count of the raw endpoint function. Then Interpretation. When the feature begins and ends with the same value, repeated raw slices can be joined at a cost equal to the raw endpoint variation.","interpretation":"When the feature begins and ends with the same value, repeated raw slices can be joined at a cost equal to the raw endpoint variation.","claim":"Use the setup of Lemma 151. Suppose the positive-statistic feature has equal endpoint values:\n\n$$ F(\\tau_0)=F(\\tau_{M-1})=e. $$\n\nLet $g_e(a):=G(a,e)$, and let\n\n$$ C_{+}(g_e) := \\min_{\\rho} \\left\\lvert \\left\\lbrace r\\in\\lbrace0,\\ldots,2^k-2\\rbrace: g_e(a^{(r)})\\neq g_e(a^{(r+1)}) \\right\\rbrace \\right\\rvert $$\n\nbe the optimized positive-order sign-change count of the raw endpoint function. Then\n\n$$ H^{\\ast}\\bigl(G(z,T(y))\\bigr) \\leq N_G C+C_{+}(g_e). $$\n\n> **Interpretation.** When the feature begins and ends with the same value, repeated raw slices can be joined at a cost equal to the raw endpoint variation.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/152_equal_endpoint_multi_raw_gate_bound.md","leanCertified":false,"topic":"gates","kind":"theorem","in":0,"out":0,"degree":0},{"id":"153","title":"Mixed Boundary Inequality","note":"For raw functions let Then where is the optimized positive mixed boundary cost from Lemma 151 and is the optimized positive-order sign-change count of a raw function. Consequently, in the setup of Lemma 151, if , then Interpretation. A mixed endpoint boundary can be paid for by ordinary raw variation plus the number of raw assignments where the gate really depends on the feature bit.","interpretation":"A mixed endpoint boundary can be paid for by ordinary raw variation plus the number of raw assignments where the gate really depends on the feature bit.","claim":"For raw functions\n\n$$ p,q:\\lbrace0,1\\rbrace^{k}\\to\\lbrace0,1\\rbrace, $$\n\nlet\n\n$$ D(p,q):= \\left\\lvert \\lbrace a\\in\\lbrace0,1\\rbrace^{k}:p(a)\\neq q(a)\\rbrace \\right\\rvert. $$\n\nThen\n\n$$ B_{+}(p,q) \\leq \\min\\lbrace C_{+}(p),C_{+}(q)\\rbrace+D(p,q), $$\n\nwhere $B_{+}$ is the optimized positive mixed boundary cost from Lemma 151 and $C_{+}$ is the optimized positive-order sign-change count of a raw function.\n\nConsequently, in the setup of Lemma 151, if $F(\\tau_0)\\neq F(\\tau_{M-1})$, then\n\n$$ H^{\\ast}\\bigl(G(z,T(y))\\bigr) \\leq N_G C+\\min\\lbrace C_{+}(g_0),C_{+}(g_1)\\rbrace+N_G. $$\n\n> **Interpretation.** A mixed endpoint boundary can be paid for by ordinary raw variation plus the number of raw assignments where the gate really depends on the feature bit.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/153_mixed_boundary_inequality.md","leanCertified":false,"topic":"gates","kind":"theorem","in":0,"out":1,"degree":1},{"id":"154","title":"Raw-Mask Gate Endpoint Bounds","note":"Let and let be the sign-change count of along the image Put Let be a raw mask, and define For the conjunction we have For the disjunction we have For the raw-mask XOR we have Interpretation. Common raw-mask gates pay for the number of raw slices where the feature is active, and their boundary terms collapse to raw support size or raw positive-order variation.","interpretation":"Common raw-mask gates pay for the number of raw slices where the feature is active, and their boundary terms collapse to raw support size or raw positive-order variation.","claim":"Let\n\n$$ T(y)=F(t(y)), \\qquad t(y)=\\sum_{i=1}^{m}\\lambda_i y_i, \\qquad \\lambda_i\\gt0, $$\n\nand let $C$ be the sign-change count of $F$ along the image\n\n$$ \\tau_0\\lt\\tau_1\\lt\\cdots\\lt\\tau_{M-1}. $$\n\nPut\n\n$$ e_0:=F(\\tau_0), \\qquad e_1:=F(\\tau_{M-1}). $$\n\nLet $R:\\lbrace0,1\\rbrace^{k}\\to\\lbrace0,1\\rbrace$ be a raw mask, and define\n\n$$ r_1:=\\left\\lvert R^{-1}(1)\\right\\rvert, \\qquad r_0:=\\left\\lvert R^{-1}(0)\\right\\rvert, \\qquad C_R:=C_{+}(R). $$\n\nFor the conjunction\n\n$$ A(z,y):=R(z)\\wedge T(y), $$\n\nwe have\n\n$$ H^{\\ast}(A)\\leq \\begin{cases} r_1C, & e_0=e_1=0,\\cr r_1C+C_R, & e_0=e_1=1,\\cr r_1(C+1), & e_0\\neq e_1. \\end{cases} $$\n\nFor the disjunction\n\n$$ O(z,y):=R(z)\\vee T(y), $$\n\nwe have\n\n$$ H^{\\ast}(O)\\leq \\begin{cases} r_0C, & e_0=e_1=1,\\cr r_0C+C_R, & e_0=e_1=0,\\cr r_0(C+1), & e_0\\neq e_1. \\end{cases} $$\n\nFor the raw-mask XOR\n\n$$ X(z,y):=R(z)\\oplus T(y), $$\n\nwe have\n\n$$ H^{\\ast}(X)\\leq \\begin{cases} 2^k C+C_R, & e_0=e_1,\\cr 2^k(C+1)+C_R, & e_0\\neq e_1. \\end{cases} $$\n\n> **Interpretation.** Common raw-mask gates pay for the number of raw slices where the feature is active, and their boundary terms collapse to raw support size or raw positive-order variation.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/154_raw_mask_gate_endpoint_bounds.md","leanCertified":false,"topic":"gates","kind":"theorem","in":0,"out":2,"degree":2},{"id":"155","title":"Multi-Raw Gate Sandwich And Single-Slice Exactness","note":"Let be a nonconstant positive-statistic feature. Write the image of as and let be the sign-change count of along this image. Put For a Boolean gate define and write Let Then the following sandwich holds: Here means if and otherwise. In particular, if then Interpretation. Multi-raw gates over one positive-statistic feature have a usable two-sided bracket. If exactly one raw slice depends on the feature and the endpoint boundary can be made silent, the upper bound is exact whenever the feature itself is exact.","interpretation":"Multi-raw gates over one positive-statistic feature have a usable two-sided bracket. If exactly one raw slice depends on the feature and the endpoint boundary can be made silent, the upper bound is exact whenever the feature itself is exact.","claim":"Let\n\n$$ T(y)=F(t(y)), \\qquad t(y)=\\sum_{i=1}^{m}\\lambda_i y_i, \\qquad \\lambda_i\\gt0, $$\n\nbe a nonconstant positive-statistic feature. Write the image of $t$ as\n\n$$ \\tau_0\\lt\\tau_1\\lt\\cdots\\lt\\tau_{M-1}, $$\n\nand let $C$ be the sign-change count of $F$ along this image. Put\n\n$$ e_{\\min}:=F(\\tau_0), \\qquad e_{\\max}:=F(\\tau_{M-1}). $$\n\nFor a Boolean gate\n\n$$ G:\\lbrace0,1\\rbrace^{k}\\times\\lbrace0,1\\rbrace\\to\\lbrace0,1\\rbrace, $$\n\ndefine\n\n$$ H_G(z,y):=G(z,T(y)), $$\n\nand write\n\n$$ g_e(a):=G(a,e) \\qquad \\text{for }e\\in\\lbrace0,1\\rbrace. $$\n\nLet\n\n$$ N_G:=\\left\\lvert\\lbrace a\\in\\lbrace0,1\\rbrace^{k}:g_0(a)\\neq g_1(a)\\rbrace\\right\\rvert. $$\n\nThen the following sandwich holds:\n\n$$ \\max\\left\\lbrace \\mathbf{1}_{N_G\\gt0}H^{\\ast}(T), H^{\\ast}(g_0), H^{\\ast}(g_1) \\right\\rbrace \\leq H^{\\ast}(H_G) \\leq N_GC+B_{+}(g_{e_{\\max}},g_{e_{\\min}}). $$\n\nHere $\\mathbf{1}_{N_G\\gt0}H^{\\ast}(T)$ means $0$ if $N_G=0$ and $H^{\\ast}(T)$ otherwise.\n\nIn particular, if\n\n$$ H^{\\ast}(T)=C, \\qquad N_G=1, \\qquad B_{+}(g_{e_{\\max}},g_{e_{\\min}})=0, $$\n\nthen\n\n$$ H^{\\ast}(H_G)=C. $$\n\n> **Interpretation.** Multi-raw gates over one positive-statistic feature have a usable two-sided bracket. If exactly one raw slice depends on the feature and the endpoint boundary can be made silent, the upper bound is exact whenever the feature itself is exact.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/155_multi_raw_gate_sandwich_exactness.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":0,"degree":1},{"id":"156","title":"Address Localization Exactness","note":"Let have sign-change count along the ordered image of . Let and let be the two endpoint labels. For a raw address , write If then If then Consequently, in either case, if , then the corresponding localized gate has exact head complexity . More generally, if is any raw mask with and , then If and , then Interpretation. A solved positive-statistic feature can be localized to one raw address at no extra head cost, provided the feature's endpoints match the inactive background label.","interpretation":"A solved positive-statistic feature can be localized to one raw address at no extra head cost, provided the feature's endpoints match the inactive background label.","claim":"Let\n\n$$ T(y)=F(t(y)), \\qquad t(y)=\\sum_{i=1}^{m}\\lambda_i y_i, \\qquad \\lambda_i\\gt0, $$\n\nhave sign-change count $C$ along the ordered image of $t$. Let\n\n$$ d:=\\deg_{\\pm}(T), $$\n\nand let\n\n$$ e_0:=F(\\tau_0), \\qquad e_1:=F(\\tau_{M-1}) $$\n\nbe the two endpoint labels. For a raw address $a\\in\\lbrace0,1\\rbrace^{k}$, write\n\n$$ M_a(z):=\\mathbf{1}[z=a]. $$\n\nIf\n\n$$ e_0=e_1=0, $$\n\nthen\n\n$$ d \\leq H^{\\ast}\\bigl(M_a(z)\\wedge T(y)\\bigr) \\leq C. $$\n\nIf\n\n$$ e_0=e_1=1, $$\n\nthen\n\n$$ d \\leq H^{\\ast}\\bigl((1-M_a(z))\\vee T(y)\\bigr) \\leq C. $$\n\nConsequently, in either case, if $\\deg_{\\pm}(T)=C$, then the corresponding localized gate has exact head complexity $C$.\n\nMore generally, if $R:\\lbrace0,1\\rbrace^{k}\\to\\lbrace0,1\\rbrace$ is any raw mask with $r_1=\\lvert R^{-1}(1)\\rvert\\gt0$ and $e_0=e_1=0$, then\n\n$$ d \\leq H^{\\ast}\\bigl(R(z)\\wedge T(y)\\bigr) \\leq r_1C. $$\n\nIf $r_0=\\lvert R^{-1}(0)\\rvert\\gt0$ and $e_0=e_1=1$, then\n\n$$ d \\leq H^{\\ast}\\bigl(R(z)\\vee T(y)\\bigr) \\leq r_0C. $$\n\n> **Interpretation.** A solved positive-statistic feature can be localized to one raw address at no extra head cost, provided the feature's endpoints match the inactive background label.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/156_address_localization_exactness.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":0,"degree":1},{"id":"157","title":"Few-Run Raw-Mask Gate Theorem","note":"Let be a raw mask. Suppose there is a positive raw statistic with distinct subset sums, such that the ordered truth sequence of along has true intervals. Let where is the raw order induced by . Define Then Now let be a positive-statistic feature with sign-change count and endpoint labels Put For , For , For , Interpretation. If the raw mask has few runs in some positive raw order, the raw-boundary term in the mask-gate theorem is controlled by that run count. Endpoint masks have , and one-interval masks have .","interpretation":"If the raw mask has few runs in some positive raw order, the raw-boundary term in the mask-gate theorem is controlled by that run count. Endpoint masks have , and one-interval masks have .","claim":"Let $R:\\lbrace0,1\\rbrace^{k}\\to\\lbrace0,1\\rbrace$ be a raw mask. Suppose there is a positive raw statistic\n\n$$ s(z)=\\sum_{j=1}^{k}\\rho_jz_j, \\qquad \\rho_j\\gt0, $$\n\nwith distinct subset sums, such that the ordered truth sequence of $R$ along $s$ has $q$ true intervals. Let\n\n$$ \\epsilon_0:=R(a^{(0)}), \\qquad \\epsilon_1:=R(a^{(2^k-1)}), $$\n\nwhere\n\n$$ a^{(0)},a^{(1)},\\ldots,a^{(2^k-1)} $$\n\nis the raw order induced by $s$. Define\n\n$$ K_R:= \\begin{cases} 0, & q=0,\\cr 2q-\\epsilon_0-\\epsilon_1, & q\\geq1. \\end{cases} $$\n\nThen\n\n$$ C_{+}(R)\\leq K_R\\leq2q. $$\n\nNow let\n\n$$ T(y)=F(t(y)) $$\n\nbe a positive-statistic feature with sign-change count $C$ and endpoint labels\n\n$$ e_0:=F(\\tau_0), \\qquad e_1:=F(\\tau_{M-1}). $$\n\nPut\n\n$$ r_1:=\\lvert R^{-1}(1)\\rvert, \\qquad r_0:=\\lvert R^{-1}(0)\\rvert. $$\n\nFor $A=R\\wedge T$,\n\n$$ H^{\\ast}(A)\\leq \\begin{cases} r_1C, & e_0=e_1=0,\\cr r_1C+K_R, & e_0=e_1=1,\\cr r_1(C+1), & e_0\\neq e_1. \\end{cases} $$\n\nFor $O=R\\vee T$,\n\n$$ H^{\\ast}(O)\\leq \\begin{cases} r_0C, & e_0=e_1=1,\\cr r_0C+K_R, & e_0=e_1=0,\\cr r_0(C+1), & e_0\\neq e_1. \\end{cases} $$\n\nFor $X=R\\oplus T$,\n\n$$ H^{\\ast}(X)\\leq \\begin{cases} 2^kC+K_R, & e_0=e_1,\\cr 2^k(C+1)+K_R, & e_0\\neq e_1. \\end{cases} $$\n\n> **Interpretation.** If the raw mask has few runs in some positive raw order, the raw-boundary term in the mask-gate theorem is controlled by that run count. Endpoint masks have $K_R\\leq1$, and one-interval masks have $K_R\\leq2$.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/157_few_run_raw_mask_gate_theorem.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":0,"degree":1},{"id":"158","title":"Shared-Statistic Slice Sandwich","note":"Let , let be raw bits, and let Write the image of as Suppose every raw slice of factors through : Let be the sign-change count of along . Define the endpoint raw functions Then In particular, if there is a label such that then If, moreover, exactly one raw slice is nonconstant and that slice satisfies , then Interpretation. For arbitrary raw slices sharing one positive statistic, the only price beyond within-slice variation is the optimized mixed endpoint boundary. Common endpoints remove the boundary price entirel","interpretation":"For arbitrary raw slices sharing one positive statistic, the only price beyond within-slice variation is the optimized mixed endpoint boundary. Common endpoints remove the boundary price entirely.","claim":"Let $k\\geq1$, let $z\\in\\lbrace0,1\\rbrace^{k}$ be raw bits, and let\n\n$$ t(y)=\\sum_{i=1}^{m}\\lambda_i y_i, \\qquad \\lambda_i\\gt0. $$\n\nWrite the image of $t$ as\n\n$$ \\tau_0\\lt\\tau_1\\lt\\cdots\\lt\\tau_{M-1}. $$\n\nSuppose every raw slice of $f(z,y)$ factors through $t$:\n\n$$ f(a,y)=F_a(t(y)) \\qquad \\text{for every }a\\in\\lbrace0,1\\rbrace^{k}. $$\n\nLet $C_a$ be the sign-change count of $F_a$ along $\\tau_0,\\ldots,\\tau_{M-1}$. Define the endpoint raw functions\n\n$$ q(a):=F_a(\\tau_0), \\qquad p(a):=F_a(\\tau_{M-1}). $$\n\nThen\n\n$$ \\max_{a\\in\\lbrace0,1\\rbrace^{k}}H^{\\ast}\\bigl(F_a(t(y))\\bigr) \\leq H^{\\ast}(f) \\leq \\sum_{a\\in\\lbrace0,1\\rbrace^{k}}C_a+B_{+}(p,q). $$\n\nIn particular, if there is a label $b\\in\\lbrace0,1\\rbrace$ such that\n\n$$ F_a(\\tau_0)=F_a(\\tau_{M-1})=b \\qquad \\text{for every }a, $$\n\nthen\n\n$$ \\max_a H^{\\ast}\\bigl(F_a(t(y))\\bigr) \\leq H^{\\ast}(f) \\leq \\sum_a C_a. $$\n\nIf, moreover, exactly one raw slice is nonconstant and that slice satisfies $H^{\\ast}(F_a(t(y)))=C_a$, then\n\n$$ H^{\\ast}(f)=C_a. $$\n\n> **Interpretation.** For arbitrary raw slices sharing one positive statistic, the only price beyond within-slice variation is the optimized mixed endpoint boundary. Common endpoints remove the boundary price entirely.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/158_shared_statistic_slice_sandwich.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":3,"degree":4},{"id":"159","title":"Shared-Statistic Degree Sandwich","note":"Use the setup of Theorem 158. Suppose that for each raw assignment there is a univariate polynomial of degree at most such that for every . Let and define the endpoint raw functions Then In particular, if for all , then If all endpoints are a common label , then Interpretation. Slice threshold degree gives the lower side, univariate sign-polynomial degree gives the upper side, and the only coupling term is the mixed endpoint boundary.","interpretation":"Slice threshold degree gives the lower side, univariate sign-polynomial degree gives the upper side, and the only coupling term is the mixed endpoint boundary.","claim":"Use the setup of Theorem 158. Suppose that for each raw assignment $a$ there is a univariate polynomial $P_a(u)$ of degree at most $d_a$ such that\n\n$$ \\mathrm{sgn}(P_a(t(y)))= \\begin{cases} +1 & \\text{if } f(a,y)=1,\\cr -1 & \\text{if } f(a,y)=0 \\end{cases} $$\n\nfor every $y\\in\\lbrace0,1\\rbrace^{m}$. Let\n\n$$ \\delta_a:=\\deg_{\\pm}\\bigl(F_a(t(y))\\bigr), $$\n\nand define the endpoint raw functions\n\n$$ q(a):=F_a(\\tau_0), \\qquad p(a):=F_a(\\tau_{M-1}). $$\n\nThen\n\n$$ \\max_a \\delta_a \\leq H^{\\ast}(f) \\leq \\sum_a d_a+B_{+}(p,q). $$\n\nIn particular, if $d_a\\leq d$ for all $a$, then\n\n$$ H^{\\ast}(f)\\leq2^k d+B_{+}(p,q). $$\n\nIf all endpoints are a common label $b$, then\n\n$$ \\max_a\\delta_a \\leq H^{\\ast}(f) \\leq \\sum_a d_a. $$\n\n> **Interpretation.** Slice threshold degree gives the lower side, univariate sign-polynomial degree gives the upper side, and the only coupling term is the mixed endpoint boundary.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/159_shared_statistic_degree_sandwich.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":1,"degree":2},{"id":"160","title":"Addressed Common-Endpoint Direct Sum","note":"Let be a set of raw addresses. Let with ordered image For each , let be a positive-statistic feature with sign-change count . Suppose there is a common background label such that Define a function by Then Consequently, if and , then More generally, if each has a univariate sign polynomial in of degree at most , then Interpretation. Several features with the same endpoint background can be placed at disjoint raw addresses with additive head cost and no boundary penalty. A single addressed exact feature stays exact.","interpretation":"Several features with the same endpoint background can be placed at disjoint raw addresses with additive head cost and no boundary penalty. A single addressed exact feature stays exact.","claim":"Let $A\\subseteq\\lbrace0,1\\rbrace^{k}$ be a set of raw addresses. Let\n\n$$ t(y)=\\sum_{i=1}^{m}\\lambda_i y_i, \\qquad \\lambda_i\\gt0, $$\n\nwith ordered image\n\n$$ \\tau_0\\lt\\tau_1\\lt\\cdots\\lt\\tau_{M-1}. $$\n\nFor each $a\\in A$, let\n\n$$ T_a(y)=F_a(t(y)) $$\n\nbe a positive-statistic feature with sign-change count $C_a$. Suppose there is a common background label $b\\in\\lbrace0,1\\rbrace$ such that\n\n$$ F_a(\\tau_0)=F_a(\\tau_{M-1})=b \\qquad \\text{for every }a\\in A. $$\n\nDefine a function $f_A(z,y)$ by\n\n$$ f_A(a,y)=T_a(y) \\quad\\text{for }a\\in A, \\qquad f_A(a,y)=b \\quad\\text{for }a\\notin A. $$\n\nThen\n\n$$ \\max_{a\\in A}H^{\\ast}(T_a) \\leq H^{\\ast}(f_A) \\leq \\sum_{a\\in A}C_a. $$\n\nConsequently, if $A=\\lbrace a_0\\rbrace$ and $H^{\\ast}(T_{a_0})=C_{a_0}$, then\n\n$$ H^{\\ast}(f_A)=C_{a_0}. $$\n\nMore generally, if each $T_a$ has a univariate sign polynomial in $t$ of degree at most $d_a$, then\n\n$$ \\max_{a\\in A}\\deg_{\\pm}(T_a) \\leq H^{\\ast}(f_A) \\leq \\sum_{a\\in A}d_a. $$\n\n> **Interpretation.** Several features with the same endpoint background can be placed at disjoint raw addresses with additive head cost and no boundary penalty. A single addressed exact feature stays exact.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/160_addressed_common_endpoint_direct_sum.md","leanCertified":false,"topic":"gates","kind":"theorem","in":2,"out":0,"degree":2},{"id":"161","title":"Endpoint Variation Shared-Statistic Bound","note":"Use the setup of Theorem 158. Thus every raw slice factors through one positive statistic: Let be the sign-change count of along the ordered image of , and define endpoint raw functions Then where Moreover, suppose has a positive raw order in which its true set has intervals and endpoint labels . Define Define analogously if has such a run certificate. If both certificates are available, then Interpretation. The endpoint coupling can be bounded by ordinary raw endpoint variation plus the number of slices whose two ","interpretation":"The endpoint coupling can be bounded by ordinary raw endpoint variation plus the number of slices whose two endpoints disagree. Few-run endpoint functions give a concrete version of the bound.","claim":"Use the setup of Theorem 158. Thus every raw slice factors through one positive statistic:\n\n$$ f(a,y)=F_a(t(y)), \\qquad t(y)=\\sum_i\\lambda_i y_i, \\qquad \\lambda_i\\gt0. $$\n\nLet $C_a$ be the sign-change count of $F_a$ along the ordered image of $t$, and define endpoint raw functions\n\n$$ q(a):=F_a(\\tau_0), \\qquad p(a):=F_a(\\tau_{M-1}). $$\n\nThen\n\n$$ H^{\\ast}(f) \\leq \\sum_a C_a+\\min\\lbrace C_{+}(p),C_{+}(q)\\rbrace+D(p,q), $$\n\nwhere\n\n$$ D(p,q):=\\left\\lvert\\lbrace a:p(a)\\neq q(a)\\rbrace\\right\\rvert. $$\n\nMoreover, suppose $p$ has a positive raw order in which its true set has $q_p$ intervals and endpoint labels $\\epsilon^p_0,\\epsilon^p_1$. Define\n\n$$ K_p:= \\begin{cases} 0, & q_p=0,\\cr 2q_p-\\epsilon^p_0-\\epsilon^p_1, & q_p\\geq1. \\end{cases} $$\n\nDefine $K_q$ analogously if $q$ has such a run certificate. If both certificates are available, then\n\n$$ H^{\\ast}(f) \\leq \\sum_a C_a+\\min\\lbrace K_p,K_q\\rbrace+D(p,q). $$\n\n> **Interpretation.** The endpoint coupling can be bounded by ordinary raw endpoint variation plus the number of slices whose two endpoints disagree. Few-run endpoint functions give a concrete version of the bound.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/161_endpoint_variation_shared_statistic_bound.md","leanCertified":false,"topic":"gates","kind":"theorem","in":2,"out":0,"degree":2},{"id":"162","title":"Positive Concatenation Exactness Criterion","note":"Let have a shared positive-statistic certificate as in Theorem 158. Fix a positive raw order , and let be the sign-change count of the concatenated slice sequence in that raw order. Then Consequently, if for some shared positive-statistic certificate and some positive raw order , then Let where the minimum ranges over all shared positive-statistic certificates for the raw slices, and are the endpoint raw functions attached to . Then In particular, if then Interpretation. Any positive concatenation upper bound becom","interpretation":"Any positive concatenation upper bound becomes an exact theorem once threshold degree reaches the same value. The optimized endpoint-coupled cost gives a compact exactness target.","claim":"Let $f(z,y)$ have a shared positive-statistic certificate as in Theorem 158. Fix a positive raw order $\\rho$, and let\n\n$$ L_{\\rho}(f) := \\sum_a C_a+J_{\\rho}(f) $$\n\nbe the sign-change count of the concatenated slice sequence in that raw order.\n\nThen\n\n$$ \\deg_{\\pm}(f) \\leq H^{\\ast}(f) \\leq L_{\\rho}(f). $$\n\nConsequently, if\n\n$$ \\deg_{\\pm}(f)=L_{\\rho}(f) $$\n\nfor some shared positive-statistic certificate and some positive raw order $\\rho$, then\n\n$$ H^{\\ast}(f)=\\deg_{\\pm}(f)=L_{\\rho}(f). $$\n\nLet\n\n$$ \\mathrm{eps}_{+}^{z\\mid y}(f) := \\min_t \\left( \\sum_a C_a+B_{+}(p,q) \\right), $$\n\nwhere the minimum ranges over all shared positive-statistic certificates $t$ for the raw slices, and $p,q$ are the endpoint raw functions attached to $t$. Then\n\n$$ \\deg_{\\pm}(f) \\leq H^{\\ast}(f) \\leq \\mathrm{eps}_{+}^{z\\mid y}(f). $$\n\nIn particular, if\n\n$$ \\deg_{\\pm}(f)=\\mathrm{eps}_{+}^{z\\mid y}(f), $$\n\nthen\n\n$$ H^{\\ast}(f)=\\deg_{\\pm}(f)=\\mathrm{eps}_{+}^{z\\mid y}(f). $$\n\n> **Interpretation.** Any positive concatenation upper bound becomes an exact theorem once threshold degree reaches the same value. The optimized endpoint-coupled cost gives a compact exactness target.","proofUrl":"https://github.com/VerifiedMechanisms/rs-takehome/blob/main/theorems/05_positive_statistic_gates_and_grids/162_positive_concatenation_exactness_criterion.md","leanCertified":false,"topic":"gates","kind":"theorem","in":1,"out":0,"degree":1},{"id":"163","title":"Endpoint-Coupled Slice Cost Invariant","note":"For a fixed split of variables with , define the endpoint-coupled positive slice cost where ranges over all positive statistics through which every raw slice factors, is the sign-change count of along the ordered image of , and Then Moreover, where is the optimized ordered-slice cost from Lemma 149. The cost is invariant under output complement: It is also invariant under permutations of the raw coordinates and under permutations of the feature coordinates. Interpretation. The optimized endpoint-coupled cost is a s","interpretation":"The optimized endpoint-coupled cost is a sharper split invariant than the ordered-slice cost because it optimizes the endpoint boundary separately from the
